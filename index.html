nary | II. The Pesticides Board | III. Control of importation and manufacture of pesticides by | registration and permit | IV. Control of manufacturer, sale and storage of pesticides by | licensing | V. Control of presence of pesticides in food | VI. Death and injury …"]]},{"q":"Di bawah Bahagian V Akta Racun Makhluk Perosak, yang manakah BUKAN pembelaan bagi kesalahan menjual makanan tercemar?","o":["Tidak mengetahui tentang pencemaran","Bergantung pada waranti bertulis","Bergantung pada pernyataan bertulis","Tiada pilihan lain disenaraikan"],"a":0,"e":"Bahagian V: ketidaktahuan tentang pencemaran bukan pembelaan; pembelaan yang dibenarkan ialah bergantung pada waranti atau pernyataan bertulis.","r":[[49,577,"PART V: CONTROL OF PRESENCE OF PESTICIDES IN FOOD | MAIN PROVISIONS | • Regulations to control presence of pesticides in food | • Entry, inspection and seizure | • Power to demand, select and take samples | • Right to analysis of food | • Offence of selling contaminated food | • Ignorance of contaminating not a …"]]},{"q":"Undang-Undang Kecil Bangunan Seragam (UBBL) 1984 mengandungi berapa Bahagian?","o":["9 Bahagian","15 Bahagian","11 Bahagian","6 Bahagian"],"a":0,"e":"UBBL 1984 mengandungi sembilan (9) Bahagian termasuk keperluan pemasangan keselamatan kebakaran dan sistem penggera kebakaran.","r":[[53,579,"CONTENTS | Nine (9) Parts | I. Preliminary | A. Demolition of buildings | II. Submission of plans for approval. | III. Space, light and ventilation | IV. Temporary work in connection with building operations | V. Structural requirements | VI. Constructional requirements | VII. Fire safety installation requirements …"]]},{"q":"Bahagian manakah UBBL 1984 berkaitan dengan sistem penggera kebakaran dan sistem pemadaman kebakaran?","o":["Bahagian VII","Bahagian VIII","Bahagian V","Bahagian III"],"a":1,"e":"Bahagian VII: keperluan pemasangan keselamatan kebakaran; Bahagian VIII: sistem penggera kebakaran dan sistem pemadaman kebakaran.","r":[[53,579,"CONTENTS | Nine (9) Parts | I. Preliminary | A. Demolition of buildings | II. Submission of plans for approval. | III. Space, light and ventilation | IV. Temporary work in connection with building operations | V. Structural requirements | VI. Constructional requirements | VII. Fire safety installation requirements …"]]}]}]},{"n":2,"title":"Keselamatan Pekerjaan","en":"Occupational Safety","chapters":[{"id":"2.01","title":"Machinery Hazard","total":42,"qs":[{"q":"Menurut OSHA 1994, 'Plant' ditakrifkan sebagai:","o":["Bahan mentah yang diproses","Bangunan kilang sahaja","Tumbuhan di kawasan tempat kerja","Mana-mana jentera, kelengkapan, perkakas, alat atau komponennya dan apa-apa yang dipasang atau disambungkan kepadanya"],"a":3,"e":"Plant: any machinery, equipment, appliance, implement or tool, any component thereof and anything fitted, connected or appurtenant thereto (OSHA 1994).","r":[[5,6,"DEFINITION | Plant: Any machinery, equipment, appliance, implement or tool, any component thereof and anything fitted, connected or appurtenant thereto. | Occupational Safety and Health Act (OSHA) 1994 | 5"]]},{"q":"Dandang stim, pengandung tekanan dan enjin dikategorikan sebagai jentera jenis:","o":["Penghantar kuasa (power-transmitting)","Penjana kuasa (power-generating)","Dipacu kuasa (power-driven)","Pengendalian bahan"],"a":1,"e":"Power-generating machinery: dandang stim, pengandung tekanan dan penggerak utama (enjin, turbin, motor).","r":[[6,6,"TYPES OF MACHINERY | 1. Power-Generating Machinery • Steam boilers • Pressure vessels • Prime movers (e.g., engines, turbines, motor) | 2. Power-Transmitting Machinery • Gears, pulleys, belts, shafts • Transmission systems | 3. Power-Driven Machinery • Pumps, compressors • Lathes, milling machines, drills • …"]]},{"q":"Gear, takal, tali sawat dan aci adalah contoh jentera:","o":["Dipacu kuasa","Penghantar kuasa (power-transmitting)","Penjana kuasa","Pengangkat"],"a":1,"e":"Power-transmitting machinery: gear, takal, tali sawat, aci dan sistem transmisi.","r":[[6,6,"TYPES OF MACHINERY | 1. Power-Generating Machinery • Steam boilers • Pressure vessels • Prime movers (e.g., engines, turbines, motor) | 2. Power-Transmitting Machinery • Gears, pulleys, belts, shafts • Transmission systems | 3. Power-Driven Machinery • Pumps, compressors • Lathes, milling machines, drills • …"]]},{"q":"Mata pisau pada gergaji rantai merupakan contoh bahagian jentera yang:","o":["Penjana tenaga","Tidak operatif","Operatif / berfungsi","Penghantar kuasa"],"a":2,"e":"Bahagian operatif melaksanakan output fungsi seperti mata pisau gergaji rantai; bahagian tidak operatif membekalkan kuasa atau pergerakan.","r":[[7,7,"MACHINERY PARTS | 1. Operative / Functional • Implements the functional output such as the blade on a chain saw. | 2. Non operative / Non functional • Supplies power or movements to the operational parts such as the force of the motor | 7"]]},{"q":"Seksyen OSHA 1994 yang mewajibkan majikan menyediakan dan menyelenggara loji dan sistem kerja ialah:","o":["Seksyen 15(2)(a)","Seksyen 24","Seksyen 20(1)","Seksyen 27A"],"a":0,"e":"Seksyen 15(2)(a): penyediaan dan penyelenggaraan loji dan sistem kerja.","r":[[9,8,"GENERAL DUTIES OF EMPLOYER AND SELF- EMPLOYED PERSONS & PRINCIPAL - SEC 15(2), OSHA 1994 | (a)The provision and maintenance of plant and systems of work. | • The plant is intended to be properly maintained, installed or equipped with machinery, equipment, hardware, tools or components. | • The safe working system …"]]},{"q":"Kewajipan pereka bentuk, pengilang dan pembekal berkaitan jentera dinyatakan dalam:","o":["Seksyen 24 OSHA 1994","Seksyen 15(2) OSHA 1994","Seksyen 18A OSHA 1994","Seksyen 20(1) OSHA 1994"],"a":3,"e":"Seksyen 20(1): memastikan loji direka bentuk dan dibina selamat, mengatur ujian, menyediakan maklumat, penyelidikan dan pemasangan selamat.","r":[[11,9,"GENERAL DUTIES OF DESIGNER, MANUFACTURER AND SUPPLIER – SEC 20(1), OSHA 1994 | (a)Ensure plant or material are designed and constructed to be safe | and without risk to health when properly used. | (b)Arrange for carrying out testing and examination. | (c)Prepare adequate information. | (d)Prepare or arrange …"]]},{"q":"Berapakah jenis bahaya jentera yang diterangkan dalam bab ini?","o":["10 jenis","12 jenis","6 jenis","8 jenis"],"a":0,"e":"10 bahaya jentera: memotong, ricih, tikam/tusuk, hentaman, belitan, geseran/lelasan, hancur, tertarik masuk, lontaran dan pelepasan tenaga keupayaan.","r":[[14,10,"MACHINERY HAZARDS | 1. Cutting 2. Shearing 3. Stabbing and Puncturing 4. Impact 5. Entanglement 6. Friction and Abrasion 7. Crushing 8. Drawing In 9. Ejection 10. Release of Potential Energy | 14"]]},{"q":"Bahaya di mana pakaian, sarung tangan atau rambut tersangkut pada bahagian jentera yang berputar dipanggil:","o":["Belitan (entanglement)","Hentaman (impact)","Lontaran (ejection)","Ricih (shearing)"],"a":0,"e":"Entanglement: pakaian atau rambut terbelit pada bahagian jentera yang berputar atau bergerak.","r":[[23,15,"ENTANGLEMENT | • Clothing or hair becomes entangled with a spinning or moving machine part. | • Example: clothing, gloves, or jewelry can get caught and pull the worker in. | 23"]]},{"q":"Bahaya 'impact' berbeza daripada 'stabbing and puncturing' kerana:","o":["Melibatkan bahan kimia","Melibatkan api","Objek menembusi kulit","Objek atau bahagian jentera mengenai badan tetapi tidak menembusinya"],"a":3,"e":"Impact: objek atau bahagian jentera mengenai badan tetapi tidak menusuk atau menembusinya.","r":[[21,14,"IMPACT | • Object or machine part hits the body but does not puncture or pierce through it. | • Example: Hit by a moving object/part | 21"]]},{"q":"Bahaya ricih (shearing) berlaku:","o":["Antara dua bahagian bergerak atau antara bahagian statik dan bergerak","Apabila badan disentuh permukaan panas","Apabila tekanan dilepaskan","Apabila bahan terpelanting keluar"],"a":0,"e":"Shearing: di antara dua bahagian mesin bergerak, antara bahagian mesin dan bahan, atau antara bahagian statik dan bergerak.","r":[[17,12,"SHEARING | • Take out or separate by cutting. • In between two moving machines; – Between machine part and material – Between static and moving machine parts | • Example: fingers, hands, or other body parts can be caught by the moving blade during operation. | 17"]]},{"q":"Gear dan penggelek (roller) adalah contoh bahagian jentera yang menyebabkan bahaya:","o":["Lontaran","Geseran","Tikaman","Tertarik masuk (drawing in)"],"a":3,"e":"Drawing in: badan ditarik ke arah mesin dan terperangkap di antara bahagian bergerak; contoh gear dan roller.","r":[[30,18,"DRAWING IN | Gears | Roller | 30"]]},{"q":"Lontaran (ejection) bahan atau bahagian jentera biasanya disebabkan oleh:","o":["Bilik terlalu sejuk","Kegagalan mesin atau kegagalan bahan","Pencahayaan malap","Pekerja memakai PPE"],"a":1,"e":"Ejection: bahan atau bahagian mesin terpelanting keluar akibat kegagalan mesin atau kegagalan bahan.","r":[[31,19,"EJECTION | • The material or machine part is pushed out | • Reason: – Machine failure – Material failure | • Example: broken tooling or metal scraps can be ejected suddenly. | 31"]]},{"q":"Pelepasan tekanan, objek jatuh dan tenaga dalam spring yang tidak dilepaskan adalah contoh bahaya:","o":["Ricih","Belitan","Geseran","Pelepasan tenaga keupayaan"],"a":3,"e":"Release of potential energy: contoh pelepasan tekanan, objek jatuh dan tenaga spring yang belum dilepaskan.","r":[[32,19,"RELEASE OF POTENTIAL ENERGY | • Example: – Release of pressure – Falling object – Unreleased energy in a spring | 32"]]},{"q":"Melecur atau koyakan pada lapisan luar kulit akibat digosok oleh tali sawat bergerak dikategorikan sebagai bahaya:","o":["Hancur","Hentaman","Geseran atau lelasan (friction or abrasion)","Tikaman"],"a":2,"e":"Friction or abrasion: melecur atau koyakan kulit luar, contohnya tangan atau pakaian tergosok pada tali sawat bergerak.","r":[[25,16,"FRICTION OR ABRASION | • Burns or tear on the skin’s outer layer. | • Example: hands, arms, or clothing can be rubbed or dragged along moving belts, causing burns or abrasions. | 25"]]},{"q":"Dalam kemalangan mesin pengisar daging di Melaka (2019), apakah kegagalan utama yang menyebabkan kematian?","o":["Pekerja tidak memakai topi keledar","Mesin tidak diasingkan daripada sumber kuasa (kegagalan Lockout/Tagout)","Lantai licin","Pencahayaan tidak mencukupi"],"a":1,"e":"Mesin tidak diasingkan dengan betul daripada sumber kuasanya (kegagalan LOTO) dan dihidupkan semasa mangsa masih di zon penyelenggaraan.","r":[[34,20,"ACCIDENT Meat Processing Machine Fatality in Malacca (2019) | Background | In July 2019, a fatal workplace accident occurred at a meat-processing factory near Masjid Tanah, Malacca. The victim was a 47-year-old Nepalese worker who had been employed to carry out maintenance tasks alongside three co-workers. The …"]]},{"q":"Dalam kes Melaka 2019, mangsa ialah pekerja berumur:","o":["52 tahun","35 tahun","47 tahun","27 tahun"],"a":2,"e":"Mangsa ialah pekerja warga Nepal berumur 47 tahun yang melakukan kerja penyelenggaraan bersama tiga rakan.","r":[[34,20,"ACCIDENT Meat Processing Machine Fatality in Malacca (2019) | Background | In July 2019, a fatal workplace accident occurred at a meat-processing factory near Masjid Tanah, Malacca. The victim was a 47-year-old Nepalese worker who had been employed to carry out maintenance tasks alongside three co-workers. The …"]]},{"q":"Dalam hierarki kawalan bahaya jentera, PPE diletakkan sebagai:","o":["Langkah paling berkesan","Langkah pertama","Pengganti kepada pengadang mesin","Perlindungan terakhir apabila langkah lain gagal atau sebagai tambahan"],"a":3,"e":"Kawalan: hapus, ganti, asingkan, ubah suai fizikal, ubah cara kerja; PPE memberi perlindungan hanya jika semua langkah lain gagal atau sebagai tambahan.","r":[[37,22,"CONTROL | • Remove the hazard completely if possible • Replace the hazardous machine, material, or process with a safer alternative. • Physically separating people from dangerous machine energy sources to prevent accidental operation or exposure. • Physical changes to the machine or work environment to reduce risk. …"]]},{"q":"Langkah PERTAMA dalam tindakan kecemasan melibatkan jentera ialah:","o":["Siasat punca","Laporkan kepada JKKP","Latih semula pekerja","Hentikan dan asingkan – tekan butang henti kecemasan dan putuskan kuasa"],"a":3,"e":"Tindakan kecemasan bermula dengan Stop & Isolate, diikuti membunyikan amaran, pertolongan cemas, mengamankan kawasan, melapor, menyiasat dan membetulkan.","r":[[38,22,"EMERGENCY | •Stop & Isolate – Press emergency stop, cut off power/energy. | •Raise Alarm – Alert coworkers, supervisor, safety team. | •First Aid – Trained first aider provides care; call ambulance if serious. | •Secure Area – Keep others away, prevent further accidents. | •Report to nearest DOSH office – Notify …"]]},{"q":"Pekerja yang membersihkan mesin tanpa mengasingkan kuasa terdedah kepada risiko permulaan tidak dijangka. Kawalan yang paling sesuai ialah:","o":["Menambah pencahayaan","Bekerja lebih pantas","Prosedur Lockout/Tagout (LOTO)","Memakai sarung tangan"],"a":2,"e":"Kemalangan Melaka menunjukkan kegagalan LOTO; mengasingkan sumber tenaga sebelum penyelenggaraan mencegah permulaan tidak dijangka.","r":[[34,20,"ACCIDENT Meat Processing Machine Fatality in Malacca (2019) | Background | In July 2019, a fatal workplace accident occurred at a meat-processing factory near Masjid Tanah, Malacca. The victim was a 47-year-old Nepalese worker who had been employed to carry out maintenance tasks alongside three co-workers. The …"],[40,23,"ACTIVITY TABLE | Scenario Potential Hazard Control Measure | Worker’s sleeve caught near conveyor belt | Unguarded rotating drill bit | Worker cleaning machine without isolating power Exposed electrical wiring on machine Worker not wearing ear protection near loud press machine | 40"]]},{"q":"Menurut kesimpulan, kaedah mengawal bahaya jentera melibatkan:","o":["Menambah bilangan pekerja","Pembelian mesin baharu sahaja","Pengenalpastian risiko, penilaian risiko dan kawalan risiko","Insurans pekerja"],"a":2,"e":"Kesimpulan: kawalan bahaya jentera memerlukan Risk Identification, Risk Assessment dan Risk Control.","r":[[41,24,"CONCLUSION | • Machinery improves efficiency but poses serious hazards such as cutting, crushing, entanglement, and ejection. | • With proper safeguarding, training, and safe work practices, risks can be minimized to protect workers and ensure a safer workplace. | • In controlling these hazards, various methods …"]]}]},{"id":"2.02","title":"Safeguarding of Machinery","total":58,"qs":[{"q":"Salah satu kepentingan perlindungan jentera ialah:","o":["Mengurangkan kos elektrik","Meningkatkan kelajuan mesin","Mengelakkan pemeriksaan JKKP","Melindungi pekerja daripada bahagian berbahaya mesin yang mungkin tidak dikilang atau diletakkan dengan selamat"],"a":3,"e":"Perlindungan jentera penting untuk melindungi pekerja daripada bahagian berbahaya dan mencegah kemalangan berkaitan jentera.","r":[[5,28,"MACHINERY PROTECTION | Machinery Protection is important to: | 1) Protect workers from the hazardous parts of a machine that may have not been manufactured or positioned in a safe manner. | 2) Prevent machinery related accidents. | 5"]]},{"q":"Pengadang mesin berfungsi sebagai:","o":["Alat meningkatkan pengeluaran","Hiasan pada mesin","Penghalang kecederaan sekiranya kaedah pencegahan lain gagal","Pengganti latihan pekerja"],"a":2,"e":"Perlindungan jentera bertindak sebagai penghalang kecederaan sekiranya kaedah pencegahan lain gagal dan diletakkan strategik untuk mengelak sentuhan.","r":[[6,28,"MACHINERY PROTECTION | • Acts as a barrier to injuries in cases of failure of other preventive methods. | • Strategically positioned so as to prevent contact with hazardous machinery parts/processes. | 6"]]},{"q":"Pengenalpastian keselamatan mesin boleh dibuat dari dua aspek iaitu:","o":["Harga dan jenama","Pembuatan (reka bentuk) dan kedudukan","Warna dan saiz","Umur dan berat"],"a":1,"e":"Identification of safety in terms of: Manufacturing (design) dan Position.","r":[[12,31,"MACHINERY PROTECTION | Identification of Safety in terms of: | • Manufacturing (design) | • Position | 12"]]},{"q":"Contoh keselamatan melalui reka bentuk (manufacturing) ialah:","o":["Mesin diletak di bilik tertutup","Pekerja memakai sarung tangan","Mesin dicat kuning","Aci berdiameter besar direka untuk berputar pada kelajuan lebih rendah"],"a":3,"e":"Manufacturing: bahagian berbahaya direka khusus untuk mengurangkan bahaya, contohnya aci berdiameter besar berputar lebih perlahan.","r":[[13,32,"MACHINERY PROTECTION | Manufacturing: •Hazardous parts are specifically designed to reduce the hazard. | Example: Shaft with a large diameter is designed to spin at a lower speed. | 10"]]},{"q":"Keperluan minimum perlindungan pekerja daripada bahaya mekanikal TIDAK termasuk:","o":["Mengelak sentuhan dengan bahaya","Mencegah objek jatuh ke dalam mesin","Tidak mewujudkan bahaya baharu","Meningkatkan kelajuan pengeluaran"],"a":3,"e":"Keperluan minimum: elak sentuhan, cegah objek jatuh ke dalam mesin, tidak cipta bahaya baharu dan tidak menyebabkan halangan atau gangguan.","r":[[14,32,"MACHINERY PROTECTION | Minimum requirements in protecting workers from mechanical hazards are: | • Avoids contact with hazards • Prevents objects from falling into the machine • Does not create new hazards • Does not cause obstructions or distractions | 14"]]},{"q":"Perlindungan jentera boleh dikategorikan kepada:","o":["Elektrik, mekanikal dan kimia","Manual, separa automatik dan robotik sahaja","Hadapan, belakang dan sisi","Pengadang, peranti, pengasingan, operasi dan kaedah lain"],"a":3,"e":"Kategori perlindungan: Guards, Devices, Isolation, Operations dan Other protection methods.","r":[[17,34,"CATEGORIES OF PROTECTION | Protection can be categorised into: • Guards • Devices • Isolation • Operations • Other protection methods | 17"]]},{"q":"Pengadang yang dipasang kekal pada jentera dan tidak mempunyai bahagian bergerak ialah:","o":["Pengadang boleh laras","Pengadang saling kunci","Pengadang automatik","Pengadang tetap (fixed guard)"],"a":3,"e":"Fixed guard: dipasang kekal, fungsinya tidak bergantung pada bahagian bergerak dan tidak mempunyai bahagian bergerak.","r":[[20,35,"FIXED GUARD | • Permanently fixed to the machinery. • Functions are not dependent on moving parts. • Does not have any moving parts. | 20"]]},{"q":"Pengadang yang mempunyai mekanisme terbina dalam untuk menghentikan mesin apabila pengadang dibuka ialah:","o":["Pengadang laras sendiri","Pengadang tetap","Pengadang saling kunci (interlock guard)","Pengadang jarak"],"a":2,"e":"Interlock guard: mekanisme pencetus terbina yang menghentikan mesin apabila pengadang dibuka; dikuasakan elektrik, mekanikal, hidraulik atau pneumatik.","r":[[22,36,"INTERLOCK GUARD | • Has inbuilt tripping mechanism that stops the machine when guard is open. | • Runs on power, either electrical, mechanical, hydraulic or pneumatic. | 22"]]},{"q":"Kelemahan utama pengadang saling kunci ialah:","o":["Mesti dibuka semasa operasi","Tidak memerlukan penyelenggaraan","Tidak memberi perlindungan langsung","Mudah dipintas atau dinyahaktifkan"],"a":3,"e":"Interlock guard: perlindungan maksimum tetapi memerlukan penyelenggaraan berkala dan mudah dipintas atau dinyahaktifkan.","r":[[33,42,"ADVANTAGES & WEAKNESSES OF | MACHINE GUARDING | TYPE OF GUARD PROTECTION | ADVANTAGES WEAKNESSES | PROVIDED | Interlock Guard • Shuts down and prevents machine from operating when guard is open | • Maximum protection | • Required regular and maintenance and coordination | • Provides access for machine to output …"]]},{"q":"Pengadang yang bukaannya ditentukan oleh pergerakan bahan kerja ialah:","o":["Pengadang boleh laras","Pengadang tetap","Pengadang jarak","Pengadang laras sendiri (self-adjusting guard)"],"a":3,"e":"Self-adjusting guard: bukaan ditentukan oleh pergerakan bahan kerja, bahan menjadi sebahagian pengadang dan pengadang kembali ke kedudukan asal apabila operasi berhenti.","r":[[26,38,"SELF-ADJUSTING GUARD | • Opening of the guard is determined by movement of work material. | • Prevents entry of persons into the hazardous area/part, but allows entry of work materials. | • Work materials act as part of the guard. | • The guard returns to original position when operations are stopped. | 26"]]},{"q":"Pengadang yang tidak menutup sepenuhnya kawasan berbahaya tetapi diletakkan di luar capaian biasa ialah:","o":["Pengadang saling kunci","Pengadang tetap","Pengadang jarak (distance guard)","Pengadang automatik"],"a":2,"e":"Distance guard: tidak menutup sepenuhnya kawasan berbahaya tetapi diletakkan jauh daripada julat capaian biasa.","r":[[28,39,"DISTANCE GUARD | • Guard that does not fully cover the hazardous area/part but is positioned away from normal range of reach ability. | 28"]]},{"q":"Kelemahan pengadang tetap (fixed guard) ialah:","o":["Perlu ditanggalkan semasa kerja penyelarasan dan pembaikan mesin","Perlindungan minimum","Memerlukan penyelenggaraan kerap","Mudah dipintas"],"a":0,"e":"Fixed guard: perlindungan maksimum dan penyelenggaraan minimum, tetapi mungkin menghalang penglihatan, terhad kepada operasi tertentu dan perlu ditanggalkan semasa pembaikan.","r":[[32,41,"ADVANTAGES & WEAKNESSES OF | MACHINE GUARDING | TYPE OF GUARD PROTECTION | ADVANTAGES WEAKNESSES | PROVIDED | Fixed Guard Provides barrier • For specific use | • May obstruct vision | • Maximum protection | • Limited to specific operations | • Minimal maintenance | • Suitable for high production, repetitive …"]]},{"q":"Pengadang tetap paling sesuai untuk:","o":["Mesin yang kerap ditukar alatan","Bahan bersaiz berbeza-beza","Kerja penyelenggaraan","Operasi pengeluaran tinggi dan berulang"],"a":3,"e":"Kelebihan fixed guard termasuk sesuai untuk operasi pengeluaran tinggi dan berulang.","r":[[32,41,"ADVANTAGES & WEAKNESSES OF | MACHINE GUARDING | TYPE OF GUARD PROTECTION | ADVANTAGES WEAKNESSES | PROVIDED | Fixed Guard Provides barrier • For specific use | • May obstruct vision | • Maximum protection | • Limited to specific operations | • Minimal maintenance | • Suitable for high production, repetitive …"]]},{"q":"Peranti yang menghentikan mesin atau mengganggu kitaran kerja jika pekerja berada di zon bahaya ialah:","o":["Peranti tarik balik (pullback)","Peranti pengesan kehadiran (presence-sensing device)","Kayu penolak (push stick)","Pengadang amaran"],"a":1,"e":"Presence-sensing device: menghentikan mesin jika pekerja di zon bahaya; jenis fotoelektrik, frekuensi radio dan elektromekanikal.","r":[[39,45,"PRESENCE-SENSING DEVICE | • Stops machine, or disrupts work cycle or operations if worker is in danger zone. | • Types – photoelectric – radio-frequency – electro-mechanical | 39"]]},{"q":"Jenis peranti pengesan kehadiran TIDAK termasuk:","o":["Hidraulik","Frekuensi radio","Fotoelektrik","Elektromekanikal"],"a":0,"e":"Jenis presence-sensing: photoelectric, radio-frequency dan electro-mechanical.","r":[[39,45,"PRESENCE-SENSING DEVICE | • Stops machine, or disrupts work cycle or operations if worker is in danger zone. | • Types – photoelectric – radio-frequency – electro-mechanical | 39"]]},{"q":"Peranti yang menggunakan kabel diikat pada tangan atau lengan pekerja dan menarik tangan apabila mata pisau mula turun ialah:","o":["Kawalan dua tangan","Bar badan sensitif tekanan","Peranti henti","Peranti tarik balik (pullback device)"],"a":3,"e":"Pullback device: kabel diikat pada tangan pekerja; tangan ditarik keluar apabila mata pisau mula turun.","r":[[43,47,"PULLBACK DEVICE | • Uses a cable that is attached to the worker’s hand or arm. | • Usually used for machinery with tripping action features. | • When blades are in top position, the operator may access the control panel. | • The operators hand will be pulled when blades start to descend. | 43"]]},{"q":"Kelemahan peranti henti (stop device) yang dinyatakan dalam slaid ialah:","o":["Memerlukan dua operator","Mudah dipintas oleh operator","Terlalu mahal","Tidak boleh digunakan pada mesin tekan"],"a":1,"e":"Stop device: kabel disambung ke bahagian mesin tetap dan tangan pekerja; kelemahannya mudah dipintas oleh operator.","r":[[45,48,"STOP DEVICE | • Uses a cable connected to a fixed machine part that is attached to the worker’s hand or arm. | • Weakness: May be easily bypassed by the operator. | 45"]]},{"q":"Peranti kawalan keselamatan (safety control device) diaktifkan secara manual dan perlu:","o":["Diset semula secara automatik","Tidak perlu diset semula","Diset semula oleh JKKP","Diset semula secara manual untuk menghidupkan mesin"],"a":3,"e":"Safety control device diaktifkan secara manual dan perlu diset semula secara manual untuk memulakan mesin; contohnya two-hand control dan trip wire.","r":[[46,48,"SAFETY CONTROL DEVICE | • Manually activated and needs to be manually reset to start machine. | TYPES: • Safety Trip Control • Pressure Sensitive Body Bar • Safety Trip-Rod Device • Safety Trip Wire Cable • Two-Hand Control • Two-Hand Trip • Fencing | 46"]]},{"q":"Perlindungan melalui pengasingan (isolation) dilaksanakan menggunakan:","o":["Kedudukan dan jarak","Suhu dan tekanan","Masa dan kelajuan","Warna dan label"],"a":0,"e":"Protection using isolation dilaksanakan melalui position dan distance.","r":[[51,51,"PROTECTION USING ISOLATION | Implemented using: • Position • Distance | 51"]]},{"q":"Kaedah perlindungan lain yang mungkin tidak memberi perlindungan menyeluruh termasuk:","o":["Robotik","Kayu penolak (pushing stick) dan alat tangan","Penyuap automatik","Pengadang saling kunci"],"a":1,"e":"Other protection methods: pengadang amaran, perisai, alat tangan dan kayu penolak; kaedah ini mungkin tidak memberi perlindungan menyeluruh.","r":[[56,53,"OTHER PROTECTION METHODS | Other protection methods may not provide comprehensive protection from machinery hazards. | Among the available methods are: | • Warning guard • Shield • Handheld tools • Pushing stick | 56"]]}]},{"id":"2.03","title":"Safe Machine Operation","total":49,"qs":[{"q":"Operasi mesin (machine operation) merujuk kepada:","o":["Proses menjual produk","Proses membeli mesin baharu","Proses menggunakan peralatan mekanikal untuk melaksanakan tugas seperti memotong, membentuk, mengangkat, menekan atau memasang","Kerja pentadbiran kilang"],"a":2,"e":"Machine operation: proses menggunakan peralatan mekanikal, alat atau mesin industri untuk memotong, membentuk, mengangkat, menekan atau memasang bahan.","r":[[5,58,"Introduction: Machine Operation | • Machine operation refers to the process of using mechanical equipment, tools, or industrial machines to perform tasks such as cutting, shaping, lifting, pressing, or assembling materials. | • Machines help us work faster and easier."]]},{"q":"Seksyen 15(2)(b) OSHA 1994 berkaitan dengan:","o":["Pelantikan SHO","Penubuhan jawatankuasa","Susunan bagi operasi, pengendalian, penyimpanan dan pengangkutan loji dan bahan","Kewajipan pekerja memakai PPE"],"a":2,"e":"Seksyen 15(2)(b): membuat susunan bagi operasi, pengendalian, penyimpanan dan pengangkutan loji dan bahan.","r":[[7,59,"Occupational Safety and Health Act 1994 | Section 15 (2) - Employer Duties & Responsibilities | • (a) Employer responsibility to provide and maintain plant and safe system of work | • (b)The making of arrangements for operation, handling, storage and transportation of plant and substances."]]},{"q":"Di bawah Seksyen 24 OSHA 1994, pekerja perlu:","o":["Melantik orang kompeten","Menyediakan dasar keselamatan","Menggunakan PPE dan peranti keselamatan yang disediakan","Membeli mesin yang selamat"],"a":2,"e":"Seksyen 24: menjaga diri dan orang lain, bekerjasama dengan majikan, menggunakan PPE dan peranti keselamatan serta mematuhi arahan.","r":[[8,59,"Occupational Safety and Health Act 1994 | Section 24 - Employee Duties & Responsibilities | • Take reasonable care for own safety and health | • Ensure safety and health of others at work | • Cooperate with employer on safety measures | • Use PPE and safety devices provided | • Follow instructions, rules and procedures"]]},{"q":"Contoh mengubah kaedah kerja untuk keselamatan operasi mesin yang dinyatakan dalam slaid ialah:","o":["Menambah kelajuan mesin","Bekerja tanpa sarung tangan","Menggunakan blok penolak (push block)","Menanggalkan pengadang"],"a":2,"e":"Kaedah pencegahan: tukar cara kerja jika perlu, contohnya menggunakan push block.","r":[[13,62,"PREVENTION AND PROTECTION METHODS | • Prepare Safe Operating Procedures (SOP) • Inspect machinery before use • Prepare inspection checklist • Formulate safety regulations • Change work methods, if necessary (example: use of push block)"]]},{"q":"Yang manakah langkah pencegahan yang dinyatakan berkaitan pakaian pekerja?","o":["Mewajibkan pakaian lengan pendek sahaja","Melarang pemakaian pakaian longgar dan rambut panjang","Mewajibkan pakaian berwarna gelap","Membenarkan barang kemas"],"a":1,"e":"Langkah pencegahan termasuk mewajibkan laporan insiden berbahaya dan melarang pakaian longgar serta rambut panjang.","r":[[17,64,"PREVENTION AND PROTECTION METHODS | • Make it compulsory for workers to report any hazardous incident | • Prohibit wearing loose clothing and long hair"]]},{"q":"Pemeriksaan pengadang, suis, bekalan kuasa, kebocoran dan bunyi dilakukan pada peringkat:","o":["Selepas kemalangan","Penyelenggaraan","Sebelum operasi (pre-operation)","Penutupan (shutdown)"],"a":2,"e":"Pre-operation: pemeriksaan sebelum guna (pengadang, suis, bekalan kuasa, kebocoran, bunyi), memakai PPE dan membaca manual.","r":[[20,65,"Pre-Operation | • Conduct pre-use inspection (check guards, switches, power supply, leaks, noises). | • Wear appropriate PPE (helmet, gloves, goggles, safety shoes, ear protection). | • Read and understand machine manuals & safety instructions. | • Ensure the workspace is clean and free from obstructions."]]},{"q":"Pada peringkat penyediaan mesin (machine setup), langkah yang perlu dilakukan sebelum operasi sebenar ialah:","o":["Menanggalkan pengadang","Mengosongkan buku log","Melakukan larian ujian (test run)","Mematikan lampu"],"a":2,"e":"Machine setup: laraskan tetapan, kukuhkan bahan kerja dan lakukan test run sebelum operasi sebenar.","r":[[21,66,"Machine Setup | • Adjust settings (speed, pressure, cutting depth). | • Secure material/work piece properly. | • Perform a test run before starting actual operation."]]},{"q":"Semasa operasi selamat, pekerja TIDAK boleh:","o":["Mematuhi SOP","Memintas pengadang keselamatan atau butang henti kecemasan","Peka terhadap bunyi luar biasa","Mengekalkan jarak selamat"],"a":1,"e":"Safe operation: kendalikan hanya jika terlatih, ikut SOP, jauhkan tangan/rambut/pakaian, jangan pintas pengadang atau henti kecemasan.","r":[[22,66,"Safe Operation | • Operate the machine only if trained and authorised. | • Follow standard operating procedures (SOPs). | • Keep hands, hair, and clothing away from moving parts. | • Do not bypass safety guards or emergency stops. | • Stay alert to unusual noises, vibrations, or overheating. | • Maintain safe …"]]},{"q":"Pada peringkat penutupan (shutdown), pekerja perlu:","o":["Membiarkan mesin terus beroperasi","Melaraskan kelajuan maksimum","Menanggalkan semua pengadang","Mematikan dan memutuskan kuasa apabila tidak digunakan"],"a":3,"e":"Shutdown: matikan dan putuskan kuasa, bersihkan mesin dan kawasan kerja, dan laporkan kerosakan dengan segera.","r":[[23,67,"Shutdown | • Switch off and disconnect power when not in use. | • Clean machine and work area properly. | • Report malfunctions or defects immediately."]]},{"q":"Tiga pertimbangan utama dalam pengendalian jentera yang selamat ialah faktor:","o":["Manusia, persekitaran dan jentera","Majikan, pekerja dan kerajaan","Bahan, kaedah dan wang","Kos, masa dan kualiti"],"a":0,"e":"Main considerations: Human, Environment dan Machinery.","r":[[26,68,"MAIN CONSIDERATIONS IN THE SAFE HANDLING OF MACHINERY | HUMAN ENVIRONMENT MACHINERY"]]},{"q":"Menurut faktor manusia, umur minimum operator mesin ialah:","o":["18 tahun","14 tahun","16 tahun dan ke atas","21 tahun"],"a":2,"e":"Faktor manusia: berpengalaman, terlatih, sihat fizikal dan mental, kompeten dan berumur 16 tahun ke atas.","r":[[27,69,"HUMAN FACTORS | • Experienced • Trained • Physical and mentally fit • Competent • Age: 16 years and above"]]},{"q":"Yang manakah termasuk faktor jentera bagi operasi selamat?","o":["Pengalaman pekerja","Umur operator","Pencahayaan bilik","Butang kawalan yang direka secara ergonomik"],"a":3,"e":"Faktor jentera: kestabilan, bebas getaran, kawalan kelajuan, struktur kukuh, pengadang, butang kawalan ergonomik dan reka bentuk selamat.","r":[[29,70,"MACHINERY FACTORS | Stability of machine | Free from vibration hazard | Control of speed | Sturdy machine structure | Use of machine guards | Ergonomically designed control button | Safe design"]]},{"q":"Getaran berterusan daripada mesin boleh menyebabkan:","o":["Asma pekerjaan","Hand-Arm Vibration Syndrome (HAVS)","Silikosis","Dermatitis"],"a":1,"e":"Noise and vibration: bunyi bising berpanjangan menyebabkan kehilangan pendengaran, getaran berterusan boleh menyebabkan HAVS atau keletihan.","r":[[34,72,"NOISE AND VIBRATION | • Prolonged exposure to high noise levels can cause hearing loss | • Continuous vibration may lead to hand-arm vibration syndrome (HAVS) or fatigue"]]},{"q":"Pembumian yang lemah atau penebat rosak meningkatkan risiko bahaya:","o":["Kimia","Ergonomik","Terma","Elektrik"],"a":3,"e":"Electrical hazards: sentuhan wayar hidup atau sambungan rosak boleh menyebabkan renjatan, kelecuran atau elektrokusi; pembumian lemah meningkatkan risiko.","r":[[32,71,"ELECTRICAL HAZARDS | Contact with live wires or faulty connections can cause shocks, burns, or electrocution | CONTACT Contact with live wires or faulty connections can cause shocks, burns, | POOR GROUNDING or damaged insulation increases | the risk | or electrocution"]]},{"q":"Letupan mesin di kilang pemprosesan getah di Tangkak, Johor pada 24 Februari 2025 menyebabkan:","o":["4 kematian","2 kematian dan 7 cedera","1 kematian dan 3 cedera","Tiada kecederaan"],"a":1,"e":"Dua pekerja maut dan tujuh cedera apabila mesin meletup semasa penyelenggaraan; faktor termasuk LOTO yang lemah.","r":[[40,75,"Explosion at rubber processing factory | Description: | • Two workers died and seven others were injured when a machine exploded during maintenance of several machines that were in operation. | Date: 24 February 2025 | Location: Tangkak, Johor | Key Factors: | • Unsafe maintenance; ignition source; pressure build- …"]]},{"q":"Faktor utama dalam kemalangan letupan kilang getah Tangkak 2025 TIDAK termasuk:","o":["Penyelenggaraan tidak selamat","Pekerja tidak memakai kasut keselamatan","Pembentukan tekanan","Amalan lock-out/tag-out yang lemah"],"a":1,"e":"Faktor utama: penyelenggaraan tidak selamat, sumber pencucuhan, pembentukan tekanan dan amalan LOTO yang lemah.","r":[[40,75,"Explosion at rubber processing factory | Description: | • Two workers died and seven others were injured when a machine exploded during maintenance of several machines that were in operation. | Date: 24 February 2025 | Location: Tangkak, Johor | Key Factors: | • Unsafe maintenance; ignition source; pressure build- …"]]},{"q":"Dalam kes tangan pekerja tersepit dalam mesin penghancur tebu di Ipoh (28 Januari 2025), faktor utamanya ialah:","o":["Kebocoran gas","Kebakaran elektrik","Kekurangan pengadang mesin, latihan dan penyeliaan","Lantai licin"],"a":2,"e":"Faktor utama: tiada pengadang mesin, penggunaan tidak selamat, latihan lemah dan penyeliaan tidak mencukupi.","r":[[41,76,"Hand trapped in sugar crusher machine | Description: | • A foreign worker had his hand caught in a sugar crusher machine, suffering multiple fractures from wrist to elbow. | Date: 28 January 2025 | Location: Ipoh, Perak | Key Factors: | • Lack of machine guarding; unsafe use; poor training; inadequate supervision."]]},{"q":"Dalam kemalangan mesin pengering pasir di Miri (30 Ogos 2024), pekerj Peraturan 3"],"a":2,"e":"Peraturan 8 (Maintenance): pemilik memastikan loji CF diselenggara pada setiap masa dalam keadaan selamat dan baik.","r":[[23,93,"STATUTORY REQUIREMENT | Occupational Safety And Health (Plant Requiring Certificate Of Fitness) Regulations 2024 | Maintenance | Regulation 8 | (1) An owner of a plant requiring certificate of fitness shall ensure that the plant requiring certificate of fitness is maintained at all times so that the plant is in a …"]]},{"q":"Peraturan yang mewajibkan majikan menyimpan rekod penyelenggaraan loji CF ialah:","o":["Peraturan 8","Peraturan 12","Peraturan 15","Peraturan 19"],"a":3,"e":"Peraturan 19 (Record): majikan menyimpan dan menyelenggara rekod penyelenggaraan loji yang memerlukan CF.","r":[[24,93,"STATUTORY REQUIREMENT | Occupational Safety And Health (Plant Requiring Certificate Of Fitness) Regulations 2024 | Record | Regulation 19 | (1) An employer shall keep and maintain records of the maintenance of plants requiring certificate of fitness."]]},{"q":"Penyelenggaraan diperlukan untuk tujuan berikut KECUALI:","o":["Memastikan keselamatan operasi loji","Mengelakkan pemeriksaan JKKP","Meningkatkan kebersihan tempat kerja","Memastikan operasi loji berjalan lancar"],"a":1,"e":"Keperluan penyelenggaraan: kelancaran operasi, keselamatan operasi loji dan kebersihan tempat kerja untuk keselamatan.","r":[[6,84,"NECESSITY FOR MAINTENANCE | • To ensure smooth-running of plant operations | • To ensure safety of plant operations | • To increase workplace cleanliness for safety purposes"]]},{"q":"Empat jenis penyelenggaraan yang dinyatakan dalam bab ini ialah:","o":["Mekanikal, elektrik, sivil dan kimia","Harian, mingguan, bulanan dan tahunan","Pencegahan, pencegahan statutori, kerosakan (breakdown) dan atas talian (online)","Dalaman, luaran, kontrak dan swasta"],"a":2,"e":"Jenis penyelenggaraan: Preventive, Statutory Preventive, Breakdown dan Online Maintenance.","r":[[7,85,"TYPES OF MAINTENANCE | • Preventive Maintenance | • ontact - provides isolation to parts of equipment that has potential to release charges; and | 2) Protection from indirect contact - provides effective earthing to isolate metals that can charge electricity in case of failure …"]]},{"q":"Suis pengasing (isolating switch) yang selamat mestilah:","o":["Dipasang di siling","Berlabel, mudah dicapai, dipasang pada setiap mesin dan mempunyai kunci keselamatan pada kedudukan 'off'","Dikongsi oleh semua mesin","Disembunyikan daripada pekerja"],"a":1,"e":"Isolating switch: berlabel, mudah dicapai dari lantai, dipasang pada setiap mesin dan mempunyai safety lock pada kedudukan 'off'.","r":[[28,198,"SAFE USE OF ELECTRICITY | No Considerations Details | 1 Circuit protector Must have a fuse and circuit breaker that is suitable to prevent it from overloading | 2 Isolating switch • Labeled, • Easy reachable from the floor, • Attached to each individual machinery, • Possess safety lock when in ‘off’ position, etc"]]},{"q":"Peranti perlindungan kebocoran ke bumi (earth leakage) yang disyorkan ialah:","o":["Soket berbilang","Suis lampu","Fius kaca","Residual Current Device (RCD)"],"a":3,"e":"Protection: sediakan perlindungan kebocoran bumi seperti RCD, suis henti kecemasan/interlock, asingkan konduktor dan pamer papan tanda.","r":[[30,199,"SAFE USE OF ELECTRICITY | No Considerations Details | 4 Earthing • For all electrical items, • Circuit is connected direct, not through a switch | 5 Protection • Provide for earth leakage protection such as Residual Current Devices, • Have an emergency stop switch/ interlock switch, • Isolate the conductor, • …"]]},{"q":"Dalam kemalangan di Serian, Sarawak (7 Ogos), pekerja berumur 40 tahun maut kerana:","o":["Disambar arka elektrik akibat bekerja terlalu dekat dengan kabel elektrik hidup","Keracunan gas","Terjatuh dari tangga 10 meter","Dilanggar lori"],"a":0,"e":"Pekerja menanggalkan klip kabel gentian optik di atas tiang 3 meter dan disambar arka elektrik kerana terlalu dekat dengan kabel hidup.  operasi menghasilkan api, haba atau percikan seperti kimpalan, pemotongan, pengisaran, penggerudian dan letupan – sumber JKKP ICOP Confined Space 2010.","r":[[5,209,"DEFINITION OF HOT WORK | • Means fire-, heat- or spark-producing operation such as welding, thermal or oxygen cutting, grinding, drilling, blasting, heating and cleaning operation using high temperature steam | SOURCE : JKKP, INDUSTRY CODE OF PRACTICE FOR SAFE WORKING IN A CONFINED SPACE, 2010"]]},{"q":"Yang manakah BUKAN jenis kerja panas yang disenaraikan?","o":["Pengisaran","Peletupan (blasting)","Kimpalan","Mengecat dengan berus"],"a":3,"e":"Jenis hot work: kimpalan, pemotongan, pengisaran, penggerudian, peletupan dan operasi pemanasan/pembersihan menggunakan stim suhu tinggi.","r":[[6,209,"TYPE OF HOT WORK | • Welding • Cutting • Grinding • Drilling • Blasting • Heating and cleaning operation using high temperature steam"]]},{"q":"Tiga jenis kimpalan yang dinyatakan ialah:","o":["Kimpalan gas, kimpalan arka elektrik dan kimpalan rintangan","Kimpalan sejuk, panas dan suam","Kimpalan laser, plasma dan sonik","Kimpalan tangan, kaki dan mesin"],"a":0,"e":"Type of welding: gas welding, electric arc welding dan resistance welding.","r":[[7,210,"WELDING | Welding is a process of joining two or more metal parts by heating them to a melting point and allowing them to fuse together, with or without filler metal. | TYPE OF WELDING: • Gas welding • Electric arc welding • Resistence welding"]]},{"q":"Suhu yang dicapai dalam kimpalan arka elektrik ialah kira-kira:","o":["1,000°C","10,000°C","4,000°C","2,000°C"],"a":2,"e":"Electric arc welding: suhu kimpalan mencapai 4000°C, menyebabkan kepingan logam cair dan bercantum.","r":[[18,215,"WELDING ACTIVITIES | 2. Electric arc welding | • Electrodes and high voltage produces an arch where the electrode is in a position close to the steel work material • The electrode is moved along the part to be welded • The temperature reached for welding is 4000°C • The metal pieces will melt and fuse at that …"]]},{"q":"Kimpalan rintangan menghasilkan haba daripada:","o":["Rintangan terhadap aliran arus elektrik dan penggunaan tekanan","Geseran mekanikal","Nyalaan gas oksi-asetilena","Sinaran laser"],"a":0,"e":"Resistance welding (AWS): haba diperoleh daripada rintangan aliran arus elektrik dalam litar dengan bahan kerja sebagai sebahagiannya, serta penggunaan tekanan.","r":[[19,216,"WELDING ACTIVITIES | 3. Resistance Welding | “Resistance welding is a group of welding processes | that produce coalescence of faying surfaces with | the heat obtained from resistance to the flow of electric current in a circuit of which the workplaces | form a part, and by the application of pressure.” | …"]]},{"q":"Suhu nyalaan pemotongan oksi-asetilena boleh melebihi:","o":["3,000°C","500°C","6,000°C","1,000°C"],"a":0,"e":"Oxy-acetylene cutting: nyalaan oksigen dan asetilena boleh melebihi 3,000°C dan menjadi sumber pencucuhan utama.","r":[[21,217,"CUTTING ACTIVITIES | 1. Oxy-acetylene cutting (gas cutting) | Uses oxygen and acetylene gas flame to cut through metal plates or pipes. The flame temperature can exceed 3,000°C, making it a major ignition source. | 2. Plasma cutting | Employs an electric arc and compressed gas to cut conductive metals (e.g., steel, …"]]},{"q":"Pemotongan yang menggunakan arka elektrik dan gas termampat untuk memotong logam konduktif ialah:","o":["Thermal lance","Pemotongan plasma","Pemotongan oksi-asetilena","Ricih panas"],"a":1,"e":"Plasma cutting: menggunakan arka elektrik dan gas termampat untuk memotong logam konduktif; menghasilkan cahaya dan percikan kuat.","r":[[21,217,"CUTTING ACTIVITIES | 1. Oxy-acetylene cutting (gas cutting) | Uses oxygen and acetylene gas flame to cut through metal plates or pipes. The flame temperature can exceed 3,000°C, making it a major ignition source. | 2. Plasma cutting | Employs an electric arc and compressed gas to cut conductive metals (e.g., steel, …"]]},{"q":"Pemotongan menggunakan tiub kel akan retina"],"a":3,"e":"Radiation: UV dan ozon menyebabkan konjunktivitis dan kerosakan retina; inframerah dan cahaya terang menyebabkan mata kering dan iritasi.","r":[[41,227,"PHYSICAL HAZARDS | Radiation | Source: | • Ultra violet and ozone | > Conjunctivitis | > Damage to retina | • Infra-red and bright lights | > Dryness and irritant to eyes"]]},{"q":"Contoh bahaya kimia daripada kerja panas ialah pendedahan kepada:","o":["Getaran","Gas CO dan wasap ferum oksida","Bunyi bising","Postur janggal"],"a":1,"e":"Chemical hazards: gas dan wasap daripada kerja panas, contohnya gas CO, wasap ferum oksida dan nitrus.","r":[[42,227,"CHEMICAL HAZARDS | Exposure to chemicals | Source: | • Generated gas and fumes from hot work activities | Example: Gas-CO, fume-ferum oxide, nitrous"]]},{"q":"Postur janggal dan statik berpanjangan semasa kerja panas dikategorikan sebagai bahaya:","o":["Fizikal","Ergonomik","Biologi","Kimia"],"a":1,"e":"Ergonomic hazards: postur janggal dan statik berpanjangan akibat keadaan atau kedudukan kerja tidak sesuai.","r":[[43,228,"ERGONOMIC HAZARDS | Prolonged awkward and static posture | Source: | • Unsuitable working condition / position"]]},{"q":"Permit kerja panas (hot work permit) ialah:","o":["Notis larangan JKKP","Kebenaran bertulis bagi kerja panas tertentu di kawasan dan masa yang ditetapkan selepas semakan pencegahan kebakaran","Sijil kelayakan kimpalan","Lesen memandu kenderaan"],"a":1,"e":"Hot work permit: kebenaran bertulis untuk kerja panas tertentu di kawasan dan masa tertentu hanya selepas semakan pencegahan kebakaran dan keselamatan dilengkapkan.","r":[[47,230,"HOT WORK PERMIT | WHAT A HOT WORK PERMIT IS? | • A hot work permit is a written authorisation that allows specific hot work (welding, cutting, grinding, brazing, soldering, torch-applied roofing, etc.) to be done in a defined area and time, only after fire-prevention and safety checks are completed."]]},{"q":"Dalam sistem permit kerja panas, individu yang menilai kerja dan kawasan serta mengeluarkan permit dipanggil:","o":["Hot work operator","Pegawai JKKP","Fire watch","Permit Authorizing Individual (PAI)"],"a":3,"e":"Roles: PAI menilai dan mengeluarkan permit; hot work operator melaksanakan kerja; fire watch memantau kebakaran semasa dan selepas kerja.","r":[[48,230,"ROLES IN THE HOT WORK PERMIT SYSTEM | • Permit Authorizing Individual (PAI) • Person who evaluates the job and area, decides whether hot work may proceed, and issues the permit. | • Hot work operator • Contractor performing the hot work. | • Fire watch • Someone dedicated to monitoring for fire during hot work and …"]]},{"q":"Peranan 'fire watch' dalam kerja panas ialah:","o":["Membeli silinder gas","Mengeluarkan permit","Memantau kebakaran semasa dan untuk tempoh tertentu selepas kerja tamat","Melaksanakan kimpalan"],"a":2,"e":"Fire watch: seseorang yang ditugaskan memantau kebakaran semasa kerja panas dan untuk tempoh tertentu selepasnya, dengan kuasa dan peralatan untuk membunyikan penggera dan memadam api awal.","r":[[48,230,"ROLES IN THE HOT WORK PERMIT SYSTEM | • Permit Authorizing Individual (PAI) • Person who evaluates the job and area, decides whether hot work may proceed, and issues the permit. | • Hot work operator • Contractor performing the hot work. | • Fire watch • Someone dedicated to monitoring for fire during hot work and …"]]},{"q":"Silinder oksigen dan silinder asetilena/LPG untuk kimpalan gas perlu diasingkan sekurang-kurangnya:","o":["1 meter","5 meter","3 meter","10 meter"],"a":2,"e":"Kawalan kimpalan gas: asingkan silinder oksigen dan asetilena/LPG sekurang-kurangnya 3m.","r":[[53,233,"CONTROL MEASURES OF EQUIPMENT | Gas welding 1. Isolate oxygen cylinder and acetylene or LPG cylinder (at least 3m distance) 2. Inspect hose, regulator and nozzle 3. Install non return valve and flashback arrestor at blowpipe 4. Clean nozzle 5. Proper storage procedures for cylinders 6. Proper handling procedures …"]]},{"q":"Peranti yang dipasang pada blowpipe untuk mencegah nyalaan balik dalam kimpalan gas ialah:","o":["Penapis udara","Tolok suhu","Injap sehala (non-return valve) dan flashback arrestor","Fius elektrik"],"a":2,"e":"Kawalan kimpalan gas: pasang injap sehala dan flashback arrestor pada blowpipe.","r":[[53,233,"CONTROL MEASURES OF EQUIPMENT | Gas welding 1. Isolate oxygen cylinder and acetylene or LPG cylinder (at least 3m distance) 2. Inspect hose, regulator and nozzle 3. Install non return valve and flashback arrestor at blowpipe 4. Clean nozzle 5. Proper storage procedures for cylinders 6. Proper handling procedures …"]]},{"q":"Silinder gas untuk kerja panas hendaklah disimpan:","o":["Dalam keadaan tegak, jauh dari sumber haba dan bahan mudah terbakar","Bersebelahan kawasan kimpalan aktif","Terbaring di bawah matahari","Di dalam bilik tertutup tanpa pengudaraan"],"a":0,"e":"Storage: bahan dan silinder disimpan di kawasan selamat, kering dan berventilasi; silinder tegak dan jauh dari sumber haba, bahan mudah terbakar dan zon kerja aktif.","r":[[58,235,"GENERAL SAFETY MEASURES | Considerations for hot work equipment's | Storage: | All materials, gases, and equipment used for hot work must be stored in a safe, dry, and well-ventilated area. Gas cylinders (oxygen, acetylene) should be kept upright and away from heat sources, flammable materials, and active work …"]]},{"q":"Langkah keselamatan am untuk kerja panas termasuk:","o":["Menyimpan bahan mudah terbakar berhampiran","Bekerja tanpa penyeliaan","Menutup semua pintu dan tingkap","Sistem pengudaraan ekzos setempat (LEV)"],"a":3,"e":"General safety measures: LEV, SOP kerja panas, latihan, pemilihan pekerja dan penyeliaan; serta pemagaran kawasan dan peralatan kawalan kebakaran.","r":[[56,234,"GENERAL SAFETY MEASURES | • Fencing hot work work area • Provision of fire prevention and control equipments in hot work area • Isolate flammables from work area • Provision and proper use of suitable personal protective equipment and clothing for hot works"],[57,235,"GENERAL SAFETY MEASURES | • Local exhaust ventilation system for hot work process | • Prepare safe operating procedures for hot work activities | • Provide safety and health training for hot work | • Proper selection of workers | • Supervision of hot works"]]}]},{"id":"2.11","title":"Confined Space Safety","total":40,"qs":[{"q":"Menurut ICOP Ruang Terkurung 2010, ruang terkurung ialah ruang yang:","o":["Berada di bawah tekanan tinggi semasa diduduki","Sentiasa mempunyai pengudaraan baik","Tertutup atau separa tertutup, tidak direka terutamanya sebagai tempat kerja dan mempunyai laluan masuk/keluar terhad","Direka khusus sebagai tempat kerja harian"],"a":2,"e":"Definisi: ruang tertutup/separa tertutup, pada tekanan atmosfera semasa diduduki, bukan direka sebagai tempat kerja, berpotensi mempunyai pencemar, kekurangan/lebihan oksigen, engulfment dan laluan masuk/keluar terhad.","r":[[4,240,"Definition | • An enclosed or partially enclosed space | • Is at atmospheric pressure during occupancy, and | • Is not intended or designed primarily as a place of work, and | • Is liable at any time to : | – Have an atmosphere which contains harmful levels of contaminants | – Have an oxygen deficiency or excess | …"]]},{"q":"Ruang terkurung semasa diduduki berada pada tekanan:","o":["Vakum","Dua kali atmosfera","Tinggi","Atmosfera"],"a":3,"e":"Definisi ICOP 2010: ruang terkurung berada pada tekanan atmosfera semasa diduduki.","r":[[4,240,"Definition | • An enclosed or partially enclosed space | • Is at atmospheric pressure during occupancy, and | • Is not intended or designed primarily as a place of work, and | • Is liable at any time to : | – Have an atmosphere which contains harmful levels of contaminants | – Have an oxygen deficiency or excess | …"]]},{"q":"Seksyen 15(2)(f) OSHA 1994 yang berkaitan kerja ruang terkurung menghendaki majikan:","o":["Membangunkan dan melaksanakan prosedur menangani kecemasan","Membayar caruman PERKESO","Menyediakan kantin","Melantik jawatankuasa"],"a":0,"e":"Seksyen 15(2)(b) susunan operasi; (c) maklumat, latihan & penyeliaan; (f) prosedur kecemasan.","r":[[7,242,"Statutory Requirement | • Industry Code of Practice for Safe Working in a Confined Space 2010 | • Occupational Safety and Health Act 1994 (Amendment) 2022. General Duties Of Employers, Self-employed Persons And Principal: Section 15 (2): (b)The making of arrangements for operation, handling, storage and …"]]},{"q":"Gas toksik yang biasa ditemui dalam ruang terkurung termasuk:","o":["H₂S, CO dan ammonia","Nitrogen sahaja","Oksigen tulen","Wap air"],"a":0,"e":"Chemical hazard: gas toksik (H₂S, CO, ammonia), gas mudah terbakar (metana, propana), kekurangan/lebihan oksigen dan sisa kimia.","r":[[16,246,"Hazards in Confined Space | Chemical Hazard Presence of harmful gases, vapors, fumes, dust, or chemicals. | Examples in confined spaces: | • Toxic gases (H₂S, CO, ammonia). • Flammable gases (methane, propane). • Oxygen deficiency or enrichment. • Chemical residues in tanks (solvents, acids, oils). | Effects: …"]]},{"q":"Bakteria, kulat atau virus dalam tangki kumbahan dikategorikan sebagai bahaya:","o":["Ergonomik","Kimia","Fizikal","Biologi"],"a":3,"e":"Biological hazard: bakteria, kulat atau virus dalam tangki kumbahan, kulat di kawasan lembap dan serangan haiwan/serangga.","r":[[18,247,"Hazards in Confined Space | Biological Hazard Hazards from living organisms or biological agents. | Examples: | • Bacteria, fungi, or viruses in sewage tanks. • Mold growth in damp areas. • Animal/insect infestations (rats, snakes, wasps) | Effects: Infection, allergic reactions, zoonotic diseases."]]},{"q":"Ketakutan terperangkap (klaustrofobia) di ruang gelap dan terpencil ialah bahaya:","o":["Biologi","Fizikal","Psikososial","Kimia"],"a":2,"e":"Psychosocial hazard: tekanan bekerja di ruang terkurung, gelap dan terpencil serta ketakutan terperangkap (claustrophobia).","r":[[19,248,"Hazards in Confined Space | Psychosocial Hazard Hazards affecting mental and emotional well-being. | Examples: | • Stress from working in confined, dark, isolated spaces. • Fear of entrapment (claustrophobia). • High-pressure deadlines or unsafe work culture. | Effects: Anxiety, panic attacks, reduced focus leading …"]]},{"q":"Banjir atau kemasukan air ke dalam terowong atau tangki ialah contoh bahaya:","o":["Psikososial","Persekitaran","Biologi","Ergonomik"],"a":1,"e":"Environmental hazard: banjir/kemasukan air, pengudaraan lemah dan suhu melampau; kesan lemas, hipotermia, kelesuan haba.","r":[[21,249,"Hazards in Confined Space | Environmental Hazard Hazards caused by the surrounding environment. | Examples: | • Flooding or water ingress in tunnels or tanks. • Poor ventilation leading to accumulation of gases. • Extreme temperatures (hot or cold). | Effects: Drowning, hypothermia, heat exhaustion."]]},{"q":"Dalam tragedi Lenggong, Perak (6 April 2025), berapakah bilangan yang maut di dalam syaf pembetung?","o":["Seorang","Dua orang","Tiga orang","Lima orang"],"a":2,"e":"Tiga individu maut termasuk dua pekerja dan seorang awam yang cuba menyelamat.","r":[[22,249,"Incidents Reported in Malaysia | (Lenggong, Perak) Three individuals died on April 6, 2025, after collapsing in a newly constructed, sealed sewer shaft at a resort construction site in Lenggong. The victims included two daily wage workers and one member of the public who attempted a rescue. | Key Investigation …"]]},{"q":"Penemuan siasatan JKKP dalam kes Lenggong termasuk:","o":["Kebakaran elektrik","Kekurangan pengudaraan dan tiada prosedur kerja selamat","Pekerja bawah umur","Kren tumbang"],"a":1,"e":"Penemuan: kekurangan pengudaraan, tiada prosedur kerja selamat untuk kemasukan ruang terkurung dan projek tidak menghantar notifikasi JKKP 12.","r":[[22,249,"Incidents Reported in Malaysia | (Lenggong, Perak) Three individuals died on April 6, 2025, after collapsing in a newly constructed, sealed sewer shaft at a resort construction site in Lenggong. The victims included two daily wage workers and },{"q":"Siapakah yang menjalankan ujian gas (O₂, LEL, toksik), merekod keputusan dan mengisytiharkan kemasukan selamat?","o":["Fire Watch (FW)","Stand-by Person (SP)","Authorised Entrant (AE)","Penguji Gas Diberi Kuasa (AGT)"],"a":3,"e":"AGT menjalankan ujian gas (O₂, LEL, toksik), mendokumenkan keputusan dan mengisytiharkan kemasukan selamat.","r":[[27,252,"Control Measures | Duties of Parties Involved | Employer | Ensures compliance, provides training, resources, and appoints competent personnel | Contractor Fire Watch (FW) (if required) | Follows procedures, ensures worker competency, PPE, and coordinates with employer Monitors hot work, equipped with | …"]]},{"q":"Peranan Stand-by Person (SP) ialah:","o":["Mengeluarkan permit","Masuk dan melakukan kerja di dalam","Menjalankan ujian gas","Kekal di luar, mengekalkan komunikasi, memantau entran dan membunyikan amaran semasa kecemasan"],"a":3,"e":"SP kekal di luar, mengekalkan komunikasi, memantau entran dan memberi amaran ketika kecemasan.","r":[[27,252,"Control Measures | Duties of Parties Involved | Employer | Ensures compliance, provides training, resources, and appoints competent personnel | Contractor Fire Watch (FW) (if required) | Follows procedures, ensures worker competency, PPE, and coordinates with employer Monitors hot work, equipped with | …"]]},{"q":"Siapakah yang mengesahkan semua kawalan, membenarkan dan mengeluarkan permit serta menggantungnya jika keadaan berubah?","o":["Authorised Entrant (AE)","Entry Supervisor (ES)","Permit Issuer (PI)","Kontraktor"],"a":2,"e":"Permit Issuer mengesahkan semua kawalan, membenarkan dan mengeluarkan permit, dan menggantungnya jika keadaan berubah; ES mengurus kemasukan.","r":[[27,252,"Control Measures | Duties of Parties Involved | Employer | Ensures compliance, provides training, resources, and appoints competent personnel | Contractor Fire Watch (FW) (if required) | Follows procedures, ensures worker competency, PPE, and coordinates with employer Monitors hot work, equipped with | …"]]},{"q":"Sebelum memulakan kerja, injap dan sambungan ke tangki perlu diasingkan menggunakan:","o":["Tiada pengasingan diperlukan","Sistem lock out/tag out","Pita pelekat biasa","Kain buruk"],"a":1,"e":"Sebelum kerja: asingkan/tutup semua injap dan sambungan ke tangki menggunakan sistem LOTO.","r":[[31,254,"Control Measures | PLANNING AND SAFETY MEASURES BEFORE STARTING WORKS | • Isolate/close all valves and connections to the tank using the lock out/tag out system • Prepare an exhaust system, if applicable for the suction of dust and welding activities • Ensure the suitability of hand and electric tools with the task …"]]},{"q":"Pekerja yang dipilih untuk kerja ruang terkurung mestilah:","o":["Sesiapa sahaja yang ada","Pekerja paling muda sahaja","Pekerja baharu tanpa pengalaman","Sihat fizikal dan mental serta terlatih, dan nama mereka direkodkan"],"a":3,"e":"Pilih pekerja yang sihat fizikal dan mental serta terlatih dalam kerja ruang terkurung, dan rekodkan nama mereka.","r":[[32,254,"Control Measures | PLANNING AND SAFETY MEASURES BEFORE STARTING WORKS | • Ensure the safety of entrance and exit points of the tank • Select workers who are physically and mentally fit, and are properly trained in confined space works and record their names"]]},{"q":"Semasa kerja dalam ruang terkurung, kandungan oksigen/gas perlu:","o":["Diukur secara langsung dan berterusan","Diukur selepas kerja selesai sahaja","Tidak perlu diukur","Diukur sekali sahaja sebelum masuk"],"a":0,"e":"Semasa kerja: ES memantau berterusan, ukur kandungan oksigen/gas secara langsung, sedut habuk berterusan dan pastikan pengudaraan mencukupi.","r":[[33,255,"Control Measures | PLANNING AND SAFETY MEASURES DURING WORKS | • The entry supervisor (ES) continuously monitor the works being done | • Direct measurement of the oxygen/gas content in the vessel/confined space | • Continuously suck out dust that is generated from works"]]},{"q":"Selepas kerja selesai, permit kerja perlu dibatalkan/ditutup oleh:","o":["Authorised Entrant","Pemandu","Pegawai bomba","Entry Supervisor (ES) yang bertugas"],"a":3,"e":"Selepas kerja: pastikan semua pekerja keluar, alihkan peralatan, hentikan bekalan elektrik dan batal/tutup permit oleh ES yang bertugas.","r":[[35,256,"Control Measures | PLANNING AND SAFETY MEASURES AFTER COMPLETION WORKS | • Ensure and record that all workers have exited the confined space • Inspect the work area to ensure that all work equipment have been removed (mobile exhaust system, lights, fire extinguishers etc) • Stop the electricity supply"],[36,256,"Control Measures | PLANNING AND SAFETY MEASURES AFTER COMPLETION WORKS • Cancel/close the work permit issued by the entry supervisor (ES) on duty • Report problems, if any, related to the works carried out • Handover the responsibility of handling the confined space to the respective persons and record the handover …"]]},{"q":"Langkah pertama selepas kerja ruang terkurung selesai ialah:","o":["Mengambil gambar","Membuka semula injap","Memastikan dan merekod semua pekerja telah keluar dari ruang terkurung","Menukar kunci"],"a":2,"e":"After completion: pastikan dan rekod semua pekerja telah keluar, periksa kawasan kerja untuk memastikan semua peralatan dialihkan dan hentikan bekalan elektrik.","r":[[35,256,"Control Measures | PLANNING AND SAFETY MEASURES AFTER COMPLETION WORKS | • Ensure and record that all workers have exited the confined space • Inspect the work area to ensure that all work equipment have been removed (mobile exhaust system, lights, fire extinguishers etc) • Stop the electricity supply"]]}]},{"id":"2.12","title":"Construction Safety","total":58,"qs":[{"q":"'Construction work contractor' di bawah Peraturan CDM 2024 TIDAK termasuk:","o":["Kontraktor yang menjalankan kerja pembinaan","Kontraktor yang mengawal kerja pembinaan","Kontraktor yang mengurus kerja pembinaan","Klien domestik"],"a":3,"e":"Construction work contractor: sesiapa yang dalam perjalanan perniagaan membina, me oy a Safety and Health Officer at the workplace for projects of over RM20 million whether for works of: | a)Building operations b)Engineering construction"]]},{"q":"Berapakah bilangan jenis bahaya di tapak pembinaan yang disenaraikan dalam bab ini?","o":["8","14","6","11"],"a":3,"e":"11 bahaya: mekanikal, elektrik, kerja di tempat tinggi, tekanan haba, bising, debu, radiasi, kimia, ergonomik, biologi dan ruang terkurung.","r":[[20,269,"HAZARDS IN CONSTRUCTION SITE | 1. Mechanical 2. Electrical 3. Working at height 4. Heat stress 5. Noise 6. Dust 7. Radiation 8. Chemicals | 9. Ergonomic 10.Biological 11.Confined space"]]},{"q":"Kebocoran arus bumi dan penyambung tanpa perlindungan ialah contoh bahaya:","o":["Ergonomik","Mekanikal","Biologi","Elektrik"],"a":3,"e":"Typical electrical hazard: kebocoran arus bumi, sentuhan longgar, penarafan komponen tidak mencukupi, penyambung tidak dilindungi, penyelenggaraan lemah.","r":[[22,270,"HAZARDS IN CONSTRUCTION SITE | Typical Electrical Hazard |  Earth leakage currents. |  Loose contacts and connectors. |  Inadequate ratings of circuit components. |  Unprotected connectors. |  Poor maintenance and testing. | 22"]]},{"q":"Bunyi berdesing dalam telinga yang berpanjangan akibat pendedahan bising dikenali sebagai:","o":["Presbikusis","Konjunktivitis","Tinnitus","Vertigo"],"a":2,"e":"Bahaya bising: NIHL, anjakan ambang kekal (PTS) dan tinnitus.","r":[[25,272,"HAZARDS IN CONSTRUCTION SITE | Typical Noise Hazard | If the level of noise exposure remains unchanged, noise-induced hearing | loss will lead to a permanent threshold shift affecting an increasing number of frequencies. The hearing loss caused can be temporary or permanent. | 1 Noise-induced hearing loss | 2 …"]]},{"q":"Debu yang terhasil daripada penggerudian, peletupan dan penghancuran batu yang mengandungi kuarza ialah:","o":["Debu kayu","Debu silika","Debu arang batu","Debu logam"],"a":1,"e":"Silica dust: dihasilkan oleh penggerudian, peletupan, penghancuran dan pe igned to support and hold a person in the event of a fall. | 2. Prevent risk of workers associated with a fall by : | 1. Reduce the distance of fall | 2. Absorb the energy of fall | 3. Maintain workers position"]]},{"q":"Fall arrest mengurangkan risiko dengan cara berikut KECUALI:","o":["Menghalang pekerja daripada sampai ke tepi","Mengurangkan jarak jatuh","Mengekalkan kedudukan pekerja","Menyerap tenaga jatuh"],"a":0,"e":"Fall arrest: kurangkan jarak jatuh, serap tenaga jatuh, kekalkan kedudukan pekerja. Menghalang pekerja sampai ke tepi ialah fungsi work restraint.","r":[[19,299,"FALL ARREST | 1. A system designed to support and hold a person in the event of a fall. | 2. Prevent risk of workers associated with a fall by : | 1. Reduce the distance of fall | 2. Absorb the energy of fall | 3. Maintain workers position"],[20,299,"WORK RESTRAINT | 1. A system used to prevent a person reaching a place from where a fall is possible. It can consist of a safety belt and anchorage line. | 2. To ensure workers from entering an area where there is a risk of falling"]]},{"q":"Sistem yang menghalang seseorang daripada sampai ke tempat yang boleh menyebabkan jatuh ialah:","o":["Fall arrest","Catch platform","Work restraint","Safety net"],"a":2,"e":"Work restraint: sistem (tali pinggang keselamatan dan talian penambat) untuk menghalang pekerja memasuki kawasan berisiko jatuh.","r":[[20,299,"WORK RESTRAINT | 1. A system used to prevent a person reaching a place from where a fall is possible. It can consist of a safety belt and anchorage line. | 2. To ensure workers from entering an area where there is a risk of falling"]]},{"q":"Sistem yang membolehkan pekerja bekerja sambil tergantung dengan tangan bebas ialah:","o":["Work positioning","Fall arrest","Work restraint","Barricade"],"a":0,"e":"Work positioning: sokongan dan kekangan utama yang membolehkan kerja dilakukan dengan selesa sambil tergantung dengan tangan bebas.","r":[[21,300,"WORK POSITIONING | • A system designed to provide a primary means of support and restraint to allow work to be carried out in reasonable comfort. | • Allowing workers to work while hanging hands free"]]},{"q":"Prinsip memanjat '3 titik sentuhan' bermaksud:","o":["3 orang memanjat serentak","Berehat setiap 3 meter","Sentiasa 2 tangan 1 kaki atau 2 kaki 1 tangan","Memanjat 3 anak tangga sekali gus"],"a":2,"e":"Climbing principle: 3 titik sentuhan pada setiap masa – 2 tangan 1 kaki atau 2 kaki 1 tangan, dengan bantuan lanyard.","r":[[23,301,"CLIMBING PRINCIPLE | 1. 3 points contact at all times | 1. 2 hands 1 foot | 2. 2 feet 1 hand | 2. With the help of | 1. Lanyard (single / double) | 2. Work positioning lanyard"]]},{"q":"Yang manakah contoh aktiviti di tempat tinggi?","o":["Mesyuarat di bilik","Mengimpal di silo","Menaip di meja","Memandu di jalan raya"],"a":1,"e":"Activities at heights: membersihkan tingkap bangunan tinggi, mengecat menara, menukar mentol, mengimpal di silo dan memasang piring satelit.","r":[[25,302,"ACTIVITIES AT HEIGHTS | 1. Window cleaning eg. at high rise building | 2. Painting of tower | 3. Changing of light bulb | 4. Welding at silo | 5. Installation of satellite dish"]]},{"q":"Anak tangga berminyak yang menyebabkan tangga atau platform licin termasuk dalam:","o":["Bahaya radiasi","Bahaya kimia","Bahaya biologi","Bahaya di tempat tinggi"],"a":3,"e":"Hazards at heights termasuk pekerja/alat tidak diikat, peralatan rosak, kebocoran kabel hidup, anak tangga berminyak, cuaca buruk, psikososial, tekanan haba dan ergonomik.","r":[[34,306,"HAZARDS AT HEIGHTS | 1. Workers, equipment or tools not secured/attached during climbing/working 2. Faulty equipment 3. Leakage of life electric cable on tower 4. Oily rungs lead to slippery ladder or platform 5. Heavy rain, lightning or strong wind (Environmental) 6. Psychosocial 7. Heat Stress 8. Ergonomic"]]},{"q":"Hujan lebat, kilat atau angin kencang dikategorikan sebagai bahaya:","o":["Persekitaran","Mekanikal","Ergonomik","Psikososial"],"a":0,"e":"Bah Ergonomics Risk Factor | 1. Awkward postures | 2. Forceful & sustained exertion | 3. Repetitive motions | 4. Static and sustained postures | 5. Contact stress | 6. Vibration | 7. Other environmental risk factors –lighting, temperature, ventilation, noise"]]},{"q":"Postur badan yang menyimpang ketara daripada kedudukan neutral seperti membongkok, berpusing dan mencapai terlalu jauh dipanggil:","o":["Postur janggal (awkward posture)","Postur statik","Pergerakan berulang","Tekanan sentuhan"],"a":0,"e":"Awkward posture: kedudukan badan yang menyimpang ketara dari kedudukan neutral; contoh membongkok, berpusing, mencapai terlalu jauh.","r":[[8,194,"ERGONOMIC RISK FACTORS | 1. Awkward posture • Positions of the body (e.g., limbs, joints, back) that deviate significantly from the neutral position while job tasks are being performed. • Usually results from workplace and task design which not following ergonomics specifications • eg bending, twisting, over …"]]},{"q":"Mengangkat beban berat, genggaman picit dan mengendalikan tuil ialah contoh faktor risiko:","o":["Postur statik","Tekanan sentuhan","Getaran","Daya kuat dan berterusan (forceful exertion)"],"a":3,"e":"Forceful & sustained exertion: daya tinggi = beban mekanikal tinggi pada otot, ligamen, tendon dan sendi; contoh angkat beban berat, pinch grip.","r":[[10,195,"ERGONOMIC RISK FACTORS | 2. Forceful & Sustained Exertion • Higher force means higher mechanical load to the muscles, ligaments, tendons and joints. This will result in fatigue and reduces physical work capacity. • Can cause acute effect or long term effect (chronic) if excessive load are not handled correctly. • …"]]},{"q":"Pergerakan berulang menjadi lebih teruk apabila:","o":["Melibatkan pelbagai otot berbeza","Kekurangan pemulihan dalam kitaran dan melibatkan kumpulan otot kecil","Tugas sangat berbeza-beza","Terdapat rehat yang mencukupi"],"a":1,"e":"Repetitive motions lebih teruk jika tiada pemulihan dalam kitaran, melibatkan jenis otot sama dan kumpulan otot kecil seperti pergelangan tangan atau jari.","r":[[13,197,"ERGONOMIC RISK FACTORS | 3.Repetitive Motions • Performing a task over and over again with little variation for several hours using muscle and tendon in the same way. • Worst if • lacks of recovery within cycle. • Involves on same type of muscles. • Involves smaller group of muscle such as at wrist or fingers. | 10"]]},{"q":"Berdiri lama tanpa pergerakan yang mengurangkan peredaran darah dan menyebabkan ketegangan otot ialah faktor risiko:","o":["Daya kuat","Getaran","Postur janggal","Postur statik dan berterusan"],"a":3,"e":"Static & sustained postures: postur sama dikekalkan tanpa pergerakan, mengurangkan peredaran dan menyebabkan ketegangan otot; contoh berdiri lama.","r":[[15,198,"ERGONOMIC RISK FACTORS | 4. Static & Sustained Postures • Same posture or position of the body is held throughout the exertion (no movement) • Lack of movement reduces circulation and causes muscle tension which can contribute to injury. • e.g. holding, static works, prolonged standing. (DVT?) | 12"]]},{"q":"Bahagian badan yang bersentuhan dengan permukaan keras dan tajam menimbulkan faktor risiko:","o":["Postur statik","Getaran","Tekanan sentuhan (contact stress)","Pergerakan berulang"],"a":2,"e":"Contact stress: bahagian badan bersentuhan dengan permukaan keras/tajam, menekan saraf, tendon dan saluran darah dekat kulit.","r":[[17,199,"ERGONOMIC RISK FACTORS | 5. Contact Stress | • Part of your body in contact with hard and sharp surfaces. | • Will put pressure to weak areas that are more susceptible such as nerves, tendons and blood vessels which are close to the skin and underling bone at the wrists, fingers, forearm, elbows and knees"]]},{"q":"Getaran daripada alat kuasa yang dipegang dikategorikan sebagai getaran:","o":["Akustik","Struktur","Seluruh badan (whole body)","Tangan-lengan (hand-arm)"],"a":3,"e":"Vibration: whole body dari jentera; hand-arm dari alat kuasa.","r":[[19,200,"ERGONOMIC RISK FACTORS | 6. Vibration | • Whole Body from machinery | • Hand Arm from power tools"]]},{"q":"Garis Panduan Penilaian Risiko Ergonomik hanya meliputi isu ergonomik:","o":["Kognitif","Budaya","Fizikal","Makro"],"a":2,"e":"Guidelines on ERA hanya meliputi isu ergonomik fizikal di tempat kerja yang termaktub dalam OSHA 1994.","r":[[23,202,"Guidelines on Ergonomics Risk Assessment | Only cover issues related | to physical ergonomics at workplaces stipulated in OSHA 1994 | May be used by any | employers, employees and OSH practitioners. | Provides systematic plan and objective assessment in identifying, assessing and | controlling ERF at work"]]},{"q":"Dua tahap Penilaian Risiko Ergonomik (ERA) ialah:","o":["ERA Asas dan ERA Pertengahan","ERA Bertulis dan ERA Lisan","ERA Dalaman dan ERA Luaran","ERA Awal (Initial) dan ERA Lanjutan (Advanced)"],"a":3,"e":"Level of ERA: Level 1 – Initial ERA; Level 2 – Advanced ERA.","r":[[25,203,"Level of ERA | Level 1 •Initial ERA | Level 2 •Advanced ERA"]]},{"q":"Inisiatif ERA secara PROAKTIF termasuk:","o":["Aduan kecederaan MSD","Permintaan OHD","Arahan PERKESO","Penilaian kendiri pekerja, pemeriksaan walkthrough dan semakan rekod"],"a":3,"e":"Proaktif: (A) self-assessment, (B) walkthrough oleh trained person, (C) semakan rekod. Reaktif: (D) aduan MSD, (E) permintaan OHD/pihak berkuasa.","r":[[27,204,"Initiating ERA | • Reactively | • Proactively | A. Self‐assessment by the employee | D. Ergonomics related injury and MSDs complaints | A trained person can report to the management, safety and health officer or OSH committee on any work‐related complaint due to ergonomics risk factors. An example of a …"],[30,205,"Decisions | Proactive (A,B,C) | Reactive (D,E) | An initial ERA is REQUIRED if: ✅there is ergonomics hazard | ✅An initial ergonomics risk assessment should be conducted without the need to assess the claim of ergonomics risk. | identified from the self‐assessment form, OR ✅based on the professional | judgment of …"]]},{"q":"Borang penilaian k nya kadmium.","r":[[36,431,"Limitation (cont..) | 2. Individual variations: Wide differences due to genetics, physiology, multiple exposures, chemical interactions, smoking, alcohol, and pregnancy. | Smoking may elevate certain results (e.g., cadmium). | 3. Administrative: Inconvenience to employees and plant operations during collection of …"]]},{"q":"BEL bagi plumbum dalam darah ialah:","o":["50 μg/dL","0.03 mg/L","25 μg/g kreatinin","5 μg/L"],"a":0,"e":"Contoh BEL: plumbum darah 50 μg/dL; benzena S-PMA 25 μg/g kreatinin; toluena urin 0.03 mg/L.","r":[[38,432,"Example | Chemical Metabolite BEL | Benzene Urine S-PMA 25 μg/g creatinine | Toluene Urine Toluene 0.03 mg/L | Xylene Urine Methylhippuric acid 1.5 g/g creatinine | Lead Blood Lead 50 μg/dL | N-hexane Urine 2,5-Hexanedione 0.5 mg/L | Cadmium Urine cadmium blood cadmium | 5 μg/g creatinine 5 μg/L"]]},{"q":"BEL mewakili tahap penentu yang diperhatikan dalam pekerja yang terdedah secara eksklusif melalui sedutan pada tahap:","o":["Separuh PEL","Tahap maut","Dua kali PEL","PEL masing-masing"],"a":3,"e":"BEL: levels of determinants observed in workers exposed exclusively by inhalation at the level of respective PEL.","r":[[37,432,"Biological Exposure Limit (BEL) | • BEL is the representative of the levels of determinants which are observed in workers exposed to chemicals, exclusively by inhalation at the level of respective Permissible Exposure Limit (PEL). | • Example of established BEL: | • Biological Exposure Indices (BEI) – ACGIH | • …"]]}]},{"id":"3.15","title":"Ventilation","total":35,"qs":[{"q":"Dua kategori utama sistem pengudaraan ialah:","o":["Pengudaraan manual dan solar","Pengudaraan siang dan malam","Pengudaraan keselesaan (HVAC) dan pengudaraan industri","Pengudaraan dalaman dan luaran sahaja"],"a":2,"e":"Comfort ventilation (HVAC) mengawal suhu, kelembapan dan bau; industrial ventilation mengawal pencemar berbahaya.","r":[[5,438,"Introduction to Ventilation | • Ventilation systems are divided into ng the concentration of air contaminants to acceptable levels. | Generation Air Movement"]]},{"q":"Sistem bekalan udara (supply system) digunakan untuk:","o":["Menyimpan bahan kimia","Membakar sisa","Membekalkan udara bersih dan menggantikan udara yang diekzos","Menyedut pencemar di sumber"],"a":2,"e":"Supply system: membekalkan udara bersih, mewujudkan persekitaran selesa dan menggantikan udara yang diekzos.","r":[[9,440,"Supply System | • Used to supply air to work space, to: | • Used to supply clean air to a workplace | • Create comfortable environment | • Replace air exhausted"]]},{"q":"Dua klasifikasi sistem ekzos ialah:","o":["Ekzos kering dan basah","Ekzos manual dan automatik","Ekzos am dan ekzos setempat (LEV)","Ekzos panas dan sejuk"],"a":2,"e":"Exhaust system: general exhaust system dan local exhaust system.","r":[[11,441,"Exhaust System | • Used to remove contaminants generated so as to maintain healthful work environment. | • Classified as: | • General exhaust system | • Local exhaust system."]]},{"q":"Sistem ekzos am memerlukan:","o":["Hud pada setiap mesin","Kuantiti udara yang besar untuk mencairkan pencemar ke tahap selamat","Kuantiti udara yang sangat kecil","Tiada sistem bekalan pengganti"],"a":1,"e":"General exhaust: kawalan haba dan pencairan; memerlukan kuantiti udara besar; sistem bekalan biasanya menggantikan udara yang diekzos.","r":[[12,441,"General Exhaust System | • Used for – | • Heat control | • Removal of contaminant generated (dilution system) | • Large quantities of air needed to mix with contaminant to bring down its concentration to safe level. | • Mixed contaminated air then is discharged to atmosphere. | • Supply system usually used to …"]]},{"q":"Tujuan utama Sistem Pengudaraan Ekzos Setempat (LEV) ialah:","o":["Menyingkirkan pencemar di titik penjanaannya untuk mengelakkan sedutan pekerja","Mencairkan pencemar di seluruh bangunan","Menyejukkan bilik","Membekalkan udara steril"],"a":0,"e":"LEV: menyingkirkan pencemar di titik pe
