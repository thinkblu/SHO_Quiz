arables/IoT, drone (inspection, area monitoring/mapping), VR/AR, big data & AI.","r":[[43,126,"Current Technologies & Benefits | • Wearables / IoT (smart helmet, sensors): | real-time monitoring, hazard alerts | • Drone – Inspection, area monitoring/mapping | • VR/AR & e-Learning: | immersive training, safer practice, cost-effective | • Big Data & AI: | predictive risk analysis, trend detection, proactive …"]]},{"q":"Penunjuk prestasi PROAKTIF (leading indicator) termasuk:","o":["Peratusan latihan yang disiapkan","Kadar kematian","Kadar insiden","Bilangan kemalangan"],"a":0,"e":"Proactive: pematuhan perundangan, % latihan disiapkan, kekerapan pemeriksaan, tindakan pembetulan tepat masa, latihan kecemasan.","r":[[73,141,"Ways of Measuring Performance | • Proactive (Leading indicator - use measure for prevention) - •Compliance (towards legal requirement -- Regulations, Codes of practice, Guidelines) •Activity (training, safety meeting, inspection) | • Reactive (Lagging indicator - use measure for correction) - •Near misses, injury, …"],[81,145,"Proactive Performance Measures | • Percent of compliance to legislation | • Percentage of training completed | • Frequency of \"walk through\"and “checklist inspections” carried out | • Number of corrective actions completed on time"]]},{"q":"Kelemahan utama ukuran prestasi REAKTIF ialah:","o":["Ia mengukur kegagalan mencegah insiden dan bergantung pada pelaporan yang baik","Ia mencegah semua kemalangan","Ia mengukur aktiviti latihan","Ia tidak memerlukan data"],"a":0,"e":"Disadvantages of reactive measures: mengukur kegagalan, bukan 'safeness'; sangat bergantung pada pelaporan yang baik (contoh near misses).","r":[[74,141,"Disadvantages of Reactive Measures | • Traditional performance measures have been reactive measures • They measure failure to prevent incidents rather than “safeness” • Useful for measuring deficiencies and deviations • These measures are very dependent upon good reporting (e.g. near misses)"]]},{"q":"Formula Kadar Insiden (Incidence Rate) ialah:","o":["Bilangan kematian × 100 ÷ jumlah pekerja","Jumlah hari hilang × 1,000,000 ÷ jumlah jam kerja","Bilangan insiden × 1,000,000 ÷ jumlah jam kerja","Bilangan insiden × 1,000 ÷ purata pekerja tahunan"],"a":3,"e":"Incidence Rate = number of incidents × 1000 / annual average employment.","r":[[76,142,"Traditional Performance Measurement | Incident Rate: | – Workplace with less LTI does not mean it is safer than the one with | a higher number if it has less workers – The number of undesired events for each one thousand | persons' working at that location eliminates this problem | number of incidents 1000 …"]]},{"q":"Formula Kadar Kekerapan (Frequency Rate) dalam slaid ialah:","o":["Bilangan insiden × 1,000,000 ÷ jumlah jam kerja","Jumlah hari hilang × 1,000 ÷ purata pekerja","Bilangan insiden × 200 ÷ jumlah pekerja","Bilangan insiden × 1,000 ÷ purata pekerja"],"a":0,"e":"Frequency Rate = Number of Incidents × 1,000,000 / Total Hours Worked – lebih tepat untuk perbandingan lokasi serupa.","r":[[77,143,"Traditional Performance Measurement | Frequency Rate: | – The incident rate measure is a good measure for | comparisons between two locations – However this is less accurate if the number of hours worked by | each person is different – The frequency rate is a better comparison especially between similar work …"]]},{"q":"Ukuran prestasi yang menunjukkan keseriusan insiden berdasarkan hari kerja yang hilang ialah:","o":["Kadar insiden","Kadar keterukan (Severity Rate)","Kadar kematian","Kadar kekerapan"],"a":1,"e":"Severity Rate = Total Workdays Lost × 1,000,000 / Total Hours Worked.","r":[[78,143,"Traditional Performance Measurement | Severity Rate: | – The Incident Rate and Frequency Rate do not indicate how severe the incidents are – If the number of days lost are taken into account as a measure of | severity than the severity rate will show the seriousness of the incidents in the workplace | Severity Rate …"]]},{"q":"Syarikat dengan 450 pekerja bekerja 45 jam seminggu selama 50 minggu mengalami 8 kemalangan hilang masa. Berapakah kadar kekerapannya (× 1,000,000)?","o":["Lebih kurang 7.9","Lebih kurang 79","Lebih kurang 0.79","Lebih kurang 17.8"],"a":0,"e":"Jam kerja = 450 × 45 × 50 = 1,012,500. FR = 8 × 1,000,000 / 1,012,500 ≈ 7.9.","r":[[77,143,"Traditional Performance Measurement | Frequency Rate: | – The incident rate measure is a good measure for | comparisons between two locations – However this is less accurate if the number of hours worked by | each person is different – The frequency rate is a better comparison especially between similar work …"],[85,147,"Group Activity:- | QUESTION 1 | Azman Food Industry started operation since 1990. Presently there are 450 workers working for 45 hours per week for 50 weeks. If the company had 8 accidents which involve lost time work, calculate the frequency rate and incident rate for the company. | QUESTION 2 | Dinar Emas Berhad …"]]},{"q":"Dalam piramid dokumentasi, dokumen Tahap 1 ialah:","o":["Manual","Borang dan rekod","Prosedur","Arahan kerja/SWP"],"a":0,"e":"Four levels: Level 1 Manual, Level 2 Procedures, Level 3 Work Instructions/SWP, Level 4 Forms and records.","r":[[88,148,"Levels of Documentation | • What is a document? – Information and its supporting medium – Paper or booklet providing information – Record or report in detail | • There are four levels of documentation – Manual – Procedures – Work Instructions / Safe Work Procedure – Forms and records"]]},{"q":"Prosedur kerja selamat seperti operasi forklift dan kerja di tempat tinggi tergolong dalam dokumentasi Tahap:","o":["1 – Manual","3 – Arahan Kerja / Safe Work Procedure","2 – Prosedur","4 – Rekod"],"a":1,"e":"Level 3 – Work Instructions/SWP (how we do our daily job): contoh penggalian, operasi forklift, kerja di tempat tinggi.","r":[[101,155,"LEVEL 3 –WORK INSTRUCTIONS/ | SAFE WORK PROCEDURE (SWP)"],[103,156,"Example of Instruction/ Safe Work Procedure | • Excavation work • Forklift operation • Working at height • Pest control operation • Chemical management • Housekeeping • Heavy lifting • Night work • Traffic management | • Management of Change • PPE • Procurement and contracting • Contractor management"]]},{"q":"Menurut jadual tempoh simpanan rekod, data pemantauan perlu disimpan selama:","o":["10 tahun","5 tahun","30 tahun","7 tahun"],"a":2,"e":"Retention: rekod latihan 10 tahun; minit SHC 7 tahun; data pemantauan 30 tahun; rekod penyelenggaraan 10 tahun; MSDS 10 tahun.","r":[[108,158,"Records and Retention Periods On-site Records/files | Document Retention time | Training records 10 yrs. SHC minute of meeting 7 yrs Monitoring data 30 yrs. Failures, incidents, complaints and follow- up actions | 30 yrs. | Maintenance records 10 yrs. | Chemical inventory reports 30 yrs. Hazard communication …"]]}]},{"id":"4.05","title":"Managing of Emergency","total":169,"qs":[{"q":"'Kecemasan' (emergency) ditakrifkan sebagai:","o":["Kejadian dahsyat yang membawa kemusnahan besar","Gabungan keadaan yang tidak dijangka yang memerlukan tindakan segera","Kejadian yang berlaku secara kebetulan dan menyebabkan kerosakan","Situasi kompleks yang memerlukan 'normal baharu'"],"a":1,"e":"Definisi: Accident – kejadian tidak dijangka, berlaku secara kebetulan; Emergency – an unforeseen combination of circumstances that calls for immediate action; Disaster – kejadian dahsyat membawa kerosakan besar.","r":[[5,166,"Definition of Emergency – What is Emergency? | • Accident – unexpected event which cause damage @ harm. | Happens by chance | • Emergency – an unforeseen combination of circumstances @ the | resulting state that calls for immediate action | • Disaster – a sudden calamitous event bringing great damage, loss | @ …"]]},{"q":"Kecemasan yang memerlukan bantuan luar seperti bantuan bersama (mutual aid) atau agensi daerah dikategorikan sebagai:","o":["Tahap 3","Tahap 0","Tahap 2","Tahap 1"],"a":2,"e":"Level of emergency: Tahap 1 – dalam keupayaan organisasi; Ta  orang","1,000 orang","150 orang","20 orang"],"a":2,"e":"First-aid room: required when >150 employees; cukup besar untuk couch, lampu kecemasan, lantai tidak licin, akses kerusi roda/pengusung.","r":[[73,200,"First-Aid Room | • Required when >150 employees • Large enough for couch, with emergency lighting, non-slip floors and easy-clean surfaces • Clearly identified; maintain comfortable temperature, humidity and privacy • Located near showers, lifts and main passages; accessible to car park for ambulance transfer • …"]]},{"q":"Di kawasan penyimpanan atau pengendalian bahan kimia, kemudahan yang perlu disediakan ialah:","o":["Kipas angin","Pancuran kecemasan (flood shower) dan pancutan pencuci mata bertekanan rendah","Penghawa dingin","Mesin layan diri"],"a":1,"e":"First-aid equipment: in areas where chemicals are stored, handled or used – emergency flood showers dan low pressure eye-wash fountains.","r":[[72,199,"First-Aid Equipment | • In areas where chemicals are stored, handled, or used provide: | – Emergency flood showers | – Low pressure eye-wash fountains"]]},{"q":"Perbezaan 'krisis' berbanding 'kecemasan' menurut slaid ialah krisis:","o":["Berlaku secara kebetulan sahaja","Situasi kompleks dan berubah-ubah dengan ketidakpastian tinggi yang memerlukan 'normal baharu'","Mempunyai punca yang diketahui dan cepat kembali normal","Tidak menjejaskan operasi"],"a":1,"e":"Terminology: Emergency – urgent, complicated event with known cause, aim is rapid return to normal; Crisis – complex, evolving situation, high uncertainty, requires creating a new normal.","r":[[79,203,"Terminology | • Accident – unexpected event which cause damage @ harm. Happens by chance | • Emergency: urgent, complicated event with known cause; aim is rapid return to normal | • Crisis: complex, evolving situation marked by high uncertainty; requires creating a new | normal | • A Crisis Management Plan (CMP) : …"]]},{"q":"Fasa pengurusan krisis yang melibatkan perancangan, latihan dan penetapan prosedur sebelum krisis berlaku ialah:","o":["Mitigation","Preparedness (Kesiapsiagaan)","Recovery","Response"],"a":1,"e":"Phases: 1 Mitigation – cegah/kurangkan risiko; 2 Preparedness – perancangan, latihan, prosedur; 3 Response; 4 Recovery; 5 Improvement.","r":[[88,207,"Phases of Crisis Management | 1. Mitigation – Actions taken to prevent or reduce risk. | 2. Preparedness – Planning, training, and establishing procedures. | 3. Response – Immediate actions during crisis. | 4. Recovery – Restoring operations and learning from the event. | 5. Improvement – Share findings with …"],[90,208,"Phase 2: Preparedness | • Objective: Ensure readiness before crisis occurs. | • Examples: | -Develop emergency plans | -Conduct drills and simulations | -Establish communication channels | -Train crisis response teams"]]},{"q":"Di bawah Akta Perkhidmatan Bomba 1988, Perakuan Bomba (Fire Certificate) bagi premis yang ditetapkan perlu:","o":["Diperbaharui setiap 5 tahun","Dimohon sekali sahaja seumur hayat","Dikeluarkan oleh JKKP","Diperbaharui setiap tahun"],"a":3,"e":"Every designated premises must hold a Fire Certificate, renewable annually; permohonan memerlukan pelan dan pemeriksaan.","r":[[84,205,"Fire Services Act & Fire Certificate | • Director General may designate specific uses, sizes or locations of premises | • Every designated premises must hold a Fire Certificate, renewable annually | • Application requires plans and inspection to verify life safety, fire prevention and fire-fighting systems | • Fire …"]]},{"q":"Dalam Business Impact Analysis (BIA), 'MAO' bermaksud:","o":["Maximum Acceptable Outage","Maximum Allowable Overtime","Main Assembly Operation","Minimum Action Order"],"a":0,"e":"Key components of BIA: kenal pasti fungsi kritikal, analisis impak, Maximum Acceptable Outage (MAO), pemetaan kebergantungan sumber, RTO dan RPO.","r":[[98,212,"Key Components of BIA | • Identification of critical functions. | • Impact analysis (financial, operational, reputational). | • const LET = ['A','B','C','D'];
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = id=>'c'+id.toLowerCase().replace('.','-');
const findCh = h=>{for(const m of DATA.modules)for(const c of m.chapters)if(slug(c.id)===h)return [m,c];return [null,null]};

/* progress store (per-viewer convenience only) */
let PROG = {};
try{PROG = JSON.parse(localStorage.getItem('kuizsho')||'{}')||{}}catch(e){PROG={}}
const save=()=>{try{localStorage.setItem('kuizsho',JSON.stringify(PROG))}catch(e){}};
const st = id=>(PROG[id] ||= {pick:{},first:{},rev:{}});
const chScore = c=>{const s=PROG[c.id];if(!s)return [0,0];let ok=0,ans=0;c.qs.forEach((q,i)=>{if(s.first[i]!==undefined){ans++;if(s.first[i]===q.a)ok++}});return [ok,ans]};

function route(){
  const h = location.hash.slice(1);
  window.scrollTo(0,0);
  if(/^m[1-4]$/.test(h)) return showModule(+h[1]);
  if(h.startsWith('c')){const [m,c]=findCh(h); if(c) return showChapter(m,c);}
  showHome();
}
const go = h=>{ if(location.hash==='#'+h) route(); else location.hash=h; };

function showHome(){
  $('#bar').innerHTML='';
  $('#hdr').innerHTML=`<div class="eyebrow">Safety and Health Officer · NIOSH Malaysia</div>
    <h1>Kuiz Latihan SHO</h1>
    <p class="sub">Pilih modul, kemudian bab. Setiap bab mengandungi 20 soalan objektif beserta penerangan dan rujukan nombor slaid dalam buku kursus.</p>`;
  const cards = DATA.modules.map(m=>{
    const ready=m.chapters.filter(c=>c.qs.length);
    const tq=ready.reduce((a,c)=>a+c.qs.length,0);
    let ok=0,ans=0; ready.forEach(c=>{const [o,a]=chScore(c);ok+=o;ans+=a});
    const pct = tq? Math.round(ans/tq*100):0;
    return `<button class="mod" data-m="${m.n}">
      <span class="num">0${m.n}</span>
      <h2>${esc(m.title)}</h2>
      <span class="en">${esc(m.en)}</span>
      <span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span>
      <span class="meta"><span>${m.chapters.length} bab · ${tq} soalan</span><span>${ans? `${ok}/${ans} betul`:'Belum mula'}</span></span>
    </button>`}).join('');
  $('#view').innerHTML=`<h2 style="font-size:26px">Pilih modul</h2><div class="modgrid">${cards}</div>
    <div class="howto">
      <div><b>1 · Pilih jawapan</b>Klik satu pilihan. Jawapan betul akan disambut dengan bunga api.</div>
      <div><b>2 · Tukar jika perlu</b>Anda boleh menukar pilihan selagi jawapan belum didedahkan.</div>
      <div><b>3 · Dedah jawapan</b>Lihat jawapan sebenar, penerangan dan rujukan slaid.</div>
    </div>`;
  document.querySelectorAll('.mod').forEach(b=>b.onclick=()=>go('m'+b.dataset.m));
}

function showModule(n){
  const m = DATA.modules[n-1];
  $('#bar').innerHTML='';
  $('#hdr').innerHTML=`<div class="crumbs"><button data-h="">Utama</button><span>›</span><span>Modul ${n}</span></div>
    <div class="eyebrow">Modul ${n}</div><h1>${esc(m.title)}</h1><p class="sub">${esc(m.en)}</p>`;
  const rows = m.chapters.map(c=>{
    const ready=c.qs.length>0; const [ok,ans]=chScore(c);
    const sc = !ready?'Akan datang': ans? `${ok}/${c.qs.length}` : `${c.qs.length} soalan`;
    return `<button class="ch" data-h="${slug(c.id)}" ${ready?'':'disabled'}>
      <span class="id">${esc(c.id)}</span>
      <span class="t">${esc(c.title)}<span class="s">${c.total} slaid</span></span>
      <span class="score ${ans===c.qs.length&&ready?'done':''}">${sc}</span></button>`}).join('');
  $('#view').innerHTML=`<h2 style="font-size:26px">Pilih bab</h2><div class="chlist">${rows}</div>`;
  bindCrumbs();
  document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>go(b.dataset.h));
}
function bindCrumbs(){document.querySelectorAll('.crumbs button').forEach(b=>b.onclick=()=>go(b.dataset.h))}

function showChapter(m,c){
  const s = st(c.id);
  $('#hdr').innerHTML=`<div class="crumbs"><button data-h="">Utama</button><span>›</span><button data-h="m${m.n}">Modul ${m.n}</button><span>›</span><span>Bab ${esc(c.id)}</span></div>
    <div class="eyebrow">Modul ${m.n} · Bab ${esc(c.id)} · ${c.total} slaid</div><h1>${esc(c.title)}</h1>`;
  bindCrumbs();
  $('#bar').innerHTML=`<div class="qbar"><div class="wrap">
    <span class="stat">Dijawab <b id="nAns">0</b>/${c.qs.length}</span>
    <span class="prog" aria-hidden="true"><i id="pBar"></i></span>
    <span class="stat">Betul cubaan pertama <b id="nOk">0</b></span>
    <button class="btn" id="reset">Set semula</button></div></div>`;
  $('#reset').onclick=()=>{ if($('#reset').dataset.arm){delete PROG[c.id];save();showChapter(m,c);} else {$('#reset').dataset.arm=1;$('#reset').textContent='Klik lagi untuk sahkan';setTimeout(()=>{const r=$('#reset');if(r){delete r.dataset.arm;r.textContent='Set semula'}},3000)} };
  $('#view').innerHTML = c.qs.map((q,i)=>`<article class="q" id="q${i}">
      <div class="qn"><span class="badge">${i+1}</span><div class="qt">${esc(q.q)}</div></div>
      <div class="opts" role="group" aria-label="Pilihan jawapan soalan ${i+1}">
        ${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="L">${LET[k]}</span><span>${esc(o)}</span><span class="mk"></span></button>`).join('')}
      </div>
      <div class="qfoot"><span class="hint"></span><button class="reveal">Dedah jawapan</button></div>
      <div class="ans" hidden></div>
    </article>`).join('') + `<div id="fin"></div>`;
  c.qs.forEach((q,i)=>{
    const card = $('#q'+i);
    card.querySelectorAll('.opt').forEach(b=>b.onclick=e=>pick(c,i,+b.dataset.k,e));
    card.querySelector('.reveal').onclick=()=>reveal(c,i,true);
    paint(c,i);
  });
  stats(c);
}

function pick(c,i,k,e){
  const s=st(c.id); if(s.rev[i]) return;
  s.pick[i]=k; if(s.first[i]===undefined) s.first[i]=k; save();
  paint(c,i); stats(c);
  if(k===c.qs[i].a){ const r=e.currentTarget.getBoundingClientRect(); celebrate(r.left+r.width/2, r.top+r.height/2); }
}
function reveal(c,i){ const s=st(c.id); s.rev[i]=1; if(s.first[i]===undefined) s.first[i]=-1; save(); paint(c,i); stats(c); }

function paint(c,i){
  const q=c.qs[i], s=st(c.id), card=$('#q'+i), p=s.pick[i], rev=!!s.rev[i];
  card.querySelectorAll('.opt').forEach(b=>{
    const k=+b.dataset.k; b.className='opt'; b.disabled=rev; const mk=b.querySelector('.mk'); mk.textContent='';
    if(rev){ if(k===q.a){b.classList.add('correct');mk.textContent='Jawapan'} else if(k===p){b.classList.add('wrong');mk.textContent='Pilihan anda'} }
    else if(k===p) b.classList.add('picked');
  });
  card.querySelector('.hint').textContent = rev ? (p===q.a?'Anda menjawab dengan betul.':p===undefined?'Anda tidak memilih jawapan.':'Jawapan anda kurang tepat.') : (p===undefined?'Pilih satu jawapan.':'Pilihan anda: '+LET[p]);
  card.querySelector('.reveal').hidden = rev;
  const a=card.querySelector('.ans'); a.hidden=!rev;
  if(rev && !a.innerHTML){
    a.innerHTML = `<div class="lab">Jawapan: ${LET[q.a]} · ${esc(q.o[q.a])}</div>
      <p>${esc(q.e)}</p>
      ${q.r.map(([sl,pg,ex])=>`<div class="ref"><div class="where"><span class="k">Slaid ${sl}</span><span>Bab ${esc(c.id)} · ${esc(c.title)}</span><span>Slaid ${sl} daripada ${c.total}</span><span>Halaman ${pg}</span></div>
        <blockquote>${ex.split(' | ').map(esc).join('<br>')}</blockquote></div>`).join('')}`;
  }
}
function stats(c){
  const s=st(c.id); let ans=0,ok=0;
  c.qs.forEach((q,i)=>{ if(s.first[i]!==undefined && s.first[i]!==-1 || s.rev[i]){ans++} if(s.first[i]===q.a)ok++; });
  $('#nAns').textContent=ans; $('#nOk').textContent=ok; $('#pBar').style.width=(ans/c.qs.length*100)+'%';
  const fin=$('#fin');
  if(ans===c.qs.length){
    const [m] = DATA.modules.filter(m=>m.chapters.includes(c)); const idx=m.chapters.indexOf(c); const nx=m.chapters.slice(idx+1).find(x=>x.qs.length);
    fin.innerHTML=`<div class="done-card"><div><div class="eyebrow">Bab selesai</div><h2>${ok}/${c.qs.length} betul pada cubaan pertama</h2></div>
      ${nx?`<button class="btn" id="nxt">Bab seterusnya: ${esc(nx.id)} ›</button>`:`<button class="btn" id="nxt">Kembali ke Modul ${m.n}</button>`}</div>`;
    $('#nxt').onclick=()=>go(nx?slug(nx.id):'m'+m.n);
  } else fin.innerHTML='';
}

/* ---- fireworks ---- */
const fx=$('#fx'), ctx=fx.getContext('2d'); let parts=[], rockets=[], raf=0, W=0, H=0, DPR=1;
const COLS=['#f5c400','#2fae74','#ff5a36','#3fa9f5','#ffffff','#ff4fa3','#9b6bff'];
function size(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;fx.width=W*DPR;fx.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size); size();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x,y,n){const col=COLS[Math.random()*COLS.length|0], col2=COLS[Math.random()*COLS.length|0];
  for(let j=0;j<n;j++){const a=Math.random()*Math.PI*2, sp=2+Math.random()*(reduce?3:6.5);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.008+Math.random()*.012,c:Math.random()<.7?col:col2,r:1.6+Math.random()*1.8})}}
function celebrate(ox,oy){
  burst(ox,oy,reduce?40:90);
  if(!reduce){
    const n=7; for(let k=0;k<n;k++){ const tx=W*(.1+.8*Math.random()), ty=H*(.12+.4*Math.random());
      rockets.push({x:tx+(Math.random()-.5)*60,y:H+10,tx,ty,delay:k*140+Math.random()*120,t0:performance.now()}); }
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(now){
  ctx.globalCompositeOperation='destination-out'; ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  rockets=rockets.filter(r=>{ if(now-r.t0<r.delay) return true;
    r.y-= (r.y-r.ty)*.09+3; r.x+=(r.tx-r.x)*.06;
    ctx.fillStyle='#fff3c4'; ctx.beginPath(); ctx.arc(r.x,r.y,2.2,0,7); ctx.fill();
    if(r.y-r.ty<6){burst(r.x,r.y,80); return false} return true; });
  parts=parts.filter(p=>{ p.vx*=.985; p.vy=p.vy*.985+.06; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
    if(p.life<=0) return false; ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); return true; });
  ctx.globalAlpha=1;
  if(parts.length||rockets.length) raf=requestAnimationFrame(tick); else {ctx.clearRect(0,0,W,H); raf=0}
}

addEventListener('hashchange',route); route();
</script>
