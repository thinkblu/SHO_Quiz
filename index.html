ad 50 μg/dL | N-hexane Urine 2,5-Hexanedione 0.5 mg/L | Cadmium Urine cadmium blood cadmium | 5 μg/g creatinine 5 μg/L"]]},{"q":"BEL mewakili tahap penentu yang diperhatikan dalam pekerja yang terdedah secara eksklusif melalui sedutan pada tahap:","o":["Separuh PEL","Tahap maut","Dua kali PEL","PEL masing-masing"],"a":3,"e":"BEL: levels of determinants observed in workers exposed exclusively by inhalation at the level of respective PEL.","r":[[37,432,"Biological Exposure Limit (BEL) | • BEL is the representative of the levels of determinants which are observed in workers exposed to chemicals, exclusively by inhalation at the level of respective Permissible Exposure Limit (PEL). | • Example of established BEL: | • Biological Exposure Indices (BEI) – ACGIH | • …"]]}],"v":"00e081dc","lv":"00e081dc"},{"id":"3.15","title":"Ventilation","total":35,"qs":[{"q":"Dua kategori utama sistem pengudaraan ialah:","o":["Pengudaraan manual dan solar","Pengudaraan siang dan malam","Pengudaraan keselesaan (HVAC) dan pengudaraan industri","Pengudaraan dalaman dan luaran sahaja"],"a":2,"e":"Comfort ventilation (HVAC) mengawal suhu, kelembapan dan bau; industrial ventilation mengawal pencemar berbahaya.","r":[[5,438,"Introduction to Ventilation | • Ventilation systems are divided into two: | 1. Comfort Ventilation (HVAC): Controls temperature, humidity and odors | -used in homes, offices and commercial buildings. | 2. Industrial Ventilation: Controls hazardous contaminants | -used in workplaces and industries to protect health …"]]},{"q":"Pengudaraan keselesaan (HVAC) terutamanya mengawal:","o":["Suhu, kelembapan dan bau","Gas toksik di sumber","Wasap kimpalan sahaja","Debu silika"],"a":0,"e":"Comfort Ventilation (HVAC): controls temperature, humidity and odors – digunakan di rumah, pejabat dan bangunan komersial.","r":[[5,438,"Introduction to Ventilation | • Ventilation systems are divided into two: | 1. Comfort Ventilation (HVAC): Controls temperature, humidity and odors | -used in homes, offices and commercial buildings. | 2. Industrial Ventilation: Controls hazardous contaminants | -used in workplaces and industries to protect health …"]]},{"q":"Rujukan utama pengudaraan industri dalam slaid ialah manual ACGIH edisi:","o":["Ke-20 (2000)","Ke-28 (2016)","Ke-25 (2010)","Ke-31 (2023)"],"a":3,"e":"Sumber: Industrial Ventilation: A Manual of Recommended Practice for Design, 31st Edition, ACGIH 2023.","r":[[5,438,"Introduction to Ventilation | • Ventilation systems are divided into two: | 1. Comfort Ventilation (HVAC): Controls temperature, humidity and odors | -used in homes, offices and commercial buildings. | 2. Industrial Ventilation: Controls hazardous contaminants | -used in workplaces and industries to protect health …"]]},{"q":"Pengudaraan pencairan (dilution) berfungsi dengan cara:","o":["Menutup sumber sepenuhnya","Menangkap pencemar di sumbernya","Mencampurkan udara luar bersih dengan udara dalam untuk mengurangkan kepekatan pencemar","Menapis udara di dalam respirator"],"a":2,"e":"Dilution: udara luar tidak tercemar mengalir masuk dan bercampur, mencairkan kepekatan pencemar ke tahap boleh diterima.","r":[[8,439,"Dilution Ventilation | • Uncontaminated outside air flowing into the room mixes with the air inside thus diluting and reducing the concentration of air contaminants to acceptable levels. | Generation Air Movement"]]},{"q":"Sistem bekalan udara (supply system) digunakan untuk:","o":["Menyimpan bahan kimia","Membakar sisa","Membekalkan udara bersih dan menggantikan udara yang diekzos","Menyedut pencemar di sumber"],"a":2,"e":"Supply system: membekalkan udara bersih, mewujudkan persekitaran selesa dan menggantikan udara yang diekzos.","r":[[9,440,"Supply System | • Used to supply air to work space, to: | • Used to supply clean air to a workplace | • Create comfortable environment | • Replace air exhausted"]]},{"q":"Dua klasifikasi sistem ekzos ialah:","o":["Ekzos kering dan basah","Ekzos manual dan automatik","Ekzos am dan ekzos setempat (LEV)","Ekzos panas dan sejuk"],"a":2,"e":"Exhaust system: general exhaust system dan local exhaust system.","r":[[11,441,"Exhaust System | • Used to remove contaminants generated so as to maintain healthful work environment. | • Classified as: | • General exhaust system | • Local exhaust system."]]},{"q":"Sistem ekzos am memerlukan:","o":["Hud pada setiap mesin","Kuantiti udara yang besar untuk mencairkan pencemar ke tahap selamat","Kuantiti udara yang sangat kecil","Tiada sistem bekalan pengganti"],"a":1,"e":"General exhaust: kawalan haba dan pencairan; memerlukan kuantiti udara besar; sistem bekalan biasanya menggantikan udara yang diekzos.","r":[[12,441,"General Exhaust System | • Used for – | • Heat control | • Removal of contaminant generated (dilution system) | • Large quantities of air needed to mix with contaminant to bring down its concentration to safe level. | • Mixed contaminated air then is discharged to atmosphere. | • Supply system usually used to …"]]},{"q":"Tujuan utama Sistem Pengudaraan Ekzos Setempat (LEV) ialah:","o":["Menyingkirkan pencemar di titik penjanaannya untuk mengelakkan sedutan pekerja","Mencairkan pencemar di seluruh bangunan","Menyejukkan bilik","Membekalkan udara steril"],"a":0,"e":"LEV: menyingkirkan pencemar di titik penjanaan supaya tidak disedut oleh pekerja.","r":[[13,442,"Local Exhaust Ventilation System | • LEV system is a system to remove contaminants at its point of generation so as to prevent inhalation by workers. | • Purpose is to remove contaminants at its point of generation so as to prevent inhalation by workers."]]},{"q":"Yang manakah BUKAN prinsip LEV?","o":["Menangkap pencemar dengan halaju mencukupi","Menutup sumber selengkap mungkin","Menyalurkan ekzos berhampiran salur masuk udara","Membekalkan udara gantian mencukupi"],"a":2,"e":"Prinsip LEV: tutup sumber, tangkap dengan halaju mencukupi, jauhkan dari zon pernafasan, udara gantian mencukupi dan lepaskan ekzos jauh dari salur masuk.","r":[[14,442,"Principles of LEV | • Enclose source as completely as practicable. | • Capture contaminant with adequate velocity. | • Keep contaminant out of breathing zone of worker. | • Supply adequate make-up air. | • Discharge exhausted air away from inlet system."]]},{"q":"Sistem bekalan-ekzos (supply-exhaust) sesuai digunakan di:","o":["Tapak semaian","Gudang terbuka","Tempat letak kereta terbuka","Bilik pembedahan hospital"],"a":3,"e":"Supply-exhaust: hospital/bilik bedah (bekal udara steril, ekzos udara tercemar) dan industri cat/kimia.","r":[[15,443,"Supply-exhaust system | • To provide clean air supply while removing contaminated air, ensuring safety, comfort and compliance. | • Hospitals / Operating Rooms – supply sterile air, exhaust contaminated air | • Painting / Chemical Industry – exhaust solvents and vapors, supply safe ventilation"]]},{"q":"Salah satu tujuan sistem pengudaraan ialah:","o":["Melindungi pekerja daripada pencemar toksik","Meningkatkan bunyi bising","Menyimpan bahan kimia","Menambah kelembapan berlebihan"],"a":0,"e":"Purposes: perlindungan pekerja daripada pencemar toksik dan kawalan bau, kelembapan, haba berlebihan dan keadaan tidak diingini.","r":[[19,445,"Purposes of Ventilation System | • For worker protection against toxic contaminants generated in workplace operations and processes. | • For control of odour, moisture, excessive heat and other undesirable environmental conditions at workplace."]]},{"q":"Komponen sistem pengudaraan yang mengumpul atau menerima pencemar yang dikeluarkan ialah:","o":["Pembersih udara","Serombong (stack)","Kipas","Hud (hood)"],"a":3,"e":"Hood: mengumpul/menerima pencemar; ducting: mengangkut udara; air cleaner: menyingkirkan pencemar; fan: tekanan statik; stack: menyebarkan ke udara ambien.","r":[[21,446,"Basic Components of Ventilation System | AIR CLEANER | HOOD | DUCTING | FAN | STACK | To disperse contaminants to ambient air & reduce their | To transport | To collect, receives or | To supply required static | air & entrained contaminant | To remove contaminants | contains | pressure & | from air | re- …"]]},{"q":"Komponen yang membekalkan tekanan statik dan menggerakkan udara secara fizikal dalam sistem ialah:","o":["Serombong","Saluran","Hud","Kipas"],"a":3,"e":"Fan: to supply required static pressure & physically moves air within the system.","r":[[21,446,"Basic Components of Ventilation System | AIR CLEANER | HOOD | DUCTING | FAN | STACK | To disperse contaminants to ambient air & reduce their | To transport | To collect, receives or | To supply required static | air & entrained contaminant | To remove contaminants | contains | pressure & | from air | re- …"]]},{"q":"Komponen utama dalam sistem pengudaraan am (GV) ialah:","o":["Kipas ekzos atau peniup","Hud dan saluran yang panjang","Pembersih udara","Serombong tinggi"],"a":0,"e":"Komponen utama GV ialah kipas ekzos atau blower; biasanya tiada hud dan saluran ekzos yang ekstensif.","r":[[22,446,"Typical Components of General Ventilation System | • The primary component in a general ventilation (GV) system is an exhaust fan or blower. | • Typically, a GV does not include hoods and extensive exhaust ducting."]]},{"q":"Di bawah Peraturan 17 USECHH, peralatan kawalan kejuruteraan perlu diperiksa oleh majikan pada selang tidak melebihi:","o":["Satu minggu","Dua belas bulan","Satu bulan","Enam bulan"],"a":2,"e":"Reg. 17: diperiksa oleh majikan pada selang tidak lebih sebulan; diperiksa dan diuji keberkesanan oleh HT pada selang tidak lebih 12 bulan.","r":[[27,449,"OSH (USECHH) Regulations 2000 | • Engineering control equipment (Reg. 17) | • Any engineering control equipment shall be | • Inspected at an interval no longer than one month by the employer. | • Examine and test for its effectiveness at interval no longer than twelve (12) months by Hygiene Technician"]]},{"q":"Peralatan kawalan kejuruteraan perlu diperiksa dan diuji keberkesanannya oleh Juruteknik Higien pada selang tidak melebihi:","o":["12 bulan","24 bulan","6 bulan"," aran","Kenderaan","Kilang pembuatan","Pejabat, institusi pendidikan dan restoran"],"a":3,"e":"Non-industrial buildings: pejabat, pendidikan, komersial, kesihatan, kafeteria, restoran, karaoke; tidak termasuk premis pembuatan dan kenderaan.","r":[[6,457,"BACKGROUND | IAQ problems arise in non-industrial buildings (an indoor or enclosed workspace that is served by a ventilating and air conditioning system where there are person at work but does not include premises that are used primarily as manufacturing and production facilities and vehicles). | (Source: ICOP IAQ …"]]},{"q":"Menurut ASHRAE, IAQ yang boleh diterima ialah udara tanpa pencemar berbahaya dan majoriti besar penghuni tidak menyatakan ketidakpuasan, iaitu biasanya lebih daripada:","o":["95%","80%","50%","60%"],"a":1,"e":"ASHRAE 62.1-2010: acceptable IAQ – substantial majority (usually more than 80%) do not express dissatisfaction.","r":[[9,459,"DEFINITION OF INDOOR AIR QUALITY (IAQ) | ASHRAE | US EPA | • Acceptable IAQ is air in which there are no known contaminant at harmful concentrations and with which a substantial majority (usually more than 80%) of the people exposed do not express any dissatisfaction. | • Indoor Air Quality (IAQ) refers to the air …"]]},{"q":"Peraturan Kawalan Hasil Tembakau 2004 dibuat di bawah:","o":["OSHA 1994","Akta Kualiti Alam Sekeliling","UBBL","Akta Makanan dan dikuatkuasakan oleh KKM"],"a":3,"e":"Control of Tobacco Product Regulations 2004: di bawah Food Act, dikuatkuasakan Kementerian Kesihatan.","r":[[12,460,"CONTROL OF TOBACCO PRODUCT REGULATIONS 2004 | • A regulation made under the Food Act | • Enforced by Ministry of Health | • Control of smoking at enclosed public places | • Exemptions: casino, pub, discotheque and night clubs | • Separate smoking area"]]},{"q":"ICOP IAQ 2010 diluluskan oleh Menteri Sumber Manusia pada:","o":["1 Januari 2010","30 Ogos 2010","4 April 2000","30 Ogos 2005"],"a":1,"e":"ICOP IAQ 2010 diluluskan pada 30 Ogos 2010 dan menggantikan Code of Pr  kawalan perolehan.","r":[[41,97,"Clause 8.1 Operational planning and control | Processes needed to meet requirements of the organization need to be planned, implemented and controlled, as do the actions identified in clause 6. Requirements relate to the management of change, elimination of hazards and reduction of occupational health and safety …"]]},{"q":"Klausa ISO 45001 yang berkaitan kesediaan dan tindak balas kecemasan ialah:","o":["Klausa 6.2","Klausa 10.2","Klausa 7.4","Klausa 8.2"],"a":3,"e":"Clause 8.2 Emergency preparedness and response – termasuk tindak balas terancang dan pertolongan cemas.","r":[[42,97,"Clause 8.2 Emergency preparedness and response | Requires the organisation to establish, implement and maintain a process(es) | needed to prepare for and respond to | potential emergency situations. | Consideration should be given to how you intend | to: • Establish a planned response to emergency situations, …"]]},{"q":"Audit dalaman dan semakan pengurusan termasuk dalam klausa:","o":["9 Penilaian Prestasi","10 Penambahbaikan","7 Sokongan","8 Operasi"],"a":0,"e":"Clause 9: 9.1 pemantauan & pengukuran, 9.2 internal audit, 9.3 management review.","r":[[45,99,"Clause 9.2 Internal Audit | • Additional requirements are now specified relating to defining the ‘audit criteria’ and ensuring that the results of | the audits are reported to “relevant management”. However, there isno | fundamental change in approach | when • Considering the guidance provided within the clause …"],[46,99,"Clause 9.3 ManagementReview | There are now additional requirements | Consideration should be given to | 01 | including the consideration of changesin external and internal issues that | how your organisation addressesthese | 02 | changes. | are relevant to the | OHSMS."]]},{"q":"Proses menyiasat insiden, near miss dan ketidakakuran serta pelan tindakan pembetulan diperuntukkan dalam klausa:","o":["8.1","10.2","5.3","9.2"],"a":1,"e":"Clause 10.2 Incident, Nonconformity and Corrective Action.","r":[[49,101,"Clause 10.2 Incident, Nonconformity and Corrective Action | • Covers the requirement for establishing processes to | investigate incidents, near misses | and other non-conformities and provide a corrective action plan. | • Consideration should be given to how the organisation intends to | achieve this"]]}],"v":"d827d8cf","lv":"d827d8cf"},{"id":"4.04","title":"Communication & Performance Monitoring","total":116,"qs":[{"q":"Sesuatu mesej boleh disalah faham oleh penerima disebabkan perkara berikut KECUALI:","o":["Mesej bukan lisan daripada pengirim","Bunyi latar dan pendengaran penerima","Pendidikan, pengalaman dan budaya penerima","Mesej yang ringkas, jelas dan tepat"],"a":3,"e":"Komunikasi ialah proses dua hala; salah faham disebabkan pendidikan/pengalaman/budaya penerima, bunyi latar dan mesej bukan lisan pengirim.","r":[[7,108,"Communication Process | • Communication is a two-way process | • A message maybe misunderstood by a recipient because of the following: | – The education, experience and culture of the | recipient – Background noise and the hearing of the recipient – The perceived non-verbal message coming from the sender"]]},{"q":"Mesyuarat toolbox biasanya diadakan:","o":["Setiap pagi oleh penyelia, ringkas (10–15 minit) dan satu topik","Sebulan sekali selama 2 jam","Hanya selepas kemalangan","Setahun sekali oleh pengurus besar"],"a":0,"e":"Toolbox meeting: setiap pagi oleh penyelia sebelum kerja bermula, ringkas 10–15 minit dan satu topik.","r":[[11,110,"Toolbox Meeting | • Toolbox meetings are carried out regularly: – Every morning by the supervisor | before the workers start their work – To remind workers of the danger or hazards in the workplace during the activities for the day • Brief (10 -15 minutes) and on one topic • Attention is given to requirement for …"]]},{"q":"Sumber maklumat statistik kemalangan dan program pemulihan di Malaysia ialah:","o":["Perpustakaan","Persatuan perdagangan","CIDB","PERKESO (SOCSO)"],"a":3,"e":"Information sources: NIOSH (latihan, maklumat OSH), SOCSO (statistik kemalangan, program pemulihan), DOSH (perundangan), CIDB (pembinaan).","r":[[13,111,"Information Sources | • NIOSH - Training Program, OSH Information, | Consultation Services Information | • SOCSO - Statistical information on accidents | - Rehabilitation Program information | • DOSH - Legislation information | • CIDB - Construction information"]]},{"q":"Kesilapan biasa dalam 'mendengar secara aktif' termasuk:","o":["Kontak mata yang baik","Menyampuk dengan pendapat sendiri dan cuba menyelesaikan masalah","Memberi isyarat 'saya mendengar'","Kenyataan sokongan"],"a":1,"e":"Avoid: menyampuk dengan pendapat sendiri, bertanya terlalu awal, membuat penilaian nilai, cuba menyelesaikan masalah, dan mendengar aktif bila tiada masa.","r":[[18,113,"Active Listening | Avoid these common mistakes: | – Interject with your own opinions and | ideas – Ask questions too | early in the conversation – Make value judgements – Attempt to solve the problem – Use Active Listening when you | don't have the time to really listen"]]},{"q":"Kaedah mengendalikan konflik dengan berkompromi tanpa menangani punca asas, yang merupakan penyelesaian jangka pendek, dipanggil:","o":["Resolution","Avoidance","Management","Settlement"],"a":3,"e":"Settlement: compromise without dealing with underlying cause, a short-lived solution; Resolution: kenal pasti masalah asas dan bangunkan penyelesaian.","r":[[20,114,"Dealing with Conflicts | • SETTLEMENT - compromise without dealing with underlying cause, a short lived solution. | • MANAGEMENT - live with the conflict (how much can be tolerated and for how long?)"]]},{"q":"Menurut Ferdinand F. Fournies, salah satu sebab pekerja tidak berprestasi seperti dijangka ialah:","o":["Mereka tidak tahu cara melakukan tugas dengan betul","Mereka mempunyai terlalu banyak latihan","Mereka dibayar terlalu tinggi","Mereka terlalu berpengalaman"],"a":0,"e":"Fournies: pekerja tidak tahu mengapa perlu buat dan tidak tahu cara betul; pendidikan dan latihan menghapuskan punca prestasi rendah.","r":[[21,115,"Reason Why Employees Do Not Perform | As Expected - Ferdinand F. Fournies | • They don't know why they should do them. | • They do not know how to do the task correctly. | • Education and training will eliminate the causes for substandard performance. | • Education and training will give them knowledge. | • With …"]]},{"q":"Teknik promosi OSH TIDAK termasuk:","o":["Menyembunyikan statistik kemalangan","Penglibatan pekerja","Ganjaran, insentif dan disinsentif","Memimpin melalui teladan"],"a":0,"e":"Promotional techniques: leading by example, employee involvement, reward/incentives/disincentives, best practice, communication dan training.","r":[[23,116,"Promotional Technique | Use combinations of the following techniques to reinforce health and safety message: • Leading by example | • Employee involvement | • Use of reward, incentives and disincentives | • Best practice | • Communication | • Training"]]},{"q":"'Memimpin melalui teladan' (leading by example) bermaksud:","o":["Pengurusan di semua peringkat tidak pernah mengabaikan peraturan keselamatan","Pengurus dikecualikan daripada PPE","SHO sahaja menguatkuasakan keselamatan","Pekerja memimpin pengurus"],"a":0,"e":"Leading by example: pengurusan tidak mengabaikan peraturan keselamatan; keselamatan dikuatkuasakan oleh pengurusan semua peringkat, bukan SHO sahaja.","r":[[24,116,"Leading By Example | • Management at all levels and on all occasions must never ignore safety rules | • Use of non-verbal communications: – Top management seen to be committed – Safety is enforced by management at all levels | and not by the safety officer alone – Suggestion implemented if appropriate – Management …"]]},{"q":"Tahap latihan yang paling tinggi merangkumi pengetahuan, kelayakan, amalan dan pengalaman ialah:","o":["Am","Kompetensi","Kesedaran","Khusus"],"a":1,"e":"Levels of training: Awareness, General, Specific, Skills dan Competencies (knowledge, qualification, practice, experience).","r":[[33,121,"Levels of Training | • Awareness | • General | • Specific | • Skills | • Competencies (knowledge, qualification, practice and experience)"]]},{"q":"Pelantar MyKKP yang dibangunkan oleh JKKP digunakan untuk:","o":["Permohonan lesen memandu","Penghantaran borang JKKP secara dalam talian seperti notifikasi kemalangan (JKKP6) dan penyakit pekerjaan (JKKP9)","Pembayaran caruman KWSP","Pendaftaran syarikat dengan SSM"],"a":1,"e":"MyKKP: platform web untuk penghantaran borang JKKP6, JKKP9, pendaftaran tempat kerja, bayaran dalam talian dan penjejakan status.","r":[[51,130,"System Specifications | • Web-based platform (mykkp.dosh.gov.my). | • Online submission of JKKP forms (JKKP6, JKKP9, workplace registration, etc.). | • Online payments with receipt downloads (MyTracker). | • Notification system for application status. | • Integration with MalaysiaBiz and other government portals."],[53,131,"Key Functions | • User registration and account management. | • Submission of accident notifications (JKKP6) & occupational disease reports (JKKP9). | • Application for machinery inspection, factory/workplace registration. | • Online payment and receipt download. | • Tracking application status and notifications."]]},{"q":"Penggunaan dron dalam OSH terutamanya untuk:","o":["Analisis data besar","Latihan imersif","Pemeriksaan dan pemantauan/pemetaan kawasan","Dokumentasi surat-menyurat"],"a":2,"e":"Current technologies: wearables/IoT, drone (inspection, area monitoring/mapping), VR/AR, big data & AI.","r":[[43,126,"Current Technologies & Benefits | • Wearables / IoT (smart helmet, sensors): | real-time monitoring, hazard alerts | • Drone – Inspection, area monitoring/mapping | • VR/AR & e-Learning: | immersive training, safer practice, cost-effective | • Big Data & AI: | predictive risk analysis, trend detection, proactive …"]]},{"q":"Penunjuk prestasi PROAKTIF (leading indicator) termasuk:","o":["Peratusan latihan yang disiapkan","Kadar kematian","Kadar insiden","Bilangan kemalangan"],"a":0,"e":"Proactive: pematuhan perundangan, % latihan disiapkan, kekerapan pemeriksaan, tindakan pembetulan tepat masa, latihan kecemasan.","r":[[73,141,"Ways of Measuring Performance | • Proactive (Leading indicator - use measure for prevention) - •Compliance (towards legal requirement -- Regulations, Codes of practice, Guidelines) •Activity (training, safety meeting, inspection) | • Reactive (Lagging indicator - use measure for correction) - •Near misses, injury, …"],[81,145,"Proactive Performance Measures | • Percent of compliance to legislation | • Percentage of training completed | • Frequency of \"walk through\"and “checklist inspections” carried out | • Number of corrective actions completed on time"]]},{"q":"Kelemahan utama ukuran prestasi REAKTIF ialah:","o":["Ia mengukur kegagalan mencegah insiden dan bergantung pada pelaporan yang baik","Ia mencegah semua kemalangan","Ia mengukur aktiviti latihan","Ia tidak memerlukan data"],"a":0,"e":"Disadvantages of reactive measures: mengukur kegagalan, bukan 'safeness'; sangat bergantung pada pelaporan yang baik (contoh near misses).","r":[[74,141,"Disadvantages of Reactive Measures | • Traditional performance measures have been reactive measures • They measure failure to prevent incidents rather than “safeness” • Useful for measuring deficiencies and deviations • These measures are very dependent upon good reporting (e.g. near misses)"]]},{"q":"Formula Kadar Insiden (Incidence Rate) ialah:","o":["Bilangan kematian × 100 ÷ jumlah pekerja","Jumlah hari hilang × 1,000,000 ÷ jumlah jam kerja","Bilangan insiden × 1,000,000 ÷ jumlah jam kerja","Bilangan insiden × 1,000 ÷ purata pekerja tahunan"],"a":3,"e":"Incidence Rate = number of incidents × 1000 / annual average employment.","r":[[76,142,"Traditional Performance Measurement | Incident Rate: | – Workplace with less LTI does not mean it is safer than the one with | a higher number if it has less workers – The number of undesired events for each one thousand | persons' working at that location eliminates this problem | number of incidents 1000 …"]]},{"q":"Formula Kadar Kekerapan (Frequency Rate) dalam slaid ialah:","o":["Bilangan insiden × 1,000,000 ÷ jumlah jam kerja","Jumlah hari hilang × 1,000 ÷ purata pekerja","Bilangan insiden × 200 ÷ jumlah pekerja","Bilangan insiden × 1,000 ÷ purata pekerja"],"a":0,"e":"Frequency Rate = Number of Incidents × 1,000,000 / Total Hours Worked – lebih tepat untuk perbandingan lokasi serupa.","r":[[77,143,"Traditional Performance Measurement | Frequency Rate: | – The incident rate measure is a good measure for | comparisons between two locations – However this is less accurate if the number of hours worked by | each person is different – The frequency rate is a better comparison especially between similar work …"]]},{"q":"Ukuran prestasi yang menunjukkan keseriusan insiden berdasarkan hari kerja yang hilang ialah:","o":["Kadar insiden","Kadar keterukan (Severity Rate)","Kadar kematian","Kadar kekerapan"],"a":1,"e":"Severity Rate = Total Workdays Lost × 1,000,000 / Total Hours Worked.","r":[[78,143,"Traditional Performance Measurement | Severity Rate: | – The Incident Rate and Frequency Rate do not indicate how severe the incidents are – If the number of days lost are taken into account as a measure of | severity than the severity rate will show the seriousness of the incidents in the workplace | Severity Rate …"]]},{"q":"Syarikat dengan 450 pekerja bekerja 45 jam seminggu selama 50 minggu mengalami 8 kemalangan hilang masa. Berapakah kadar kekerapannya (× 1,000,000)?","o":["Lebih kurang 7.9","Lebih kurang 79","Lebih kurang 0.79","Lebih kurang 17.8"],"a":0,"e":"Jam kerja = 450 × 45 × 50 = 1,012,500. FR = 8 × 1,000,000 / 1,012,500 ≈ 7.9.","r":[[77,143,"Traditional Performance Measurement | Frequency Rate: | – The incident rate measure is a good measure for | comparisons between two locations – However this is less accurate if the number of hours worked by | each person is different – The frequency rate is a better comparison especially between similar work …"],[85,147,"Group Activity:- | QUESTION 1 | Azman Food Industry started operation since 1990. Presently there are 450 workers working for 45 hours per week for 50 weeks. If the company had 8 accidents which involve lost time work, calculate the frequency rate and incident rate for the company. | QUESTION 2 | Dinar Emas Berhad …"]]},{"q":"Dalam piramid dokumentasi, dokumen Tahap 1 ialah:","o":["Manual","Borang dan rekod","Prosedur","Arahan kerja/SWP"],"a":0,"e":"Four levels: Level 1 Manual, Level 2 Procedures, Level 3 Work Instructions/SWP, Level 4 Forms and records.","r":[[88,148,"Levels of Documentation | • What is a document? – Information and its supporting medium – Paper or booklet providing information – Record or report in detail | • There are four levels of documentation – Manual – Procedures – Work Instructions / Safe Work Procedure – Forms and records"]]},{"q":"Prosedur kerja selamat seperti operasi forklift dan kerja di tempat tinggi tergolong dalam dokumentasi Tahap:","o":["1 – Manual","3 – Arahan Kerja / Safe Work Procedure","2 – Prosedur","4 – Rekod"],"a":1,"e":"Level 3 – Work Instructions/SWP (how we do our daily job): contoh penggalian, operasi forklift, kerja di tempat tinggi.","r":[[101,155,"LEVEL 3 –WORK INSTRUCTIONS/ | SAFE WORK PROCEDURE (SWP)"],[103,156,"Example of Instruction/ Safe Work Procedure | • Excavation work • Forklift operation • Working at height • Pest control operation • Chemical management • Housekeeping • Heavy lifting • Night work • Traffic management | • Management of Change • PPE • Procurement and contracting • Contractor management"]]},{"q":"Menurut jadual tempoh simpanan rekod, data pemantauan perlu disimpan selama:","o":["10 tahun","5 tahun","30 tahun","7 tahun"],"a":2,"e":"Retention: rekod latihan 10 tahun; minit SHC 7 tahun; data pemantauan 30 tahun; rekod penyelenggaraan 10 tahun; MSDS 10 tahun.","r":[[108,158,"Records and Retention Periods On-site Records/files | Document Retention time | Training records 10 yrs. SHC minute of meeting 7 yrs Monitoring data 30 yrs. Failures, incidents, complaints and follow- up actions | 30 yrs. | Maintenance records 10 yrs. | Chemical inventory reports 30 yrs. Hazard communication …"]]}],"v":"97e46f48","lv":"97e46f48"},{"id":"4.05","title":"Managing of Emergency","total":169,"qs":[{"q":"'Kecemasan' (emergency) ditakrifkan sebagai:","o":["Kejadian dahsyat yang membawa kemusnahan besar","Gabungan keadaan yang tidak dijangka yang memerlukan tindakan segera","Kejadian yang berlaku secara kebetulan dan menyebabkan kerosakan","Situasi kompleks yang memerlukan 'normal baharu'"],"a":1,"e":"Definisi: Accident – kejadian tidak dijangka, berlaku secara kebetulan; Emergency – an unforeseen combination of circumstances that calls for immediate action; Disaster – kejadian dahsyat membawa kerosakan besar.","r":[[5,166,"Definition of Emergency – What is Emergency? | • Accident – unexpected event which cause damage @ harm. | Happens by chance | • Emergency – an unforeseen combination of circumstances @ the | resulting state that calls for immediate action | • Disaster – a sudden calamitous event bringing great damage, loss | @ …"]]},{"q":"Kecemasan yang memerlukan bantuan luar seperti bantuan bersama (mutual aid) atau agensi daerah dikategorikan sebagai:","o":["Tahap 3","Tahap 0","Tahap 2","Tahap 1"],"a":2,"e":"Level of emergency: Tahap 1 – dalam keupayaan organisasi; Tahap 2 – memerlukan bantuan luar (mutual aid, daerah, agensi lain), Arahan MKN 20 mungkin terpakai; Tahap 3 – bencana negeri/nasional, Arahan MKN 20 mengambil alih.","r":[[10,168,"Level of Emergency | Depends on severity of the incident and capability of the organization: | • Level 1 | If within the capabilities of the organisation | • Level 2 | If external assistance is required: mutual aid, district or other agencies. MKN Arahan 20 may apply. | • Level 3 | State or National Disaster. MKN …"]]},{"q":"Dalam objektif tindak balas kecemasan 'menyelamatkan nyawa', prinsip yang ditekankan ialah:","o":["Tunggu pihak media tiba","Utamakan menyelamat dan pertolongan cemas tanpa meletakkan penyelamat dalam risiko","Selamatkan harta terlebih dahulu","Penyelamat mesti mengambil risiko apa pun"],"a":1,"e":"Objectives: Save lives – (i) prioritise rescue and first aid, (ii) rescuers must not be put at risk; kemudian save property, asset, reputation dan community.","r":[[12,169,"Objectives of Emergency Response | • Save lifes | i. Prioritise Rescue and First Aid | ii. Rescuers must not be put to risk | • Save property, asset and reputation | • Save Community and the Environment"]]},{"q":"Organisasi yang mengambil kawalan semasa insiden kecemasan dipanggil:","o":["Lembaga Pengarah","Emergency Management Committee","Incident Command Organisation","Jawatankuasa Audit"],"a":2,"e":"Emergency Management: Emergency Co-ordinator; Emergency Management Committee – merancang; Incident Command Organisation – mengambil kawalan semasa insiden.","r":[[14,170,"Emergency Management | Commitment | Emergency Co-ordinator | Emergency Management Committee -To plan for | Incident Command Organisation -Take control during incident -- Functions: | - To coordinate planning | -Mitigation -Preparedness -Response -Recovery | -Command -Operations -Planning -Logistics -Admin/Finance"]]},{"q":"Dalam struktur Incident Command System, fungsi 'Operations' merangkumi:","o":["Kawalan kerosakan (memadam kebakaran), menyelamat, pemindahan dan kawalan trafik","Audit dan semakan dasar","Kewangan dan perolehan","Perhubungan awam sahaja"],"a":0,"e":"Incident Command Organization: Incident Commander → Operations (damage control/fire fighting, rescue, evacuation, traffic control), Planning, Logistics dan Finance.","r":[[17,172,"Incident Command Organization (Based on Incident Command System) | Incident Commander | Operations •Damage Control (Fire Fighting, etc.) •Rescue •Evacuatio const LET = ['A','B','C','D'];
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = id=>'c'+id.toLowerCase().replace('.','-');
const findCh = h=>{for(const m of DATA.modules)for(const c of m.chapters)if(slug(c.id)===h)return [m,c];return [null,null]};

const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const VER = {}; for(const m of DATA.modules) for(const c of m.chapters) VER[c.id]=c.v;
const LV = {}; for(const m of DATA.modules) for(const c of m.chapters) LV[c.id]=c.lv;

/* answers and marks are kept only in this browser, for the participant's own view; nothing is sent anywhere */
const PKEY = 'kuizsho:prog';
/* keep only chapters whose question set is unchanged (old saves carry no version = first set) */
function prune(p){ const o={}; for(const [id,s] of Object.entries(p||{})) if(VER[id] && s && s.first && (s.v||LV[id])===VER[id]) o[id]={v:VER[id],pick:s.pick||{},first:s.first||{},rev:s.rev||{},t:+s.t||0}; return o; }
const readLS = k=>{ const raw=LS.get(k); if(!raw) return {}; try{ return prune(JSON.parse(raw)) }catch(e){ return {} } };
const answered = s=>Object.keys((s&&s.first)||{}).length;
const newer = (a,b)=> (a.t||b.t) ? (a.t||0) > (b.t||0) : answered(a) > answered(b);
function mergeProg(base, extra){ const out = {...base}; for(const [id,s] of Object.entries(extra)) if(!out[id] || newer(s, out[id])) out[id] = s; return out; }
let PROG = {};
if(LS.get(PKEY) !== null) PROG = readLS(PKEY);
else {
  /* first visit after the change: bring over answers saved by earlier versions on this device, then forget the sign-in data */
  let me = null; try{ me = JSON.parse(LS.get('kuizsho:me')||'null') }catch(e){}
  const keys = ['kuizsho'];
  if(me && me.email) keys.push('kuizsho:e:'+String(me.email).toLowerCase());
  const legacy = LS.get('kuizsho:user'); if(legacy) keys.push('kuizsho:p:'+legacy.toLowerCase());
  for(const k of keys) PROG = mergeProg(PROG, readLS(k));
  LS.set(PKEY, JSON.stringify(PROG));
}
for(const k of ['kuizsho:outbox','kuizsho:me','kuizsho:last','kuizsho:lastme']) LS.del(k);   // nothing is uploaded any more
const save = ()=>LS.set(PKEY, JSON.stringify(PROG));

const blank = id=>({v:VER[id],pick:{},first:{},rev:{},t:Date.now()});
const st = id=>(PROG[id] ||= blank(id));
const touch = id=>{ st(id).t = Date.now(); };
function resetChapter(id){ PROG[id] = blank(id); }
function resetAll(){ for(const id of Object.keys(PROG)) PROG[id] = blank(id); save(); }
function resetModule(m){ for(const c of m.chapters) if(PROG[c.id]) PROG[c.id] = blank(c.id); save(); }
/* "danger" panel with an inline confirmation step */
function resetPanel(title, desc, ask, onYes){
  $('#view').insertAdjacentHTML('beforeend', `<section class="danger" id="rall">
    <div><h3>${title}</h3><p>${desc}</p></div>
    <button class="btn" id="rallb">${title}</button>
    <div class="confirm" id="rallc" hidden><p>${ask} Tindakan ini tidak boleh dibatalkan.</p>
      <div class="acts"><button class="yes danger-yes" id="rally">Ya, set semula</button><button class="no" id="rallno">Batal</button></div></div>
  </section>`);
  $('#rallb').onclick=()=>{ $('#rallc').hidden=false; $('#rallb').hidden=true; $('#rallno').focus(); };
  $('#rallno').onclick=()=>{ $('#rallc').hidden=true; $('#rallb').hidden=false; };
  $('#rally').onclick=onYes;
}
/* % correct marks of a chapter (marks out of its 20 questions) and a module's average over the chapters attempted */
const chPct = c=>{ const [ok]=chScore(c); return c.qs.length ? ok/c.qs.length*100 : 0; };
function modAvg(m){ const t=m.chapters.filter(c=>c.qs.length && chScore(c)[1]); return t.length ? {pct:Math.round(t.reduce((a,c)=>a+chPct(c),0)/t.length), n:t.length} : null; }
const chScore = c=>{const s=PROG[c.id];if(!s)return [0,0];let ok=0,ans=0;c.qs.forEach((q,i)=>{if(s.first[i]!==undefined){ans++;if(s.first[i]===q.a)ok++}});return [ok,ans]};

function route(){
  const h = location.hash.slice(1);
  window.scrollTo(0,0);
  if(/^m[1-4]$/.test(h)) return showModule(+h[1]);
  if(h.startsWith('c')){const [m,c]=findCh(h); if(c) return showChapter(m,c);}
  showHome();
}
const go = h=>{ if(location.hash.replace(/^#/,'')===h) route(); else location.hash=h; };

/* where to continue: the first chapter left unfinished, else the chapter after the last one completed */
function nextChapter(){
  const all = DATA.modules.flatMap(m=>m.chapters.filter(c=>c.qs.length).map(c=>[m,c]));
  const started = all.filter(([m,c])=>chScore(c)[1]>0);
  if(!started.length) return null;
  const open = started.find(([m,c])=>chScore(c)[1]<c.qs.length);
  if(open) return open;
  const lastDone = all.indexOf(started[started.length-1]);
  return all.slice(lastDone+1).find(([m,c])=>!chScore(c)[1]) || null;
}

function showHome(){
  $('#bar').innerHTML='';
  $('#hdr').innerHTML=`<div class="eyebrow">Safety and Health Officer · NIOSH Malaysia</div>
    <h1>Kuiz Latihan SHO</h1>
    <p class="sub">Pilih modul, kemudian bab. Setiap bab mengandungi 20 soalan objektif beserta penerangan dan rujukan nombor slaid dalam buku kursus.</p>
    <p class="note">Markah anda untuk tontonan anda sahaja. Jawapan disimpan dalam pelayar ini dan tidak dihantar ke mana-mana.</p>`;
  const cards = DATA.modules.map(m=>{
    const ready=m.chapters.filter(c=>c.qs.length);
    const tq=ready.reduce((a,c)=>a+c.qs.length,0);

    const pct = tq? Math.round(ans/tq*100):0, av = modAvg(m);
    return `<button class="mod" data-m="${m.n}">
      <span class="head"><span class="num">0${m.n}</span>
        <span class="pc${av?'':' none'}"><b>${av? av.pct+'%' : '–'}</b><small>${av? `% betul · purata ${av.n} bab` : 'Belum mula'}</small></span></span>
      <h2>${esc(m.title)}</h2>

      <span class="meta"><span>${m.chapters.length} bab · ${tq} soalan</span><span>${ans}/${tq} dijawab</span></span>
    </button>`}).join('');
  const nx = nextChapter();
  const resume = nx ? `<div class="resume"><div><div class="k">Sambung di sini</div><div class="t">Bab ${esc(nx[1].id)} · ${esc(nx[1].title)}</div><div class="hint">Modul ${nx[0].n} · ${chScore(nx[1])[1]}/${nx[1].qs.length} soalan dijawab</div></div><button class="go2" id="cont">Sambung ›</button></div>` : '';
  $('#view').innerHTML=`${resume}<h2 style="font-size:26px">Pilih modul</h2><div class="modgrid">${cards}</div>
    <div class="howto">
      <div><b>1 · Pilih &amp; sahkan</b>Klik satu pilihan, kemudian tekan <i>Ya, pasti</i>. Jawapan betul disambut dengan bunga api.</div>
      <div><b>2 · Tukar jika belum pasti</b>Tekan <i>Tukar jawapan</i> untuk memilih semula. Selepas disahkan, jawapan dikunci.</div>
      <div><b>3 · Dedah jawapan</b>Lihat jawapan sebenar, penerangan dan rujukan slaid.</div>
    </div>`;
  document.querySelectorAll('.mod').forEach(b=>b.onclick=()=>go('m'+b.dataset.m));
  const any = Object.values(PROG).some(s=>answered(s));
  if(any) resetPanel('Set semula semua jawapan', 'Padam semua jawapan anda dalam keempat-empat modul dan mula semula dari awal.',
    'Padam semua jawapan anda dalam semua modul?', ()=>{ resetAll(); route(); });
  if(nx) $('#cont').onclick=()=>go(slug(nx[1].id));
}

function showModule(n){
  const m = DATA.modules[n-1];
  $('#bar').innerHTML='';
  $('#hdr').innerHTML=`<div class="crumbs"><button data-h="">Utama</button><span>›</span><span>Modul ${n}</span></div>
    <div class="eyebrow">Modul ${n}</div><h1>${esc(m.title)}</h1><p class="sub">${esc(m.en)}</p>`;
  const rows = m.chapters.map(c=>{
    const ready=c.qs.length>0; const [ok,ans]=chScore(c);
    const sc = !ready?'Akan datang': ans? `${ok}/${c.qs.length} · ${Math.round(chPct(c))}%` : `${c.qs.length} soalan`;
    return `<button class="ch" data-h="${slug(c.id)}" ${ready?'':'disabled'}>
      <span class="id">${esc(c.id)}</span>
      <span class="t">${esc(c.title)}<span class="s">${c.total} slaid</span></span>
      <span class="score ${ans===c.qs.length&&ready?'done':''}">${sc}</span></button>`}).join('');
  const av = modAvg(m);
  const avg = av ? `<div class="avg"><span class="k">Purata markah Modul ${n}</span><span class="v">${av.pct}%</span>

  $('#view').innerHTML=`${avg}<h2 style="font-size:26px">Pilih bab</h2><div class="chlist">${rows}</div>`;
  if(m.chapters.some(c=>answered(PROG[c.id]))) resetPanel(`Set semula Modul ${n}`, `Padam semua jawapan anda dalam Modul ${n} sahaja. Modul lain tidak terjejas.`,

  bindCrumbs();
  document.querySelectorAll('.ch').forEach(b=>b.onclick=()=>go(b.dataset.h));
}

        ${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span class="L">${LET[k]}</span><span>${esc(o)}</span><span class="mk"></span></button>`).join('')}
      </div>
      <div class="confirm" hidden role="alertdialog" aria-live="polite"><p></p><div class="acts"><button class="yes">Ya, pasti</button><button class="no">Tukar jawapan</button></div></div>
      <div class="qfoot"><span class="hint"></span><button class="reveal">Dedah jawapan</button></div>
      <div class="ans" hidden></div>
    </article>`).join('') + `<div id="fin"></div>`;
  c.qs.forEach((q,i)=>{
    const card = $('#q'+i);
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(c,i,+b.dataset.k));
    card.querySelector('.yes').onclick=()=>confirmPick(c,i);
    card.querySelector('.no').onclick=()=>{delete PEND[i]; paint(c,i); card.querySelector('.opt[data-k="0"]').focus()};
    card.querySelector('.reveal').onclick=()=>reveal(c,i,true);
    paint(c,i);
  });
  stats(c);
}

/* unconfirmed choice per question (in memory only) */
let PEND = {};
function pick(c,i,k){
  const s=st(c.id); if(s.rev[i] || s.pick[i]!==undefined) return;
  PEND[i]=k; paint(c,i);
  $('#q'+i+' .yes').focus({preventScroll:true});
}
function confirmPick(c,i){
  const s=st(c.id), k=PEND[i]; if(k===undefined || s.rev[i]) return;
  delete PEND[i];
  s.pick[i]=k; if(s.first[i]===undefined) s.first[i]=k; touch(c.id); save();
  paint(c,i); stats(c);
  const card=$('#q'+i);
  if(k===c.qs[i].a){ const r=card.querySelector(`.opt[data-k="${k}"]`).getBoundingClientRect(); celebrate(r.left+r.width/2, r.top+r.height/2); }
  card.querySelector('.reveal').focus({preventScroll:true});
}
function reveal(c,i){ const s=st(c.id); delete PEND[i]; s.rev[i]=1; if(s.first[i]===undefined) s.first[i]=-1; touch(c.id); save(); paint(c,i); stats(c); }

function paint(c,i){
  const q=c.qs[i], s=st(c.id), card=$('#q'+i), p=s.pick[i], rev=!!s.rev[i], locked=p!==undefined, pend=(!rev&&!locked)?PEND[i]:undefined;
  card.querySelectorAll('.opt').forEach(b=>{
    const k=+b.dataset.k; b.className='opt'; b.disabled=rev||locked; const mk=b.querySelector('.mk'); mk.textContent='';
    if(rev){ if(k===q.a){b.classList.add('correct');mk.textContent='Jawapan'} else if(k===p){b.classList.add('wrong');mk.textContent='Pilihan anda'} }
    else if(k===p){ b.classList.add('picked'); mk.textContent='Disahkan'; }
    else if(k===pend) b.classList.add('pending');
  });
  const cf=card.querySelector('.confirm'); cf.hidden = pend===undefined;
  if(pend!==undefined) cf.querySelector('p').textContent=`Anda pasti dengan jawapan ${LET[pend]}?`;
  card.querySelector('.hint').textContent = rev ? (p===q.a?'Anda menjawab dengan betul.':p===undefined?'Anda tidak memilih jawapan.':'Jawapan anda kurang tepat.') : locked ? `Jawapan ${LET[p]} disahkan. Tekan Dedah jawapan untuk melihat penerangan.` : pend!==undefined ? 'Sahkan pilihan anda.' : 'Pilih satu jawapan.';
  card.querySelector('.reveal').hidden = rev;
  const a=card.querySelector('.ans'); a.hidden=!rev;
  if(rev && !a.innerHTML){
    a.innerHTML = `<div class="lab">Jawapan: ${LET[q.a]} · ${esc(q.o[q.a])}</div>
      <p>${esc(q.e)}</p>
      ${q.r.map(([sl,pg,ex])=>`<div class="ref"><div class="where"><span class="k">Slaid ${sl}</span><span>Bab ${esc(c.id)} · ${esc(c.title)}</span><span>Slaid ${sl} daripada ${c.total}</span><span>Halaman ${pg}</span></div>
        <blockquote>${ex.split(' | ').map(esc).join('<br>')}</blockquote></div>`).join('')}`;
  }
}
function stats(c){
  const s=st(c.id); let ans=0,ok=0;
  c.qs.forEach((q,i)=>{ if(s.first[i]!==undefined && s.first[i]!==-1 || s.rev[i]){ans++} if(s.first[i]===q.a)ok++; });
  $('#nAns').textContent=ans; $('#nOk').textContent=ok; $('#nPct').textContent=Math.round(ok/c.qs.length*100)+'%'; $('#pBar').style.width=(ans/c.qs.length*100)+'%';
  const fin=$('#fin');
  if(ans===c.qs.length){
    const [m] = DATA.modules.filter(m=>m.chapters.includes(c)); const idx=m.chapters.indexOf(c); const nx=m.chapters.slice(idx+1).find(x=>x.qs.length);
    fin.innerHTML=`<div class="done-card"><div><div class="eyebrow">Bab selesai</div><h2>Markah ${ok}/${c.qs.length} · ${Math.round(ok/c.qs.length*100)}%</h2><div style="opacity:.9;font-size:14px">1 markah bagi setiap jawapan betul yang disahkan</div></div>
      ${nx?`<button class="btn" id="nxt">Bab seterusnya: ${esc(nx.id)} ›</button>`:`<button class="btn" id="nxt">Kembali ke Modul ${m.n}</button>`}</div>`;
    $('#nxt').onclick=()=>go(nx?slug(nx.id):'m'+m.n);
  } else fin.innerHTML='';
}

/* ---- fireworks ---- */
const fx=$('#fx'), ctx=fx.getContext('2d'); let parts=[], rockets=[], raf=0, W=0, H=0, DPR=1;
const COLS=['#f5c400','#2fae74','#ff5a36','#3fa9f5','#ffffff','#ff4fa3','#9b6bff'];
function size(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;fx.width=W*DPR;fx.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size); size();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x,y,n){const col=COLS[Math.random()*COLS.length|0], col2=COLS[Math.random()*COLS.length|0];
  for(let j=0;j<n;j++){const a=Math.random()*Math.PI*2, sp=2+Math.random()*(reduce?3:6.5);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.008+Math.random()*.012,c:Math.random()<.7?col:col2,r:1.6+Math.random()*1.8})}}
function celebrate(ox,oy){
  burst(ox,oy,reduce?40:90);
  if(!reduce){
    const n=7; for(let k=0;k<n;k++){ const tx=W*(.1+.8*Math.random()), ty=H*(.12+.4*Math.random());
      rockets.push({x:tx+(Math.random()-.5)*60,y:H+10,tx,ty,delay:k*140+Math.random()*120,t0:performance.now()}); }
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(now){
  ctx.globalCompositeOperation='destination-out'; ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  rockets=rockets.filter(r=>{ if(now-r.t0<r.delay) return true;
    r.y-= (r.y-r.ty)*.09+3; r.x+=(r.tx-r.x)*.06;
    ctx.fillStyle='#fff3c4'; ctx.beginPath(); ctx.arc(r.x,r.y,2.2,0,7); ctx.fill();
    if(r.y-r.ty<6){burst(r.x,r.y,80); return false} return true; });
  parts=parts.filter(p=>{ p.vx*=.985; p.vy=p.vy*.985+.06; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
    if(p.life<=0) return false; ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); return true; });
  ctx.globalAlpha=1;
  if(parts.length||rockets.length) raf=requestAnimationFrame(tick); else {ctx.clearRect(0,0,W,H); raf=0}
}

addEventListener('hashchange',route); route();
</script>
