<style>
/* Layout: safety-signage language — green "safe condition" bands, hazard-yellow accents, a single reading column of question cards */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#e9eee8; --ink:#16201a; --muted:#56635a; --line:#d3dbd2;
  --green:#00794a; --green-ink:#ffffff; --green-soft:#dcefe4; --yellow:#f5c400; --yellow-ink:#1c1a10;
  --red:#b3261e; --red-soft:#f8e1de; --focus:#0b5cad;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18201b; --surface-2:#202a24; --ink:#e7eee9; --muted:#9db0a3; --line:#2c3a31;
  --green:#2fae74; --green-ink:#06130c; --green-soft:#173426; --yellow:#f5c400; --yellow-ink:#1c1a10;
  --red:#ff8a80; --red-soft:#3a1b19; --focus:#7db7ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201b; --surface-2:#202a24; --ink:#e7eee9; --muted:#9db0a3; --line:#2c3a31;
  --green:#2fae74; --green-ink:#06130c; --green-soft:#173426; --yellow:#f5c400; --yellow-ink:#1c1a10;
  --red:#ff8a80; --red-soft:#3a1b19; --focus:#7db7ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hazard{height:10px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px)}
header.top{background:var(--green);color:var(--green-ink)}
header.top .wrap{padding-block:22px 20px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;opacity:.9}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.08}
h1{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:.005em}
.sub{margin:0;max-width:60ch;opacity:.92}
.crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:15px}
.crumbs button{background:none;border:0;padding:2px 0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
main .wrap{padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
/* module cards */
.modgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:600px){.modgrid{grid-template-columns:1fr}}
.mod{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 18px 16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.mod:hover{transform:translateY(-2px);border-color:var(--green)}
.mod .num{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.9;color:var(--green)}
.mod h2{font-size:24px;font-weight:700}
.mod .en{color:var(--muted);font-size:14px}
.mod .meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;font-variant-numeric:tabular-nums}
.mod .bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.mod .bar i{display:block;height:100%;background:var(--green)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:14px;color:var(--muted)}
.howto div{border-left:4px solid var(--yellow);padding:2px 0 2px 10px}
.howto b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
@media (max-width:600px){.howto{grid-template-columns:1fr}}
/* chapter list */
.chlist{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer}
.ch:hover:not(:disabled){border-color:var(--green)}
.ch:disabled{cursor:not-allowed;opacity:.55}
.ch .id{font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--surface-2);padding:4px 8px;border-radius:4px;min-width:62px;text-align:center}
.ch .t{font-weight:600;line-height:1.3}
.ch .s{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.ch .score{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ch .score.done{color:var(--green);font-weight:600}
/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.qbar .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.qbar .stat{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.qbar .stat b{color:var(--ink)}
.prog{flex:1 1 160px;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:120px}
.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:5px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.q .qn{display:flex;gap:12px;align-items:flex-start}
.q .badge{flex:none;font-family:var(--f-display);font-weight:800;font-size:20px;width:40px;height:40px;display:grid;place-items:center;background:var(--yellow);color:var(--yellow-ink);border-radius:4px}
.q .qt{font-weight:600;font-size:17px;line-height:1.4;padding-top:6px;min-width:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .L{font-family:var(--f-display);font-weight:700;font-size:17px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--surface-2)}
.opt .mk{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.opt.picked{border-color:var(--ink);background:var(--surface-2)}
.opt.picked .L{background:var(--ink);color:var(--surface)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .L{background:var(--green);color:var(--green-ink)}
.opt.correct .mk{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .L{background:var(--red);color:var(--surface)}
.opt.wrong .mk{color:var(--red)}
.opt:disabled{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hint{font-size:14px;color:var(--muted)}
.reveal{background:var(--ink);color:var(--surface);border:0;padding:9px 16px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.reveal:hover{background:var(--green);color:var(--green-ink)}
.ans{border-top:2px solid var(--green);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.ans .lab{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--green)}
.ans p{margin:0;max-width:68ch}
.ref{background:var(--surface-2);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ref .where{font-family:var(--f-mono);font-size:13px;line-height:1.5;display:flex;flex-wrap:wrap;gap:4px 8px}
.ref .where span{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 7px;white-space:nowrap}
.ref .where span.k{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);font-weight:600}
.ref blockquote{margin:0;font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;overflow-wrap:anywhere}
.done-card{background:var(--green);color:var(--green-ink);border-radius:6px;padding:20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.done-card h2{font-size:28px}
.done-card .btn{background:var(--green-ink);color:var(--green);border-color:transparent}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:20px;color:var(--muted)}
footer{color:var(--muted);font-size:13px;text-align:center;padding-block:0 40px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>

<script>
const DATA = {"modules":[{"n":1,"title":"Akta OSH 1994, Peraturan & Perundangan Berkaitan","en":"OSH Act 1994, Its Regulations & Related Legislation","chapters":[{"id":"1.01","title":"OSH Introduction and Terminology","total":95,"qs":[{"q":"Seksyen manakah dalam OSHA 1994 yang mewajibkan majikan menggaji Pegawai Keselamatan dan Kesihatan (SHO) sepenuh masa?","o":["Seksyen 24","Seksyen 30","Seksyen 29","Seksyen 15"],"a":2,"e":"Slaid menyatakan bahawa Seksyen 29 OSHA mewajibkan majikan menggaji SHO sepenuh masa, manakala Perintah SHO menyenaraikan kategori industri yang terlibat.","r":[[6,7,"REQUIREMENT FOR SHO | • Section 29 OSHA requires Employers to employ full time SHO. | • SHO Order lists category of industries required to employ SHO as stated below: | • Building operation & work of engineering construction where projects cost RM 20M or more; | • Heavy industries such as ship building, gas …"]]},{"q":"Bagi kerja bangunan dan kejuruteraan pembinaan, SHO diwajibkan apabila kos projek mencapai berapa?","o":["RM5 juta atau lebih","RM10 juta atau lebih","RM50 juta atau lebih","RM20 juta atau lebih"],"a":3,"e":"Mengikut Perintah SHO, operasi bangunan dan kerja kejuruteraan pembinaan yang kos projeknya RM20 juta atau lebih wajib menggaji SHO.","r":[[6,7,"REQUIREMENT FOR SHO | • Section 29 OSHA requires Employers to employ full time SHO. | • SHO Order lists category of industries required to employ SHO as stated below: | • Building operation & work of engineering construction where projects cost RM 20M or more; | • Heavy industries such as ship building, gas …"]]},{"q":"Industri pembuatan 'lain' (bukan industri berat) diwajibkan menggaji SHO apabila bilangan pekerjanya mencapai:","o":["100 orang atau lebih","500 orang atau lebih","50 orang atau lebih","250 orang atau lebih"],"a":1,"e":"Industri berat memerlukan SHO pada 100 pekerja atau lebih, tetapi industri pembuatan lain hanya apabila pekerja mencapai 500 orang atau lebih.","r":[[6,7,"REQUIREMENT FOR SHO | • Section 29 OSHA requires Employers to employ full time SHO. | • SHO Order lists category of industries required to employ SHO as stated below: | • Building operation & work of engineering construction where projects cost RM 20M or more; | • Heavy industries such as ship building, gas …"]]},{"q":"Siapakah yang dianggap sebagai 'bapa perubatan pekerjaan' (father of occupational medicine)?","o":["Ellenborg","Ramazzini","Agricola","Heinrich"],"a":1,"e":"Pada tahun 1713, Ramazzini, yang dianggap bapa perubatan pekerjaan, mencadangkan agar doktor bertanya pesakit tentang pekerjaan mereka semasa diagnosis.","r":[[17,13,"Early Recognition Of Occupational Diseases | • In 1713 Ramazzini, who is regarded as the father of occupational medicine, suggested that in diagnosis doctors should ask patients about their occupations."]]},{"q":"Undang-undang keselamatan industri berkesan yang pertama ialah:","o":["Health and Safety at Work Act 1974","Machinery Ordinance 1953","Selangor Boiler Enactment 1892","English Factory Act 1833"],"a":3,"e":"English Factory Act 1833 merupakan undang-undang keselamatan industri berkesan yang pertama, walaupun ia lebih menumpukan pampasan berbanding mengawal punca kemalangan.","r":[[18,13,"Emergence Of Industrial Safety Legislation | • In 1833 English Factory Act was the first effective industrial safety law. | • It provide compensation for accidents rather than to control their causes."]]},{"q":"Siapakah yang membangunkan Teori Domino pada tahun 1930-an?","o":["Herbert W. Heinrich","Frank Bird","Lord Robens","Ramazzini"],"a":0,"e":"Herbert W. Heinrich (1930-an) membangunkan Teori Domino dan mempromosikan kawalan tingkah laku pekerja.","r":[[20,14,"Emergence Of Safety Management | • Role of Herbert W. Heinrich (1930’s), | • Developed Domino Theory and promoted control of workers behaviour. | • Problem: | • Focused on worker behaviour and not management | • Caused people to think that safety is about policing worker"]]},{"q":"Teori Kawalan Kerugian (Loss Control Theory) yang menyatakan punca asas kemalangan ialah kurangnya kawalan pengurusan dibangunkan oleh:","o":["Lord Robens (1972)","Agricola (1556)","Herbert W. Heinrich (1930)","Frank Bird (1970)"],"a":3,"e":"Frank Bird (1970) membangunkan Loss Control Theory yang mencadangkan punca asas kemalangan ialah kurang kawalan dan keputusan pengurusan yang lemah.","r":[[21,15,"Emergence Of Safety Management | • Frank Bird (1970) developed Loss Control Theory. | • Suggested that underlying cause of accidents are lack of management controls and poor management decisions. | • Problem: | • Not so popular: blames management (responsibility and control)."]]},{"q":"Apakah kelemahan utama pendekatan Behavioural Based Safety (BBS) yang diperkenalkan pada 1980-an?","o":["Ia menyalahkan pengurusan sepenuhnya","Ia memerlukan undang-undang preskriptif","Ia hanya sesuai untuk industri petroleum","Ia menumpukan pekerja, bukan bahaya atau pengurusan"],"a":3,"e":"Slaid menyatakan masalah BBS ialah fokusnya kepada pekerja dan bukan kepada bahaya atau pengurusan, serta sistem ganjaran dan hukuman mempunyai kelemahan.","r":[[22,15,"Emergence Of Safety Management | • In 1980’s, Behavioural Based Safety (BBS) was introduced; | • Based on Heinrich’s findings. | • Work by recognizing safe work habits and offering rewards and punishment. | • Problem: | • Focuses on workers and not on hazard or management | • Reward and punishment system have flaws"]]},{"q":"Laporan Lord Robens mengesyorkan pendekatan perundangan berbentuk:","o":["Berasaskan insurans","Penguatkuasaan oleh pemeriksa sahaja","Preskriptif sepenuhnya","Pengawalseliaan kendiri (self-regulation)"],"a":3,"e":"Lord Robens mengesyorkan pengawalseliaan kendiri, yang menghasilkan Health and Safety at Work Act di UK pada 1974.","r":[[25,17,"A Self-Regulation Legislation | • Lord Robens recommended | • Self regulation | • Report resulted in the Health and Safety of Workers At Work Act in the UK in 1974"]]},{"q":"Kemalangan manakah yang mendorong penggubalan OSHA 1994 di Malaysia?","o":["Piper Alpha (1988)","Kemalangan Bright Sparkler, Sungai Buloh (1992)","Tragedi Bhopal (1984)","Letupan Flixborough (1974)"],"a":1,"e":"Perundangan gaya Robens digubal di Malaysia pada 1994 selepas kemalangan Bright Sparkler di Sungai Buloh pada 1992.","r":[[26,17,"A Self-Regulation Legislation | • Similar legislation was enacted in Australia in 1984 | • Enacted in Malaysia in 1994 after the 1992 Bright Sparkler accident in Sungai Buloh"]]},{"q":"Kemalangan Flixborough (1974) dikaitkan dengan peraturan manakah di Malaysia?","o":["Peraturan NADOOPOD 2004","Peraturan USECHH 2000","Peraturan Bising 2019","Peraturan CIMAH 1996"],"a":3,"e":"Jadual slaid mengaitkan Flixborough (1974) dengan Peraturan CIMAH 1996, Bhopal dengan 'Responsible Care' dan Piper Alpha dengan penilaian risiko/sistem pengurusan.","r":[[28,18,"A Self-Regulation Legislation | Legislation follow major accidents and reinforce need for management system | ACCIDENT REGULATION/PROGRAMME Flixborough (1974) CIMAH regulations 1996 | Bhopal (1984) “Responsible Care” / Process safety | Piper Alpha (1988) Risk Assessment / Management system"]]},{"q":"Piawaian ISO 45001:2018 menggantikan piawaian yang mana?","o":["ISO 9001","MS 1722","ISO 14001","OHSAS 18001"],"a":3,"e":"ISO 45001:2018 ialah piawaian global oleh ISO yang menggantikan OHSAS 18001 dan berasaskan High-Level Structure (HLS).","r":[[31,20,"Quality Management Approach to Occupational Safety and Health Management | • International and auditable OHSAS 18001 OSH Management System published in 1999 | • ILO approved an OSH management system for governments to adopt during 2000 | • ISO 45001:2018 – Occupational Health and Safety Management Systems | • …"]]},{"q":"Mengikut terminologi OSH, 'Near Miss' bermaksud:","o":["Kemalangan yang menyebabkan cuti sakit","Kecederaan yang memerlukan rawatan perubatan","Kejadian berbahaya yang wajib dilaporkan","Insiden yang tidak menyebabkan kecederaan tetapi berpotensi berbuat demikian"],"a":3,"e":"Near Miss ditakrifkan sebagai insiden yang tidak menyebabkan kecederaan tetapi mempunyai potensi untuk menyebabkannya.","r":[[50,29,"OSH Terminology | N | • Near Miss: An incident that did not result in injury but had the potential to do so. | • Noise-Induced Hearing Loss (NIHL): Occupational disease caused by prolonged exposure to high noise levels."]]},{"q":"LTIFR mengukur bilangan Lost Time Injury bagi setiap:","o":["Tahun kalendar","1,000 pekerja","100,000 jam kerja","Sejuta jam kerja"],"a":3,"e":"LTIFR (Lost Time Injury Frequency Rate) ialah penunjuk prestasi keselamatan yang mengukur bilangan LTI bagi setiap sejuta jam kerja.","r":[[48,28,"OSH Terminology | L | • Lost Time Injury (LTI): Work-related injury resulting in absence from work. | • LTIFR (Lost Time Injury Frequency Rate): A safety performance indicator measuring number of LTIs per million work hours. | • Lockout/Tagout (LOTO): Procedure to ensure machinery is properly shut off and cannot …"]]},{"q":"Giliran kerja (job rotation) dikategorikan sebagai jenis kawalan apa?","o":["Kawalan pentadbiran","Penghapusan","Peralatan pelindung diri","Kawalan kejuruteraan"],"a":0,"e":"Job Rotation ialah kawalan pentadbiran yang mengurangkan pendedahan kepada bahaya dengan menggilirkan pekerja antara tugas.","r":[[46,27,"OSH Terminology | J | • Job Safety Analysis (JSA): A method to break down tasks and identify hazards and control measures. | • Job Rotation: An administrative control that reduces exposure to hazards by rotating workers between tasks."]]},{"q":"Ketidakpatuhan kepada Undang-undang Statutori (Statutory Law) dianggap sebagai:","o":["Jenayah, dengan hukuman denda dan penjara","Isu disiplin dalaman syarikat","Pelanggaran etika sahaja","Kesalahan sivil dengan pampasan wang sahaja"],"a":0,"e":"Undang-undang statutori digubal oleh kerajaan; ketidakpatuhan ialah jenayah dan hukumannya denda serta penjara, didakwa oleh pegawai kerajaan.","r":[[63,36,"Statutory Law | • Comprises of Acts, Regulations, Order, Rule, Ordinance and Enactment : | • Formulated by the Government | • Non-compliance is a crime | • Punishment - fines and imprisonment | • Prosecution by Government Officer (such as Deputy Public Prosecutor in Criminal Court)(for existing application act, …"]]},{"q":"Dalam Common Law, jika pihak bertanggungjawab didapati bersalah, bentuk ganti ruginya ialah:","o":["Denda kepada kerajaan","Notis larangan","Pampasan dalam bentuk wang sahaja","Hukuman penjara"],"a":2,"e":"Common Law hasil keputusan hakim di mahkamah sivil; jika disabitkan, pampasan diberi dalam bentuk wang sahaja.","r":[[67,38,"Common Law | • Result of decision made by Judge and Civil Court | • Allows the injured party to make a claim on the party that is responsible for the injury | • The application for trail is done by a Lawyer appointed by the injured party | • If convicted – compensation in the form of money only"]]},{"q":"Kes Smith lwn Crossley Bros Ltd menetapkan bahawa majikan TIDAK bertanggungjawab apabila:","o":["Pekerja ialah kontraktor","Pekerja bertindak atas kehendak sendiri seperti bergurau senda (horseplay)","Kemalangan berlaku di luar waktu pejabat","Majikan menggaji orang kompeten"],"a":1,"e":"Kes Smith lwn Crossley Bros: majikan tidak bertanggungjawab jika pekerja bertindak sendiri seperti horseplay, contohnya dua perantis menyuntik udara mampat kepada orang ketiga sebagai gurauan.","r":[[72,40,"Employer Liability In The Duty Of Care | “ The employer is not responsible if the worker acts on | his own accord such as horseplay while at work.” | Smith Versus Crossley Bros Ltd | Example: Two apprentices injecting compressed air to | a third party as a joke"]]},{"q":"Dalam tuntutan kecuaian (negligence), beban pembuktian terletak pada:","o":["Hakim","Plaintif (pihak yang tercedera)","Jabatan Keselamatan dan Kesihatan Pekerjaan","Majikan"],"a":1,"e":"Elemen kecuaian ialah wujud duty of care, pelanggaran tugas itu dan kerosakan/kecederaan akibatnya; beban pembuktian adalah pada plaintif.","r":[[73,41,"Elements That Determine Negligence | • There is the duty of care of one party onto another party • There is a violation of that duty • The violation of duty resulted in damage/injury | The Burden of Proof is on the plaintiff (injured party)"]]},{"q":"Apakah kelemahan Machinery Ordinance 1953 yang diperbaiki oleh Akta Kilang dan Jentera 1967?","o":["Skop tidak meliputi tempat kerja tanpa mesin dan kurang peruntukan kesihatan","Tiada denda dikenakan","Hanya terpakai di Selangor","Tiada peruntukan dandang"],"a":0,"e":"FMA 1967 memperbaiki kelemahan Machinery Ordinance 1953 iaitu skopnya tidak meliputi tempat kerja tanpa mesin dan kekurangan peruntukan berkaitan kesihatan.","r":[[78,43,"Industrial Safety and Health | 1968 - 1994 FACTORIES AND MACHINERY ACT 1967 •Amend the provisions related to safety of machinery | •Improvises on the weaknesses of the Machinery Ordinance 1953 where: | – Scope does not cover workplaces that do not use machines – Lack of health related provisions"]]}]},{"id":"1.02","title":"Policy – Organisation & Arrangements","total":23,"qs":[{"q":"Apakah yang dimaksudkan dengan Pernyataan Dasar OSH (OSH policy statement)?","o":["Laporan tahunan kemalangan kepada JKKP","Senarai semua bahaya di tempat kerja","Dokumen yang menetapkan cara organisasi akan mengurus keselamatan dan kesihatan di tempat kerja","Prosedur kecemasan kebakaran"],"a":2,"e":"Slaid mentakrifkan pernyataan dasar OSH sebagai dokumen yang menetapkan bagaimana organisasi akan mengurus keselamatan dan kesihatan di tempat kerja.","r":[[5,56,"What is an OSH Policy Statement? | • The OSH policy statement is a document that sets out how the organisation will manage safety and health in the workplace."]]},{"q":"Pernyataan dasar OSH menunjukkan komitmen daripada pihak mana?","o":["Kesatuan sekerja","Jawatankuasa keselamatan sahaja","Pegawai JKKP","Pengurusan atasan"],"a":3,"e":"Antara kepentingan dasar OSH ialah ia merupakan pernyataan komitmen daripada pengurusan atasan dan menunjukkan pengurusan mengambil berat.","r":[[6,56,"Why are OSH Policy Statement Important? | • A statement of commitment from top management | • Shows employees that management cares | • A guide for all levels of employees to base their actions and decisions | • The starting point for planning and organising OSH programmes | • Required by law"]]},{"q":"Yang manakah BUKAN sebab kepentingan pernyataan dasar OSH?","o":["Menjadi titik mula perancangan program OSH","Dikehendaki oleh undang-undang","Panduan tindakan dan keputusan semua peringkat pekerja","Menggantikan keperluan latihan pekerja"],"a":3,"e":"Slaid menyenaraikan komitmen pengurusan, panduan tindakan, titik mula perancangan program OSH dan keperluan undang-undang. Ia tidak menggantikan latihan.","r":[[6,56,"Why are OSH Policy Statement Important? | • A statement of commitment from top management | • Shows employees that management cares | • A guide for all levels of employees to base their actions and decisions | • The starting point for planning and organising OSH programmes | • Required by law"]]},{"q":"Dua elemen pelaksanaan dasar di bawah OSHA 1994 ialah 'Organisation' dan 'Arrangements'. 'Arrangements' merujuk kepada:","o":["Pelan, sumber, prosedur dan sistem kerja","Tanggungjawab individu","Struktur gaji pekerja","Visi dan misi syarikat"],"a":0,"e":"Keperluan statutori menyatakan Organisation merujuk tanggungjawab, manakala Arrangements merujuk pelan, sumber, prosedur dan sistem kerja.","r":[[7,57,"Statutory requirement of OSH policy – OSHA 1994 | • To have a written OSH policy statement | • Employees must be aware of the requirements of the policy | • OSH Policy is to be implemented | • Organisation (responsibilities) | • Arrangements (plans, resources, procedures, system of work, etc.) • To revise the …"]]},{"q":"Langkah PERTAMA dalam empat langkah pelaksanaan dasar OSH ialah:","o":["Membuat susunan (arrangements)","Merangka dan menulis dasar","Memantau dan menyemak dasar","Menyampaikan dasar"],"a":1,"e":"Empat langkah: (1) merangka dan menulis dasar, (2) melaksana dengan membuat susunan, (3) menyampaikan dasar, (4) memantau dan menyemak.","r":[[8,57,"4 Steps in Implementing OSH Policy | 1. Formulate and write the policy | • Include statements of vision and goals, the | • Objectives and target related to risk | 2. Implement policy by making arrangements | • Organisation, OSH programmes, appointments"]]},{"q":"Langkah ketiga dalam pelaksanaan dasar OSH ialah:","o":["Menyemak semula dasar","Melantik SHO","Menyampaikan (communicate) dasar","Merangka dasar"],"a":2,"e":"Langkah ke-3 ialah menyampaikan dasar: mengumumkan dan mempamerkan pernyataan serta menyampaikan tanggungjawab dan program OSH.","r":[[9,58,"4 Steps in Implementing OSH Policy | 3. Communicate the policy | • Announce and display statement, communicate responsibilities and OSH programmes | 4. Monitor and revise as necessary"]]},{"q":"Dalam akronim SMART untuk dasar OSH, huruf 'T' bermaksud:","o":["Timely – mengikut tarikh akhir","Transparent – telus","Targeted – menyasarkan pekerja","Tractable – boleh dianalisis dan dijejak dari semasa ke semasa"],"a":3,"e":"SMART dalam slaid: Simple, Measurable, Achievable, Reasonable, Tractable (boleh dianalisis dan dijejak sepanjang tempoh).","r":[[10,58,"Formulating the OSH Policy | • The policy has to be read, understood and acted upon by employees, supervisors and managers. Therefore it must be SMART: | Simple (Use layman’s language, to the point) | Measurable (Performance can be monitored) | Achievable (Realistic and based on own needs) | Reasonable (Always aim …"]]},{"q":"Dalam SMART, 'Simple' bermaksud dasar perlu:","o":["Hanya satu ayat","Tidak menyebut tanggungjawab","Ditulis dalam bahasa Inggeris","Menggunakan bahasa mudah difahami dan tepat"],"a":3,"e":"Simple bermaksud menggunakan bahasa orang biasa (layman's language) dan terus kepada maksud supaya mudah dibaca dan difahami.","r":[[10,58,"Formulating the OSH Policy | • The policy has to be read, understood and acted upon by employees, supervisors and managers. Therefore it must be SMART: | Simple (Use layman’s language, to the point) | Measurable (Performance can be monitored) | Achievable (Realistic and based on own needs) | Reasonable (Always aim …"]]},{"q":"Seksyen OSHA 1994 yang dirujuk semasa merangka dasar OSH ialah:","o":["Seksyen 15","Seksyen 30","Seksyen 24","Seksyen 16"],"a":3,"e":"Slaid menyatakan pernyataan dasar perlu mengambil kira keperluan OSHA 1994 (Seksyen 16), iaitu kewajipan menyediakan dasar bertulis.","r":[[11,59,"Formulating the OSH Policy | • Make statements that take into account: | • Vision and goals (“zero accident”) | • Legislation (compliance, competency of employees) | • Clients (compliance to clients’ safety procedures) | • Associations (“Responsible Care”) | • Requirements Of OSHA1994 (Section 16)"]]},{"q":"Contoh pernyataan 'visi dan matlamat' dalam dasar OSH yang diberikan dalam slaid ialah:","o":["\"Zero accident\"","\"Responsible Care\"","Pematuhan prosedur pelanggan","Kompetensi pekerja"],"a":0,"e":"Slaid memberi contoh visi dan matlamat sebagai 'zero accident'; Responsible Care pula contoh berkaitan persatuan.","r":[[11,59,"Formulating the OSH Policy | • Make statements that take into account: | • Vision and goals (“zero accident”) | • Legislation (compliance, competency of employees) | • Clients (compliance to clients’ safety procedures) | • Associations (“Responsible Care”) | • Requirements Of OSHA1994 (Section 16)"]]},{"q":"Maklumat tentang bahaya untuk dasar OSH boleh diperoleh daripada sumber berikut KECUALI:","o":["Cadangan Jawatankuasa Keselamatan","Pengenalpastian bahaya dan penilaian risiko","Iklan produk pembekal","Amalan baik"],"a":2,"e":"Slaid menyenaraikan HIRARC, perundingan pekerja (terutama cadangan Jawatankuasa), amalan baik dan sifat bahaya industri.","r":[[12,59,"Formulating the OSH Policy | • Address nature of hazards in the workplace | • Information from: | • Hazard identification and Risk assessment | • Consultation with workers especially recommendations from the Safety Committee | • Good practice | • General nature of hazards in industry | • E.g. changing nature of …"]]},{"q":"Menurut contoh dalam slaid, siapakah yang bertanggungjawab menyiasat kemalangan?","o":["Pelanggan","Penyelia (supervisors)","Pembekal","Pekerja am"],"a":1,"e":"Contoh tanggungjawab: pengurus/penyelia menguatkuasa peraturan, pekerja melaporkan near-miss, penyelia menyiasat kemalangan, pengurus menyelia kontraktor.","r":[[13,60,"Formulating the OSH Policy | • Policy statement should clearly state role and responsibilities of employees | • For example: | • Managers and supervisors at all levels to enforce OSH rules in their respective area or function | • Employee to report near-misses | • Supervisors to investigate accidents | • Managers …"]]},{"q":"Menurut slaid, tanggungjawab pekerja yang dinyatakan dalam dasar ialah:","o":["Menyelia kontraktor","Menyiasat kemalangan","Menyemak dasar setiap tahun","Melaporkan near-miss"],"a":3,"e":"Dalam contoh tanggungjawab, pekerja dikehendaki melaporkan kejadian near-miss.","r":[[13,60,"Formulating the OSH Policy | • Policy statement should clearly state role and responsibilities of employees | • For example: | • Managers and supervisors at all levels to enforce OSH rules in their respective area or function | • Employee to report near-misses | • Supervisors to investigate accidents | • Managers …"]]},{"q":"Pelaksanaan dasar OSH bermula dengan:","o":["Audit luar","Pelantikan peguam","Pembelian PPE","Matlamat, objektif dan risiko yang dikenal pasti dalam dasar"],"a":3,"e":"Pelaksanaan dimulakan dengan matlamat, objektif dan risiko yang dinyatakan dalam dasar, diikuti penubuhan program OSH serta penyediaan sumber.","r":[[14,60,"Implementing the OSH Policy | 1. Begin with goals, objectives, identified risks as stated in the policy | 2. Establish OSH programme(s). | Example of programme | • Maintenance of safety critical equipment and plant, safe working environment, means of access to and egress and requirement of Job Safety Analysis 3. …"]]},{"q":"Yang manakah contoh rekod yang digunakan untuk memantau dasar OSH?","o":["Rekod pembelian bahan mentah","Rekod jualan bulanan","Rekod kemalangan dan masalah kesihatan","Rekod cuti tahunan"],"a":2,"e":"Pemantauan melalui penyimpanan rekod termasuk rekod kemalangan/kesihatan, pematuhan perundangan, pelantikan dan sasaran yang dicapai.","r":[[15,61,"Monitoring the OSH Policy | • Record Keeping | • Accident/ill health record | • Compliance with legislation | • Appointments (Safety and Health Officer, Safety Committee established, etc.) • Targets set and achieved | • Compliance with organisation / arrangements (systems of work etc.)"]]},{"q":"Kaedah pemantauan dasar OSH TIDAK termasuk:","o":["Pemeriksaan tempat kerja","Pengauditan","Pengiklanan","Penyiasatan insiden/kemalangan"],"a":2,"e":"Slaid menyenaraikan pemantauan persekitaran, pemeriksaan tempat kerja, audit dan penyiasatan insiden/kemalangan.","r":[[16,61,"Monitoring the OSH Policy | • Monitoring and Surveillance of workplace environments • Workplace inspections • Auditing • Incident / accident investigation"]]},{"q":"Menurut slaid, semakan semula dasar OSH dilakukan oleh:","o":["Jabatan Bomba","Jawatankuasa Keselamatan","PERKESO","Pembekal"],"a":1,"e":"Slaid 'Reviewing and Revising the OSH Policy' dinyatakan dilakukan oleh Jawatankuasa Keselamatan (By Safety Committee).","r":[[17,62,"Reviewing and Revising the OSH Policy | (By Safety Committee) | • Performance statistics | • Review policy | • Experience | • Operational or organisational changes | • Alterations of plant or processes | • New legislation | • New hazards identified | • Change of business"]]},{"q":"Antara pencetus semakan semula dasar OSH ialah:","o":["Pertukaran logo syarikat","Kenaikan harga barang","Perundangan baharu dan bahaya baharu dikenal pasti","Cuti umum"],"a":2,"e":"Pencetus semakan termasuk statistik prestasi, perubahan operasi/organisasi, perubahan loji/proses, perundangan baharu, bahaya baharu dan perubahan perniagaan.","r":[[17,62,"Reviewing and Revising the OSH Policy | (By Safety Committee) | • Performance statistics | • Review policy | • Experience | • Operational or organisational changes | • Alterations of plant or processes | • New legislation | • New hazards identified | • Change of business"]]},{"q":"Dalam Latihan 1, syarikat ABC Chemicals mempunyai berapa ramai pekerja?","o":["500 orang","230 orang","100 orang","40 orang"],"a":1,"e":"Maklumat latihan: ABC Chemicals (M) Sdn. Bhd., pembekal bahan kimia, 230 pekerja dengan bahaya kimia, kebakaran dan angkat beban manual.","r":[[18,62,"Exercise 1 | • Draft OSH policy based on the following information: | • Name of Company : ABC Chemicals (M) Sdn. Bhd. | • Nature of Business : Supply of chemicals | • No. of employees : 230 (Note: All Malaysian) | • Significant Hazards : | • In contact with chemical hazardous to health | • Fire | • Manual lifting …"]]},{"q":"Menurut ringkasan, dasar OSH perlu ditulis secara ringkas supaya:","o":["Kurang kos percetakan","Tidak boleh diaudit","Mudah disampaikan dan difahami","Hanya difahami pengurusan"],"a":2,"e":"Ringkasan menyatakan dasar perlu ditulis dengan mudah supaya ia mudah disampaikan dan difahami.","r":[[20,63,"Summary | 1. A written OSH Policy is required by law | 2. Formulate the policy to reflect OSH arrangements and organisational goals | 3. Write a simple policy so that it is easily communicated and understood"]]}]},{"id":"1.03","title":"Occupational Safety and Health Act 1994","total":97,"qs":[{"q":"Berapakah bilangan Bahagian (Part) dalam OSHA 1994 menurut hasil pembelajaran?","o":["10 Bahagian","20 Bahagian","15 Bahagian","12 Bahagian"],"a":2,"e":"Hasil pembelajaran menyatakan peserta perlu menyenaraikan 15 Bahagian OSHA 1994.","r":[[2,67,"Learning Outcomes | At the end of the session, participant will be able to: | • List down the 15 Parts of OSHA 1994 • State the main objectives of OSHA 1994 | • State the philosophy and guiding principle of OSHA 1994 | • Explain the duties of principal, employer, designer, manufacturer, supplier and employee; and | …"]]},{"q":"Falsafah OSHA 1994 menyatakan tanggungjawab memastikan keselamatan dan kesihatan terletak pada:","o":["Syarikat insurans","Pegawai JKKP sahaja","Kerajaan sahaja","Mereka yang mewujudkan risiko dan mereka yang bekerja dengan risiko"],"a":3,"e":"Falsafah dan prinsip panduan: tanggungjawab terletak pada mereka yang mewujudkan risiko dan yang bekerja dengan risiko, berasaskan kerjasama, pengawalseliaan kendiri dan perundingan.","r":[[13,73,"Philosophy and Guiding Principles | Responsibility to ensure safety and health at the workplace is on those who create the risk | and those who work with the risk | Cooperation | Self- regulation Consultation | and worker participation"]]},{"q":"Peruntukan pindaan OSHA 1994 (Pindaan 2022) berkuat kuasa pada:","o":["1 Jun 2024","1 Jun 2022","1 Januari 2023","1 Januari 2025"],"a":0,"e":"Seksyen 1(2) menyatakan peruntukan yang dipinda berkuat kuasa mulai 1 Jun 2024.","r":[[15,74,"Part I – Preliminary SHORT TITLE, COMMENCEMENT AND | APPLICATION | Section 1 (1) - This Act may be cited as the Occupational Safety and Health 1994 (Amended 2022). | (2) – The amended provisions effective from 1st June 2024 | Section 2 (a) - This Act shall apply to all places of work throughout Malaysia including …"]]},{"q":"OSHA 1994 TIDAK terpakai kepada:","o":["Sektor pembuatan","Angkatan tentera","Pihak berkuasa berkanun","Perkhidmatan awam"],"a":1,"e":"Seksyen 2 menyatakan Akta terpakai di semua tempat kerja termasuk perkhidmatan awam dan badan berkanun, kecuali pekerjaan domestik, angkatan tentera dan kerja di atas kapal.","r":[[15,74,"Part I – Preliminary SHORT TITLE, COMMENCEMENT AND | APPLICATION | Section 1 (1) - This Act may be cited as the Occupational Safety and Health 1994 (Amended 2022). | (2) – The amended provisions effective from 1st June 2024 | Section 2 (a) - This Act shall apply to all places of work throughout Malaysia including …"]]},{"q":"Jika berlaku percanggahan antara OSHA dan undang-undang bertulis lain berkaitan OSH:","o":["Peruntukan OSHA akan mengatasi","Kedua-duanya terbatal","Mahkamah menolak kes","Undang-undang lain mengatasi"],"a":0,"e":"Seksyen 2 (Prevailing Laws): peruntukan OSHA akan mengatasi sekiranya ada percanggahan atau ketidakselarasan dengan undang-undang bertulis lain.","r":[[16,74,"PART I: PRELIMINARY | Section 2 – Prevailing Laws | 1. The provisions of this Act shall be in addition to, and not in derogation of, the provisions of any other written law relating to occupational safety and health. | 2. The OSHA provisions will supersede if any conflict or inconsistencies with other written law"]]},{"q":"Menurut tafsiran Seksyen 3, 'Occupier' ialah:","o":["Pemilik tanah sahaja","Orang yang mempunyai pengurusan atau kawalan ke atas tempat kerja","Kontraktor utama sahaja","Pekerja yang tinggal di premis"],"a":1,"e":"Occupier ditakrifkan sebagai orang yang mempunyai pengurusan atau kawalan ke atas tempat kerja.","r":[[18,75,"Part I – Preliminary | Section 3 - Interpretation | ✔“principal” means any person who during or for the purposes | of his trade to any work undertaken by the principal; | ✔“Occupier” a person who has the management or control of | the place of work: | ✔“Place of Work” premises where persons work, or premises | used …"]]},{"q":"Faktor yang perlu dipertimbangkan dalam tafsiran 'Practicable' termasuk yang berikut KECUALI:","o":["Tahap pengetahuan tentang bahaya","Populariti syarikat","Keterukan bahaya atau risiko","Kos menghapus atau mengurangkan risiko"],"a":1,"e":"Practicable mengambil kira keterukan bahaya, tahap pengetahuan, kebolehdapatan kaedah kawalan dan kos menghapus/mengurangkan risiko.","r":[[22,77,"Part I – Preliminary | Section 3 - Interpretation | Practicable: Practicable should consider: a) The severity hazard or risk in question | b) The state of knowledge about the hazard or risk | and the way of removing or mitigate the hazard or risk c) The availability and suitability of ways or methods to | remove or …"]]},{"q":"Yang manakah BUKAN objektif OSHA 1994 (Seksyen 4)?","o":["Menetapkan kadar gaji minimum pekerja","Menyediakan sistem peraturan dan tataamalan industri","Melindungi orang lain selain pekerja di tempat kerja","Menjamin keselamatan, kesihatan dan kebajikan orang di tempat kerja"],"a":0,"e":"Objektif Seksyen 4: keselamatan/kesihatan/kebajikan pekerja, melindungi orang lain, persekitaran sesuai fisiologi/psikologi, dan sistem peraturan serta tataamalan industri. Gaji bukan objektif.","r":[[23,78,"Part I - Preliminary | Section 4 - Objectives Of The Act |  To secure the safety, health and welfare of persons at work. |  To protect person at a place of work other than persons at work.  To promote an occupational environment for persons at work which is adapted to their physiological and psychological needs. …"]]},{"q":"Bilangan ahli Majlis Negara bagi Keselamatan dan Kesihatan Pekerjaan (NCOSH) ialah:","o":["Tidak kurang 22 dan tidak lebih 25 orang","Tepat 20 orang","Tidak kurang 30 orang","Tidak kurang 10 dan tidak lebih 15 orang"],"a":0,"e":"Seksyen 9: ahli dilantik oleh Menteri, tidak kurang 22 dan tidak lebih 25, dipengerusikan Timbalan Menteri; JKKP sebagai sekretariat.","r":[[27,80,"Part III – National Council for OSH | Section 9-Apointment of Members by Minister |  Not less then 22 and not more than 25  Chairman (Deputy Minister)  Representatives from |  Employers |  Employees |  Government |  DOSH will act as Secretariat"]]},{"q":"Seksyen 15(1) OSHA 1994 mewajibkan majikan memastikan keselamatan, kesihatan dan kebajikan pekerja:","o":["Secara mutlak dalam semua keadaan","Setakat yang praktik (so far as is practicable)","Jika diarahkan oleh JKKP","Hanya semasa waktu pejabat"],"a":1,"e":"Seksyen 15(1): kewajipan setiap majikan memastikan, setakat yang praktik, keselamatan, kesihatan dan kebajikan semua pekerjanya.","r": gn the report to confirm receipt | • Report shall be held in good condition for at least ten …"]]},{"q":"Laporan SHO hendaklah disimpan dalam keadaan baik sekurang-kurangnya:","o":["10 tahun","7 tahun","5 tahun","3 tahun"],"a":0,"e":"Peraturan 20: laporan hendaklah disimpan dalam keadaan baik sekurang-kurangnya sepuluh tahun.","r":[[30,131,"PART V: DUTIES OF SHO | ACTION TO BE TAKEN ON REPORT (Reg. 20) | • Employer or person in charge, after receiving report, shall: | – Discuss with the SHO the contents of the report within 2 weeks of | receiving it – Countersign the report to confirm receipt | • Report shall be held in good condition for at least ten …"]]},{"q":"Jika SHO meninggal dunia, sakit atau tidak hadir, KP boleh membenarkan kerja diteruskan tanpa SHO untuk tempoh tidak melebihi:","o":["Enam bulan","Tiga bulan","Satu tahun","Satu bulan"],"a":1,"e":"Peraturan 21: KP boleh membenarkan secara bertulis kerja dijalankan tanpa SHO untuk tempoh tidak melebihi tiga bulan.","r":[[31,132,"PART VI: MISCELLANEOUS | DEATH, SICKNESS AND ABSENCE FROM WORK (Regulation 21) | • In the event of the death, sickness or absence from work of a SHO, the Director General may authorize the employer, in writing, to allow work to be carried out for a period not exceeding three months without a SHO"]]},{"q":"Perintah OSH (SHO) 1997 diwartakan sebagai:","o":["P.U.(A) 514","P.U.(A) 316","P.U.(A) 131","P.U.(A) 106"],"a":1,"e":"Slaid menyatakan Occupational Safety and Health (Safety and Health Officer) Order 1997 (P.U.(A)316).","r":[[32,132,"OCCUPATIONAL SAFETY AND HEALTH | (SAFETY AND HEALTH OFFICER) | ORDER1997 (P.U.(A)316)"]]},{"q":"Industri kerja kayu yang melibatkan pemotongan atau penggergajian memerlukan SHO jika menggaji:","o":["Lebih 100 pekerja","Lebih 250 pekerja","Lebih 40 pekerja","Lebih 500 pekerja"],"a":0,"e":"Perintah SHO (h): industri kerja kayu dengan pemotongan, penggergajian, pengetaman dan sebagainya yang menggaji lebih 100 pekerja.","r":[[35,134,"INDUSTRIES REQUIRED TO n 31 menetapkan fungsinya: mengkaji langkah keselamatan dan menyiasat isu OSH.","r":[[8,141,"FUNCTIONS OF THE COMMITTEE | OSHA 1994 – Section 31 | • Review all safety and health measures that have been taken and implemented | • Investigate issues related to occupational safety and health and bring to attention of the employer | • Other functions may be determined"]]},{"q":"Peraturan Jawatankuasa Keselamatan dan Kesihatan 1996 mengandungi berapa Bahagian?","o":["15 Bahagian","4 Bahagian","6 Bahagian","5 Bahagian"],"a":2,"e":"Kandungan: Bahagian I hingga VI – Permulaan, Komposisi, Fungsi, Mesyuarat, Latihan & Maklumat dan Penalti.","r":[[9,142,"CONTENTS | • Part I - Preliminary | • Part II - Composition of Safety and Health Committee | • Part III - Functions of Safety and Health Committee | • Part IV - Meetings of Safety and Health Committee | • Part V - Provisions of Training and Information | • Part VI - Penalty"]]},{"q":"Bagi tempat kerja dengan lebih 100 pekerja, bilangan minimum wakil pekerja dalam jawatankuasa ialah:","o":["2 orang","6 orang","8 orang","4 orang"],"a":3,"e":"Peraturan 5: kurang daripada 100 pekerja minimum 2 wakil; lebih 100 pekerja minimum 4 wakil.","r":[[14,144,"PART II: COMPOSITION OF COMMITTEE | Membership (Regulation 5) | 1) Chairman 2) Secretary - Safety and Health Officer or other appointed person 3) Employer representatives 4) Employees representatives - Note: | • <100 employees minimum 2 rep • if >100 employees 4 reps"]]},{"q":"Siapakah yang menjadi Pengerusi jawatankuasa keselamatan dan kesihatan?","o":["Wakil pekerja yang paling senior","SHO","Majikan atau pengurus yang diberi kuasa","Pegawai JKKP"],"a":2,"e":"Peraturan 6: Pengerusi ialah majikan atau pengurus yang diberi kuasa; Setiausaha ialah SHO.","r":[[15,145,"PART II: COMPOSITION OF COMMITTEE | Appointment of Chairman and Secretary (Reg. 6) | • Chairman – Employer or authorised Manager | • Secretary – SHO; or – Appointed by the Chairman via voting if there is no SHO"]]},{"q":"Jik er relevant documents and information (2 copies of each)"]]},{"q":"Peraturan keselamatan dan kesihatan tempat kerja boleh dipinda oleh jawatankuasa dengan:","o":["Kelulusan JKKP","Kelulusan majikan","Kelulusan SHO sahaja","Undian semua pekerja"],"a":1,"e":"Peraturan 19: peraturan boleh dipinda, diubah atau dibatalkan oleh jawatankuasa dengan kelulusan majikan.","r":[[28,151,"PART III: FUNCTIONS OF COMMITTEE | Rules on Safety and Health (Regulation 19) | • Employer shall consult with Committee on the preparation, introduction and promotion of safety and health rules | • The rules may be amended, varied or rescinded by the committee, with approval of employer | • Copies of the rules …"]]},{"q":"Mesyuarat jawatankuasa hendaklah diadakan tidak kurang daripada:","o":["Sekali dalam tiga bulan","Sekali dalam enam bulan","Sekali setahun","Sekali sebulan"],"a":0,"e":"Peraturan 21: mesyuarat diadakan mengikut risiko tempat kerja, tetapi tidak kurang sekali dalam tiga bulan.","r":[[30,152,"PART IV: COMMITTEE MEETINGS | Frequency of Meetings (Reg. 21) | • As often as may be necessary to commensurate the risks existent at the workplace | • Not less that once in three months | • Members are given written notices and copy of agenda | • Meeting shall immediately be called in the event of an accident, near …"]]},{"q":"Mesyuarat jawatankuasa mesti diadakan dengan segera apabila:","o":["Ada pekerja baharu","Berlaku kemalangan, near-miss atau kejadian berbahaya","Akhir tahun kewangan","Pertukaran SHO"],"a":1,"e":"Peraturan 21: mesyuarat hendaklah dipanggil serta-merta sekiranya berlaku kemalangan, near-miss dan kejadian berbahaya.","r":[[30,152,"PART IV: COMMITTEE MEETINGS | Frequency of Meetings (Reg. 21) | • As often as may be necessary to commensurate the risks existent at the workplace | • Not less that once in three months | • Members are given written notices and copy of agenda | • Meeting shall immediately be called in the event of an accident, near …"]]},{"q":"Korum mesyuarat jawatankuasa ialah:","o":["Pengerusi, Setiausaha dan tidak kurang separuh daripada ahli lain","Semua ahli","Pengerusi dan dua ahli","Setiausaha dan tiga wakil pekerja"],"a":0,"e":"Peraturan 24: korum ialah Pengerusi, Setiausaha dan tidak kurang daripada separuh baki ahli.","r":[[32,153,"PART IV: COMMITTEE MEETINGS | Inaugural Meeting (Reg. 23) | • Shall be convened by the employer/ authorised manager at the place of work | • Shall make clear the policy, plans and suggestions | Quorum (Reg. 24) | • Quorum will be the Chairman, Secretary and not less than half of the remaining members"]]},{"q":"Minit mesyuarat perlu diedarkan kepada setiap ahli dalam tempoh:","o":["Dua minggu selepas mesyuarat","Tiga hari","Satu bulan","Sebelum mesyuarat seterusnya"],"a":0,"e":"Peraturan 27: minit diedarkan dalam tempoh dua (2) minggu dan disimpan sekurang-kurangnya tujuh (7) tahun.","r":[[34,154,"PART IV: COMMITTEE MEETINGS | Minutes of Meeting (Reg. 27) | • Distributed to each member within two (2) weeks after the meeting | • Copy of minutes are kept for a minimum of seven (7) years | • Given to the Occupational Safety and Health Officer when requested"]]},{"q":"Maklumat yang TIDAK perlu dibekalkan kepada jawatankuasa (Peraturan 31) termasuk:","o":["Maklumat yang menjejaskan keselamatan negara","Akta dan perundangan berkaitan","Prosedur pengendalian","Maklumat teknikal bahaya"],"a":0,"e":"Peraturan 31: maklumat yang memudaratkan keselamatan negara, dilarang undang-undang, berkaitan individu tanpa persetujuan, menjejaskan perniagaan atau untuk prosiding undang-undang tidak perlu dibekalkan.","r":[[37,156,"PART V: TRAINING & INFORMATION | Information not to be Supplied (Reg. 31) | • Disclosure that is prejudicial to national security | • If disclosed, contravenes with a prohibition under any written law | • Relating to a specific individual, unless with consent | • That would effect the business, or | • For the …"]]},{"q":"Penalti bagi pelanggaran Peraturan Jawatankuasa Keselamatan dan Kesihatan 1996 ialah:","o":["Denda RM10,000 atau penjara 1 tahun","Denda RM1,000 sahaja","Denda RM50,000 atau penjara 2 tahun","Denda RM5,000 atau penjara 6 bulan atau kedua-duanya"],"a":3,"e":"Peraturan 32: denda RM5,000 atau penjara enam bulan atau kedua-duanya.","r":[[38,156,"PART VI: PENALTY | Regulation 32 | A person who contravenes any of the provisions in the Regulations shall, on conviction, be liable to: | • Fine of RM 5,000 or | • Six (6) months imprisonment or | • BOTH"]]},{"q":"Ahli jawatankuasa yang tidak hadir tugas biasa kerana komitmen jawatankuasa:","o":["Perlu menggantikan masa kerja","Akan diberi amaran","Akan dipotong gaji","Tidak boleh dikenakan penalti"],"a":3,"e":"Peraturan 7(3): ahli tidak boleh dikenakan penalti jika tidak hadir tugas biasa kerana komitmen jawatankuasa.","r":[[16,145,"PART II: COMPOSITION OF COMMITTEE | Appointment of Other Members (Reg. 7) | • Employer and worker representatives – Nomination and vote – if nominees exceed required number, or – Appointment by the employer – if no rep. | • A member cannot be penalised if absent from normal tasks due to committed commitments …"]]}]},{"id":"1.06","title":"OSH (Control of Industrial Major Accident Hazards) Regulations 1996","total":80,"qs":[{"q":"Bahan kimia yang terlepas dalam kemalangan Flixborough (1 Jun 1974) ialah:","o":["Dioksin (TCDD)","Sikloheksana (cyclohexane)","Metil isosianat (MIC)","Gas klorin"],"a":1,"e":"Flixborough: pelepasan sikloheksana memusnahkan loji dan mengorbankan 28 orang.","r":[[6,162,"EXAMPLES OF MAJOR ACCIDENT | Flixborough: | 1 June 1974 - | Release of cyclohexane plant | destroyed 28 people killed"]]},{"q":"Kemalangan Bhopal (3 Disember 1984) melibatkan pelepasan bahan sangat toksik iaitu:","o":["Dioksin","Ammonia","Sikloheksana","Metil isosianat (MIC)"],"a":3,"e":"Di Bhopal, air memasuki tangki dan bertindak balas dengan kandungannya lalu melepaskan metil isosianat (MIC) yang sangat toksik.","r":[[9,164,"EXAMPLES OF MAJOR ACCIDENT | Bhopal: | 3 December 1984 - | Water enters a tank and | reacts with its contents causing the release of highly toxic methyl isocyanate (MIC)"]]},{"q":"Kemalangan Seveso (10 Julai 1976) menyebabkan pelepasan bahan:","o":["Sikloheksana","Metil isosianat","Dioksin 2,3,7,8-TCDD","Hidrogen sulfida"],"a":2,"e":"Seveso: tindak balas eksotermik tidak terkawal melepaskan dioksin 2,3,7,8-TCDD; 187 kes chloracne dan ribuan haiwan disembelih.","r":[[12,165,"EXAMPLES OF MAJOR ACCIDENT | Seveso: | Immediate consequences | • Release of dioxin, 2,3,7,8 TCDD led to removal of top soil from area • 447 people were treated for caustic burns • 187 cases of chloracne • Thousands of animals slaughtered"]]},{"q":"Berapakah komponen sistem kawalan bahaya besar (major hazard control system)?","o":["4 komponen","6 komponen","5 komponen","8 komponen"],"a":1,"e":"Enam komponen: pengenalpastian MHI, maklumat pemasangan, tindakan dalam aktiviti industri, tindakan pihak berkuasa, perancangan kecemasan dan maklumat kepada awam.","r":[[13,166,"COMPONENTS OF MAJOR HAZARD CONTROL SYSTEM | • Identification Of Major Hazard Installation | • Information About Installation | • Action Inside The Industrial Activity | • Actions By The Governmental Authorities | • Emergency Planning | • Information To The Public"]]},{"q":"Yang manakah BUKAN komponen sistem kawalan bahaya besar?","o":["Pengiklanan produk kimia","Perancangan kecemasan","Pengenalpastian pemasangan bahaya besar","Maklumat kepada orang awam"],"a":0,"e":"Komponen ialah pengenalpastian, maklumat pemasangan, tindakan dalam industri, tindakan kerajaan, perancangan kecemasan dan maklumat awam.","r":[[13,166,"COMPONENTS OF MAJOR HAZARD CONTROL SYSTEM | • Identification Of Major Hazard Installation | • Information About Installation | • Action Inside The Industrial Activity | • Actions By The Governmental Authorities | • Emergency Planning | • Information To The Public"]]},{"q":"Penyediaan Pelan Tindakan Kecemasan luar tapak (off-site ERP) adalah tindakan oleh:","o":["Pembekal bahan kimia","Kontraktor","Pihak berkuasa kerajaan","Pekerja"],"a":2,"e":"Tindakan pihak berkuasa kerajaan termasuk inventori MHI, semakan laporan keselamatan, menyediakan off-site ERP, penempatan MHI serta audit dan pemeriksaan.","r":[[21,170,"ACTIONS BY THE GOVERNMENTAL AUTHORITIES | • Establishment major hazard installations inventory | • Receipt and review of the safety reports | • Prepare an off-site emergency response plan to mitigate the consequences | • Siting of major hazard installations | • Conduct audit and inspection | 20"]]},{"q":"Objektif Peraturan CIMAH ialah:","o":["Mengawal import bahan kimia","Mengawal harga bahan kimia","Mendaftar semua pekerja kilang kimia","Mencegah kemalangan industri besar dan menghadkan akibatnya kepada manusia, harta dan alam sekitar"],"a":3,"e":"Objektif CIMAH: mencegah kemalangan industri besar dan menghadkan akibatnya kepada manusia, harta benda dan alam sekitar.","r":[[23,171,"OBJECTIVE OF CIMAH REGULATIONS | • To prevent major industrial accidents | • To limit the consequences to people, property and the environment"]]},{"q":"Peraturan CIMAH 1996 mempunyai berapa Bahagian?","o":["7 Bahagian","4 Bahagian","5 Bahagian","6 Bahagian"],"a":3,"e":"Bahagian I Permulaan, II Pengenalpastian & Pemberitahuan, III Demonstrasi Operasi Selamat, IV Laporan & Pelan Kecemasan, V Pemberitahuan Kemalangan Besar, VI Penalti.","r":[[24,171,"ARRANGEMENT OF REGULATIONS | PART I - PRELIMINARY | PART II - IDENTIFICATION AND NOTIFICATION OF AN INDUSTRIAL ACTIVITY | PART III - DEMONSTRATION OF SAFE OPERATION | PART IV - REPORT ON INDUSTRIAL ACTIVITY AND PREPARATION OF EMERGENCY PLAN | PART V - NOTIFICATION OF MAJOR ACCIDENT | PART VI - PENALTY"]]},{"q":"Peraturan CIMAH TIDAK terpakai kepada:","o":["Stor LPG","Loji petrokimia","Kilang baja","Pemasangan nuklear"],"a":3,"e":"Pengecualian: pemasangan nuklear, pemasangan angkatan tentera, kenderaan/kapal pengangkut dan aktiviti dengan kuantiti ≤10% kuantiti ambang.","r":[[26,172,"PART I - PR h these information | •Product identifier •Supplier identification •Signalword •Hazard statement •Hazard pictogram •Precautionary statement"]]},{"q":"Jika kata isyarat 'Danger' digunakan pada label:","o":["Kata 'Warning' mesti turut digunakan","Kata 'Warning' tidak boleh digunakan","Piktogram tidak diperlukan","Label boleh ditulis tangan"],"a":1,"e":"Jika perkataan 'Danger' digunakan, perkataan 'Warning' tidak boleh digunakan.","r":[[12,235,"REQUIREMENTS | – If word „Danger‟ used, word „Warning‟ not to | be used. | – Label to be updated within 3 months of any | changes in the classification | – Label shall be firmly affixed to one or more | surface and can be read horizontally | – If not practicable, tagging can be used"]]},{"q":"Label perlu dikemas kini dalam tempoh berapa lama selepas perubahan klasifikasi?","o":["3 bulan","1 bulan","6 bulan","1 tahun"],"a":0,"e":"Label hendaklah dikemas kini dalam tempoh 3 bulan selepas sebarang perubahan dalam klasifikasi.","r":[[12,235,"REQUIREMENTS | – If word „Danger‟ used, word „Warning‟ not to | be used. | – Label to be updated within 3 months of any | changes in the classification | – Label shall be firmly affixed to one or more | surface and can be read horizontally | – If not practicable, tagging can be used"]]},{"q":"Jika label tidak praktikal dilekatkan pada bekas, pembekal boleh menggunakan:","o":["Pengumuman lisan","Emel kepada pelanggan","Tag (tagging)","Papan kenyataan di gudang"],"a":2,"e":"Label perlu dilekat kukuh dan boleh dibaca mendatar; jika tidak praktikal, tagging boleh digunakan.","r":[[12,235,"REQUIREMENTS | – If word „Danger‟ used, word „Warning‟ not to | be used. | – Label to be updated within 3 months of any | changes in the classification | – Label shall be firmly affixed to one or more | surface and can be read horizontally | – If not practicable, tagging can be used"]]},{"q":"Berapakah bilangan maklumat (seksyen) yang perlu ada dalam SDS?","o":["12","16","8","20"],"a":1,"e":"SDS hendaklah mengandun
