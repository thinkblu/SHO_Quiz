<title>Kuiz SHO NIOSH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: safety-signage language — green "safe condition" bands, hazard-yellow accents, a single reading column of question cards */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#e9eee8; --ink:#16201a; --muted:#56635a; --line:#d3dbd2;
  --green:#00794a; --green-ink:#ffffff; --green-soft:#dcefe4; --yellow:#f5c400; --yellow-ink:#1c1a10;
  --red:#b3261e; --red-soft:#f8e1de; --focus:#0b5cad;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18201b; --surface-2:#202a24; --ink:#e7eee9; --muted:#9db0a3; --line:#2c3a31;
  --green:#2fae74; --green-ink:#06130c; --green-soft:#173426; --yellow:#f5c400; --yellow-ink:#1c1a10;
  --red:#ff8a80; --red-soft:#3a1b19; --focus:#7db7ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201b; --surface-2:#202a24; --ink:#e7eee9; --muted:#9db0a3; --line:#2c3a31;
  --green:#2fae74; --green-ink:#06130c; --green-soft:#173426; --yellow:#f5c400; --yellow-ink:#1c1a10;
  --red:#ff8a80; --red-soft:#3a1b19; --focus:#7db7ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hazard{height:10px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px)}
header.top{background:var(--green);color:var(--green-ink)}
header.top .wrap{padding-block:22px 20px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;opacity:.9}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.08}
h1{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:.005em}
.sub{margin:0;max-width:60ch;opacity:.92}
.note{margin:4px 0 0;max-width:60ch;font-size:14px;font-weight:600;opacity:.85}
.crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:15px}
.crumbs button{background:none;border:0;padding:2px 0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
main .wrap{padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
/* module cards */
.modgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:600px){.modgrid{grid-template-columns:1fr}}
.mod{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 18px 16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.mod:hover{transform:translateY(-2px);border-color:var(--green)}
.mod .num{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.9;color:var(--green)}
.mod .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mod .pc{display:flex;flex-direction:column;align-items:flex-end;text-align:right;background:var(--green-soft);border-radius:6px;padding:6px 10px;min-width:96px}
.mod .pc b{font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.mod .pc small{font-size:12px;color:var(--muted);line-height:1.3}
.mod .pc.none b{color:var(--muted)}
.mod h2{font-size:24px;font-weight:700}
.mod .en{color:var(--muted);font-size:14px}
.mod .meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;font-variant-numeric:tabular-nums}
.mod .meta b{color:var(--ink)}
.mod .bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.mod .bar i{display:block;height:100%;background:var(--green)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:14px;color:var(--muted)}
.howto div{border-left:4px solid var(--yellow);padding:2px 0 2px 10px}
.howto b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
@media (max-width:600px){.howto{grid-template-columns:1fr}}
/* chapter list */
.chlist{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer}
.ch:hover:not(:disabled){border-color:var(--green)}
.ch:disabled{cursor:not-allowed;opacity:.55}
.ch .id{font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--surface-2);padding:4px 8px;border-radius:4px;min-width:62px;text-align:center}
.ch .t{font-weight:600;line-height:1.3}
.ch .s{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.ch .score{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ch .score.done{color:var(--green);font-weight:600}
/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.qbar .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.qbar .stat{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.qbar .stat b{color:var(--ink)}
.prog{flex:1 1 160px;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:120px}
.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:5px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.q .qn{display:flex;gap:12px;align-items:flex-start}
.q .badge{flex:none;font-family:var(--f-display);font-weight:800;font-size:20px;width:40px;height:40px;display:grid;place-items:center;background:var(--yellow);color:var(--yellow-ink);border-radius:4px}
.q .qt{font-weight:600;font-size:17px;line-height:1.4;padding-top:6px;min-width:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .L{font-family:var(--f-display);font-weight:700;font-size:17px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--surface-2)}
.opt .mk{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.opt.picked{border-color:var(--ink);background:var(--surface-2)}
.opt.picked .L{background:var(--ink);color:var(--surface)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .L{background:var(--green);color:var(--green-ink)}
.opt.correct .mk{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .L{background:var(--red);color:var(--surface)}
.opt.wrong .mk{color:var(--red)}
.opt:disabled{cursor:default}
.opt.pending{border-color:var(--yellow);border-style:dashed;background:var(--surface-2)}
.opt.pending .L{background:var(--yellow);color:var(--yellow-ink)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface-2);border-left:4px solid var(--yellow);border-radius:6px;padding:10px 12px}
.confirm[hidden]{display:none}
.confirm p{margin:0;font-weight:600}
.confirm .acts{display:flex;gap:8px;flex-wrap:wrap}
.confirm .yes{background:var(--green);color:var(--green-ink);border:0;padding:8px 14px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.confirm .no{background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:8px 14px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.confirm .no:hover{border-color:var(--ink)}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hint{font-size:14px;color:var(--muted)}
.reveal{background:var(--ink);color:var(--surface);border:0;padding:9px 16px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.reveal:hover{background:var(--green);color:var(--green-ink)}
.ans{border-top:2px solid var(--green);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.ans .lab{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--green)}
.ans p{margin:0;max-width:68ch}
.ref{background:var(--surface-2);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ref .where{font-family:var(--f-mono);font-size:13px;line-height:1.5;display:flex;flex-wrap:wrap;gap:4px 8px}
.ref .where span{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 7px;white-space:nowrap}
.ref .where span.k{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);font-weight:600}
.ref blockquote{margin:0;font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;overflow-wrap:anywhere}
.done-card{background:var(--green);color:var(--green-ink);border-radius:6px;padding:20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.done-card h2{font-size:28px}
.done-card .btn{background:var(--green-ink);color:var(--green);border-color:transparent}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:20px;color:var(--muted)}
/* participant strip + registration */
.whobar{background:var(--ink);color:var(--surface);font-size:14px}
.whobar[hidden]{display:none}
.whobar .wrap{padding-block:7px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.whobar b{font-weight:700}
.whobar button{background:none;border:1px solid currentColor;color:inherit;border-radius:4px;padding:2px 10px;cursor:pointer;font-size:13px;opacity:.85}
.whobar button:hover{opacity:1}
.sync{font-family:var(--f-mono);font-size:12px;opacity:.8}
.reg{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--green);border-radius:6px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;max-width:560px}
.reg h2{font-size:28px}
.reg p{margin:0;color:var(--muted)}
.reg label{font-weight:600;display:flex;flex-direction:column;gap:6px}
.reg input{font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.reg input:focus{border-color:var(--green);outline:none}
.reg .go{align-self:flex-start;background:var(--green);color:var(--green-ink);border:0;padding:11px 20px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.reg .err{color:var(--red);font-size:14px;min-height:1.2em}
.reg [hidden]{display:none}
.reg form{display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:7px;padding:4px}
.seg button{border:0;background:transparent;padding:9px 8px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.03em;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.reg .acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.reg .go:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;padding:0;color:var(--green);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;font-weight:600}
.emline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:15px;overflow-wrap:anywhere}
.whobar .em{opacity:.7;font-size:13px;overflow-wrap:anywhere}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--yellow);border-radius:6px;padding:14px 16px}
.resume .k{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.resume .t{font-weight:600;font-size:17px;line-height:1.3}
.avg{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--green);border-radius:6px;padding:14px 16px}
.avg .k{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.avg .v{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.avg .hint{flex-basis:100%;font-size:14px;color:var(--muted)}
.resume .go2{background:var(--green);color:var(--green-ink);border:0;padding:9px 16px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.danger{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:6px;padding:14px 16px;margin-top:8px}
.danger h3{font-size:19px}
.danger p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:52ch}
.danger .confirm{flex-basis:100%;border-left-color:var(--red)}
.danger .confirm p{color:var(--ink);font-size:15px}
.danger .btn{color:var(--red);border-color:var(--red)}
.confirm .danger-yes{background:var(--red);color:#fff}
.welcome{background:var(--green-soft);border-radius:6px;padding:10px 14px;font-weight:600}
footer{color:var(--muted);font-size:13px;text-align:center;padding-block:0 40px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>

wal merebaknya asap akibat daripada kebakaran; | Natural | Mekanikal"]]},{"q":"Pegawai Bomba Bantuan dilantik oleh Ketua Pengarah dengan persetujuan Menteri dan:","o":["Dilantik oleh Pihak Berkuasa Tempatan","Dibayar gaji penuh seperti Pegawai Bomba","Tidak tertakluk kepada kawalan KP","Tidak dibayar saraan selain elaun yang ditetapkan"],"a":3,"e":"Seksyen 4: Pegawai Bomba Bantuan tidak boleh dibayar apa-apa saraan selain elaun yang ditetapkan oleh Menteri dengan persetujuan Menteri Kewangan.","r":[[35,454,"Pegawai Bomba Bantuan | 4. (1) Ketua Pengarah boleh, dengan persetujuan Menteri, melantik apa-apa bilangan Pegawai Bomba Bantuan bagi | setiap Negeri atas apa-apa terma dan syarat sebagaimana yang ditetapkan. | (1A) Ketua Pengarah boleh menaikkan pangkat Pegawai Bomba Bantuan. | (2) Pegawai Bomba Bantuan tidak …"]]},{"q":"Tugas Jabatan Bomba dan Penyelamat di bawah Seksyen 5 termasuk:","o":["Menjalankan penyiasatan tentang sebab, punca dan hal keadaan kebakaran","Mengeluarkan lesen memandu","Mengurus bekalan air awam","Menguatkuasakan undang-undang cukai"],"a":0,"e":"Seksyen 5(1): memadam, menentang, mencegah dan mengawal kebakaran; melindungi nyawa dan harta; (b) menjalankan penyiasatan tentang sebab, punca dan hal keadaan kebakaran.","r":[[52,462,"Tugas Jabatan Bomba dan Penyelamat | 5. (1) Tugas Jabatan Bomba dan Penyelamat hendaklah termasuk— (a) mengambil langkah yang sah bagi— | (i) memadam, menentang, mencegah dan mengawal kebakaran; (ii) melindungi nyawa dan harta sekiranya berlaku kebakaran; dan (iii) menentukan pengadaan, pemasangan, penyelenggaraan …"]]},{"q":"Ketua Pengarah boleh membuat perintah tutup (Seksyen 13) apabila notis menghapuskan bahaya kebakaran tidak dipatuhi DAN:","o":["Pemunya membayar denda","Premis berusia lebih 50 tahun","Penghuni memohon perintah tersebut","Bahaya kebakaran itu mungkin berulang di premis yang sama"],"a":3,"e":"Seksyen 13(1): jika notis tidak dipatuhi dan bahaya kebakaran mungkin akan berulang, KP boleh melarang penggunaan premis.","r":[[60,466,"Perintah tutup | 13. (1) Jika suatu notis menghapuskan bahaya kebakaran telah disampaikan kepada mana-mana orang, sekiranya— (a) orang itu tidak mematuhi apa-apa kehendak notis itu dalam masa yang dinyatakan di | dalamnya; dan (b) bahaya kebakaran itu, walaupun telah dihapuskan sejak penyampaian notis itu, mungkin …"]]},{"q":"Semasa kecemasan yang TIDAK melibatkan kebakaran, kuasa Seksyen 18 boleh dijalankan oleh Pegawai Bomba jika:","o":["Dia berpendapat nyawa atau harta berada dalam keadaan bahaya hampir","Pemunya premis memberi kebenaran bertulis","Mahkamah mengeluarkan waran","Polis telah tiba"],"a":0,"e":"Seksyen 19: kuasa seksyen 18 dijalankan jika Pegawai Bomba berpendapat nyawa atau harta berada dalam keadaan bahaya hampir.","r":[[69,472,"Kuasa Pegawai Bomba semasa kecemasan yang tidak melibatkan kebakaran | 19. Semasa suatu kecemasan yang tidak melibatkan kebakaran atau risiko kebakaran, kuasa yang disebut dalam seksyen | 18 hendaklah dijalankan oleh mana-mana Pegawai Bomba jika dia berpendapat bahawa nyawa atau harta berada dalam | keadaan bahaya …"]]},{"q":"Kerosakan akibat tindakan Pegawai Bomba memadam kebakaran, di bawah Seksyen 21:","o":["Dianggap sebagai kerugian disebabkan kebakaran, walau apa pun terma kontrak insurans","Dibayar oleh JBPM","Ditanggung oleh Pegawai Bomba secara peribadi","Tidak boleh dituntut sama sekali"],"a":0,"e":"Seksyen 21: kerosakan akibat tindakan menentang kebakaran hendaklah disifatkan sebagai kerugian disebabkan kebakaran walau apa pun terma kontrak insurans.","r":[[70,472,"Kerugian disebabkan kebakaran hendaklah termasuk kerosakan akibat daripada menentang kebakaran | 21. Apa-apa kerosakan atau kerugian yang ditanggung akibat daripada apa-apa tindakan yang diambil atau perkara yang | dilakukan oleh Pegawai Bomba, Pegawai Bomba Bantuan atau Pegawai Bomba Sukarela pada menjalankan …"]]},{"q":"Menggunakan pili bomba selain bagi maksud menentang kebakaran adalah:","o":["Dibenarkan untuk mencuci kenderaan","Satu kesalahan di bawah Seksyen 26","Bukan kesalahan","Dibenarkan jika membayar caj air"],"a":1,"e":"Seksyen 26: menutup, mengepung, menyembunyikan, mengganggu atau menggunakan pili bomba selain bagi maksud menentang kebakaran adalah kesalahan.","r":[[75,474,"Penyembunyian dan penyalahgunaan pili bomba | 26. Mana-mana orang yang menutup, mengepung atau menyembunyikan mana-mana pili bomba hingga | menjadikan tempatnya sukar ditentukan, atau mengganggu mana-mana pili bomba, atau menggunakan pili | bomba selain bagi maksud menentang kebakaran melakukan suatu kesalahan."]]},{"q":"Seksyen 35A membolehkan Ketua Pengarah memerintahkan kegiatan dihentikan apabila:","o":["Pekerja mogok","Premis tidak dicat","Pemunya lewat membayar cukai","Kegiatan menimbulkan bahaya kebakaran serta-merta dan kelewatan mendapatkan perintah mahkamah meningkatkan risiko"],"a":3,"e":"Seksyen 35A: kes mendesak – bahaya kebakaran serta-merta kepada nyawa/harta dan kelewatan memohon perintah larangan di bawah s.35(2) akan meningkatkan risiko.","r":[[85,479,"Kuasa Ketua Pengarah untuk memerintahkan kegiatan dihentikan dalam kes mendesak | 35A. (1) Walau apa pun mana-mana peruntukan Akta ini, jika Ketua Pengarah berpuas hati bahawa— | (a) apa-apa kegiatan yang berterusan di dalam mana-mana premis akan menimbulkan bahaya | kebakaran serta-merta yang memudaratkan …"]]},{"q":"Pengawal yang dilantik di bawah Seksyen 36A dipilih daripada kalangan:","o":["Pegawai Polis","Ahli Parlimen","Jurutera swasta","Pegawai Kanan Bomba"],"a":3,"e":"Seksyen 36A: KP boleh melantik Pengawal dalam kalangan Pegawai Kanan Bomba untuk memutuskan permohonan, mengeluarkan perakuan dan menyenggara daftar.","r":[[89,481,"Pelantikan Pengawal | 36A. Ketua Pengarah boleh melantik seorang Pengawal dalam kalangan Pegawai Kanan Bomba yang hendaklah mempunyai fungsi yang berikut: | (a) memutuskan apa-apa permohonan yang dibuat di bawah Bahagian ini dan Bahagian VB; | (b)mengeluarkan perakuan pendaftaran di bawah Bahagian ini dan perakuan …"]]},{"q":"Di bawah Seksyen 36D, memasang, menguji, menservis atau mengecas semula kelengkapan menentang kebakaran yang ditetapkan hanya boleh dilakukan oleh:","o":["Sesiapa sahaja yang membeli kelengkapan","Orang kompeten atau kontraktor keselamatan kebakaran berdaftar","Penghuni premis","Pembekal elektrik"],"a":1,"e":"Seksyen 36D(1): tiada seorang pun boleh memasang, menguji, menservis, mengecas semula atau membaiki kelengkapan yang ditetapkan melainkan berdaftar sebagai orang kompeten atau kontraktor keselamatan kebakaran.","r":[[91,482,"Kehendak bagi pendaftaran orang kompeten dan kontraktor keselamatan kebakaran | 36D. (1) Tiada seorang pun boleh memasang, menguji, menservis, mengecas semula atau membaiki mana- mana kelengkapan menentang kebakaran atau pepasangan keselamatan kebakaran yang ditetapkan oleh Menteri supaya didaftarkan, melainkan …"]]},{"q":"Menjalankan latihan berkaitan perkara dalam Jadual Ketiga tanpa berdaftar sebagai penyedia latihan atau pengajar boleh didenda tidak melebihi:","o":["RM20,000","RM100,000","RM1,000","RM5,000"],"a":1,"e":"Seksyen 36E(2): melanggar subseksyen (1) – denda tidak melebihi satu ratus ribu ringgit.","r":[[92,482,"Kehendak bagi pendaftaran penyedia latihan dan pengajar | 36E. (1) Tiada seorang pun boleh menjalankan apa-apa latihan berhubung dengan perkara yang dinyatakan dalam Jadual | Ketiga melainkan jika orang itu berdaftar sebagai penyedia latihan atau pengajar, mengikut mana-mana yang berkenaan, di | bawah Bahagian ini. …"]]},{"q":"Permohonan membaharui perakuan pendaftaran di bawah Seksyen 36H perlu dibuat sekurang-kurangnya:","o":["7 hari sebelum","Pada hari tamat tempoh","30 hari sebelum tarikh habis tempoh","6 bulan selepas tamat"],"a":2,"e":"Seksyen 36H(1): memohon membaharui sekurang-kurangnya tiga puluh hari sebelum tarikh habis tempoh perakuan pendaftaran.","r":[[95,484,"Pembaharuan perakuan pendaftaran | 36H. (1) Mana-mana orang yang memegang perakuan pendaftaran yang dikeluarkan di bawah perenggan 36G(4)(a) boleh, mengikut cara sebagaimana yang ditentukan oleh Ketua Pengarah, memohon untuk membaharui perakuan pendaftaran itu sekurang-kurangnya tiga puluh hari sebelum tarikh habis …"]]},{"q":"Pendakwaan bagi kesalahan di bawah Akta 341 hanya boleh dimulakan:","o":["Oleh mana-mana Pegawai Bomba","Oleh atau dengan keizinan bertulis Pendakwa Raya","Oleh Pihak Berkuasa Tempatan","Oleh pemunya premis"],"a":1,"e":"Seksyen 44: tiada pendakwaan boleh dimulakan kecuali oleh atau dengan keizinan bertulis Pendakwa Raya.","r":[[122,497,"Pendakwaan | 44. Tiada pendakwaan bagi suatu kesalahan di bawah Akta ini boleh dimulakan kecuali oleh | atau dengan keizinan bertulis Pendakwa Raya."]]},{"q":"Menurut Seksyen 45, Suruhanjaya Siasatan Kebakaran dilantik oleh:","o":["Menteri","Ketua Polis Negara","Ketua Pengarah","Pendakwa Raya"],"a":0,"e":"Seksyen 45: Menteri boleh melantik mana-mana orang untuk membentuk suruhanjaya siasatan tentang punca dan hal keadaan kebakaran.","r":[[125,499,"Suruhanjaya Siasatan Kebakaran | 45. (1) Menteri boleh melantik mana-mana orang untuk membentuk suatu suruhanjaya dan untuk mengadakan | siasatan tentang punca dan hal keadaan apa-apa kebakaran dan tindakan yang telah diambil untuk menentang atau | memadamkan kebakaran itu dan untuk melaporkan tentang punca, hal …"]]},{"q":"Kuorum mesyuarat Jawatankuasa Kumpulan Wang Kebajikan Jabatan Perkhidmatan Bomba ialah:","o":["Tiga orang, dan mesyuarat tidak boleh diadakan tanpa Ketua Pengarah","Lima orang tanpa syarat","Separuh daripada ahli","Dua orang"],"a":0,"e":"Seksyen 48A: tiada mesyuarat tanpa kehadiran KP; kuorum ialah tiga.","r":[[135,504,"SAMBUNGAN | (3) Tiada mesyuarat Jawatankuasa boleh diadakan tanpa kehadiran Ketua Pengarah. | (4) Kuorum bagi mesyuarat Jawatankuasa ialah tiga. | (5) Tertakluk pada Akta ini, Jawatankuasa hendaklah mempunyai kuasa untuk mengawal selia | prosidingnya."]]},{"q":"Memberikan laporan palsu mengenai kebakaran dengan sengaja boleh didenda tidak melebihi:","o":["RM20,000 atau penjara 3 tahun atau kedua-duanya","RM1,000 sahaja","RM500 atau penjara 1 bulan","RM100,000 atau penjara 10 tahun"],"a":0,"e":"Seksyen 56: laporan palsu mengenai kebakaran atau bencana – denda ≤ RM20,000 atau penjara ≤ 3 tahun atau kedua-duanya.","r":[[149,511,"Memberikan laporan palsu mengenai kebakaran | 56. Mana-mana orang yang dengan sengaja memberikan atau menyebabkan supaya diberikan | suatu laporan palsu mengenai kebakaran atau bencana lain melakukan suatu kesalahan dan | boleh, apabila disabitkan, didenda tidak melebihi dua puluh ribu ringgit atau dipenjarakan | …"]]},{"q":"Menurut Seksyen 59, kesalahan boleh kompaun boleh dikompaun dengan jumlah tidak melebihi:","o":["RM500 oleh mana-mana orang awam","RM10,000 tanpa keizinan","RM100,000","RM1,000, dengan keizinan bertulis Pendakwa Raya"],"a":3,"e":"Seksyen 59(1): KP atau Pegawai Bomba diberi kuasa boleh, dengan keizinan bertulis Pendakwa Raya, mengkompaun kesalahan dengan jumlah tidak melebihi satu ribu ringgit.","r":[[153,513,"Mengkompaun kesalahan | 59. (1) Ketua Pengarah atau mana-mana Pegawai Bomba yang diberi kuasa olehnya secara bertulis boleh, dengan | keizinan bertulis Pendakwa Raya, mengkompaun apa-apa kesalahan yang ditetapkan sebagai kesalahan boleh | kompaun dengan menerima daripada orang yang disyaki dengan munasabahnya …"]]},{"q":"Apabila berlaku kebakaran di premis, kenderaan atau vesel, pemunya atau penghuni wajib (Seksyen 61A):","o":["Menunggu 24 jam sebelum melapor","Memberitahu balai bomba terdekat dengan serta-merta","Memadam api sendiri sebelum melapor","Memaklumkan syarikat insurans dahulu"],"a":1,"e":"Seksyen 61A: pemunya/penghuni hendaklah dengan serta-merta memberitahu berlakunya kebakaran kepada balai bomba yang terdekat.","r":[[161,517,"Kewajipan untuk memberitahu apabila berlaku kebakaran | 61A. Apabila berlaku kebakaran ke atas mana-mana premis, kenderaan atau vesel, pemunya premis, kenderaan atau vesel itu, atau penghuni atau orang yang | mempunyai pengurusan keseluruhan ke atas premis itu, hendaklah dengan serta-merta memberitahu berlakunya …"]]}],"v":"e6d7c4a0","lv":"bc1dd973"},{"id":"1.19","title":"Labour and Employment Management","total":48,"qs":[{"q":"Akta Kerja 1955 dikuatkuasakan oleh:","o":["Jabatan Bomba dan Penyelamat","Jabatan Tenaga Kerja Semenanjung Malaysia","PERKESO","JKKP"],"a":1,"e":"Introduction: an Act enforced by Department of Labour Peninsular Malaysia; applies to private sector; provides minimum rights and benefits.","r":[[5,530,"INTRODUCTION | An Act enforced by Department of Labour | Peninsular Malaysia | applies to private sector in Peninsular Malaysia | regulates the relationship between an employer and | an employee | provides for the minimum rights and benefits in | employment."]]},{"q":"Pekerja yang dikecualikan daripada Akta Kerja 1955 termasuk mereka yang digaji terus oleh:","o":["Kedai runcit","Badan berkanun dan pihak berkuasa tempatan","Syarikat swasta tempatan","Kilang milik asing"],"a":1,"e":"Employee covered: local/foreign, full/part-time, permanent/temporary, contract, probation. EXCLUDE: employees directly engaged by statutory body, local authorities (Exclusion Order).","r":[[8,531,"Employee covered by the Act | Local or foreign | Full-time or part-time | Permanent or temporary | “Contract worker” (fixed-term) | Monthly rate, daily rate or hourly rate | Piece-rated or task work | Confirm or under probation. | EXCLUDE: Employees directly engaged by statutory body, local authorities …"]]},{"q":"Pekerja dalam tempoh percubaan (probation) di bawah Akta Kerja:","o":["Diliputi oleh Akta","Dikecualikan sehingga disahkan","Diliputi hanya jika warganegara","Diliputi selepas 2 tahun"],"a":0,"e":"Employee covered by the Act: … confirm or under probation.","r":[[8,531,"Employee covered by the Act | Local or foreign | Full-time or part-time | Permanent or temporary | “Contract worker” (fixed-term) | Monthly rate, daily rate or hourly rate | Piece-rated or task work | Confirm or under probation. | EXCLUDE: Employees directly engaged by statutory body, local authorities …"]]},{"q":"Menurut Akta Kerja, 'kontrak perkhidmatan' boleh dibuat:","o":["Di mahkamah sahaja","Secara bertulis sahaja","Di hadapan peguam sahaja","Secara lisan atau bertulis, nyata atau tersirat"],"a":3,"e":"Contract of service: any agreement, whether oral or in writing and whether express or implied.","r":[[9,532,"“EMPLOYER” | any person who has entered into a contract of service to employ any other person as an employee and includes the agent or manager | “CONTRACT OF SERVICE” | any agreement, whether oral or in writing and whether express or implied, whereby one person agrees to employ another as an employee and that other …"]]},{"q":"Kontrak perkhidmatan TIDAK boleh mengandungi terma yang:","o":["Menyatakan waktu kerja","Menyatakan gaji","Menyekat hak pekerja untuk menyertai kesatuan sekerja","Menyatakan peruntukan penamatan"],"a":2,"e":"Content of contract: must stipulate terms per Employment Regulations 1957 including termination; not to restrict rights to join, participate in or organize trade unions.","r":[[10,532,"CONTENT OF CONTRACT OF SERVICE | must stipulate terms and conditions as prescribed in the Employment Regulations 1957 including provision for termination | not to restrict rights of employees to join, participate in or organize trade unions. | is furnished to employee on or before commencing employment and …"]]},{"q":"Potongan gaji yang memerlukan permintaan pekerja DAN permit termasuk:","o":["Bayaran kepada pihak ketiga bagi pihak pekerja","Pendahuluan tanpa faedah di bawah seksyen 22","Potongan yang dibenarkan oleh undang-undang bertulis lain","Lebihan bayaran akibat kesilapan majikan dalam 3 bulan lepas"],"a":0,"e":"Sec. 24(3): at request of employee and with permit – schemes for benefit of employee, advance with interest, payments to third party, goods of employer, rental of accommodation.","r":[[15,535,"3. At the request of the employee and with p , (b) testing and examination, (c) adequate information, (d) research to minimise hazards, (e) safe erection or installation.","r":[[11,9,"GENERAL DUTIES OF DESIGNER, MANUFACTURER AND SUPPLIER – SEC 20(1), OSHA 1994 | (a)Ensure plant or material are designed and constructed to be safe | and without risk to health when properly used. | (b)Arrange for carrying out testing and examination. | (c)Prepare adequate information. | (d)Prepare or arrange …"]]},{"q":"Membengkok, menekan, menempa dan menggelek ialah aktiviti jentera kategori:","o":["Membentuk (shaping/forming)","Mengangkut","Memotong","Menyambung"],"a":0,"e":"Machinery activities: cutting (shearing, sawing, drilling); shaping/forming (bending, pressing, forging, rolling); joining (welding, riveting); lifting; mixing; transporting; surface treatment; packaging; maintenance; inspection.","r":[[13,10,"MACHINERY ACTIVITIES | •Cutting process – shearing, sawing, drilling, milling, grinding. | •Shaping/Forming – bending, pressing, forging, rolling. | •Joining – welding, riveting, fastening. | •Lifting/Handling – using cranes, hoists, conveyors, forklifts. | •Mixing/Processing – blending, stirring, crushing, …"]]},{"q":"Bahaya 'memotong' (cutting) melibatkan sentuhan dengan:","o":["Permukaan tajam seperti gergaji, bilah atau cakera","Permukaan panas","Bekalan elektrik","Bahan kimia"],"a":0,"e":"Cutting: contact with sharp surfaces – saw, blade, disc; hands or body may contact sharp moving parts.","r":[[15,11,"CUTTING | • Contact with sharp surfaces, such as: – Saw – Blade – Disc | • Example : workers’ hands or body parts may come into contact with sharp moving parts. | 10"]]},{"q":"Pemotong mesin pengisar (milling cutter) dan pengisar cakera (disc grinder) ialah contoh bahaya:","o":["Pelepasan tenaga","Lontaran","Hentaman","Memotong"],"a":3,"e":"Cutting examples: cutter for milling machine, disc grinder, band saw, circular saw.","r":[[16,11,"CUTTING | Cutter for Milling Machine Disc Grinder | Bend Saw Circular Saw | 1 man","Geseran atau lelasan (friction/abrasion)","Penarikan masuk"],"a":2,"e":"Friction or abrasion examples: grinder, sanding machine – burns or tear on skin's outer layer.","r":[[26,16,"FRICTION OR ABRASION | Grinder Sanding Machine | 20"]]},{"q":"Pekerja yang tersepit antara mesin dan dinding mengalami bahaya:","o":["Belitan","Penghimpitan (crushing)","Lontaran","Pemotongan"],"a":1,"e":"Crushing: body crushed between two hard objects/machine parts, e.g. between machine and wall; power press, table lifter.","r":[[27,17,"CRUSHING | • Crushing of the body in between hard two objects / machine parts | • Example: a worker can be crushed between the machine and a wall or another object. | 27"]]},{"q":"Bahaya 'penarikan masuk' (drawing in) berlaku apabila:","o":["Objek jatuh dari atas","Tekanan dilepaskan","Badan ditarik ke arah mesin dan terperangkap di antara bahagian bergerak","Bahan terpelanting keluar"],"a":2,"e":"Drawing in: body pulled towards the machine and trapped between moving parts – loose threads, gloves, hair.","r":[[29,18,"DRAWING IN | • Body is pulled towards the machine and is trapped in between the machine’s moving parts. | • Example: loose threads, gloves, or hair can be caught and drawn in. | 29"]]},{"q":"Jenis kemalangan jentera yang disenaraikan termasuk:","o":["Keracunan makanan","Kemalangan jalan raya","Lemas","Tersentuh bahan atau bahagian mesin yang terpelanting"],"a":3,"e":"Types of accidents: trapped between machine and object, entangled in machine part/material, contact with ejected parts or materials, release of potential energy.","r":[[33,20,"TYPES OF ACCIDENTS | • Contact or trapped in between a machine and another object/material | • Entangled in a machine part | • Entangled in a material | • Contact with ejected/flying machine parts | • Contact with ejected/flying materials | • Contact with release of potential energy | 33"]]},{"q":"Dalam kes mesin pengisar daging Melaka (2019), mangsa sedang melakukan:","o":["Latihan kebakaran","Operasi pengeluaran biasa","Kerja pembersihan pejabat","Kerja penyelenggaraan bersama tiga rakan sekerja"],"a":3,"e":"Victim (47-year-old Nepalese) was performing maintenance on the meat-mincing machine with three co-workers; the machine was not properly isolated.","r":[[34,20,"ACCIDENT Meat Processing Machine Fatality in Malacca (2019) | Background | In July 2019, a fatal workplace accident occurred at a meat-processing factory near Masjid Tanah, Malacca. The victim was a 47-year-old Nepalese worker who had been employed to carry out maintenance tasks alongside three co-workers. The …"]]},{"q":"Dalam hierarki kawalan bahaya jentera, 'mengubah cara orang bekerja di sekitar mesin' ialah kawalan:","o":["PPE","Kejuruteraan","Pentadbiran","Penghapusan"],"a":2,"e":"Control: elimination, substitution, isolation, engineering (physical changes), administrative (change the way people work), PPE (last).","r":[[37,22,"CONTROL | • Remove the hazard completely if possible • Replace the hazardous machine, material, or process with a safer alternative. • Physically separating people from dangerous machine energy sources to prevent accidental operation or exposure. • Physical changes to the machine or work environment to reduce risk. …"]]},{"q":"Selepas menghentikan mesin, membunyikan amaran, memberi pertolongan cemas dan mengamankan kawasan, langkah kecemasan seterusnya ialah:","o":["Menunggu sebulan","Menyambung semula pengeluaran","Melaporkan kepada pejabat JKKP terdekat bagi kecederaan serius atau kejadian berbahaya","Membuang mesin"],"a":2,"e":"Emergency: stop & isolate, raise alarm, first aid, secure area, report to nearest DOSH, investigate, correct & prevent.","r":[[38,22,"EMERGENCY | •Stop & Isolate – Press emergency stop, cut off power/energy. | •Raise Alarm – Alert coworkers, supervisor, safety team. | •First Aid – Trained first aider provides care; call ambulance if serious. | •Secure Area – Keep others away, prevent further accidents. | •Report to nearest DOSH office – Notify …"]]}],"v":"0a8c507e","lv":"efa0c5af"},{"id":"2.02","title":"Safeguarding of Machinery","total":58,"qs":[{"q":"Perlindungan jentera diperlukan untuk melindungi pekerja daripada bahagian berbahaya yang:","o":["Dibuat di luar negara","Telah dicat dengan warna terang","Mempunyai waranti","Mungkin tidak dikilang atau diletakkan dengan cara yang selamat"],"a":3,"e":"Machinery protection: protect workers from hazardous parts that may not have been manufactured or positioned safely; prevent accidents.","r":[[5,28,"MACHINERY PROTECTION | Machinery Protection is important to: | 1) Protect workers from the hazardous parts of a machine that may have not been manufactured or positioned in a safe manner. | 2) Prevent machinery related accidents. | 5"]]},{"q":"Pengadang jentera perlu diletakkan secara strategik supaya:","o":["Mengurangkan kos elektrik","Menyembunyikan jenama mesin","Menghalang sentuhan dengan bahagian atau proses berbahaya","Menambah berat mesin"],"a":2,"e":"Machinery protection: strategically positioned so as to prevent contact with hazardous parts/processes.","r":[[6,28,"MACHINERY PROTECTION | • Acts as a barrier to injuries in cases of failure of other preventive methods. | • Strategically positioned so as to prevent contact with hazardous machinery parts/processes. | 6"]]},{"q":"Aktiviti dalam perlindungan jentera termasuk:","o":["Menanggalkan pengadang semasa operasi","Pemeriksaan dan penyelenggaraan berkala pengadang dan peranti","Mengabaikan latihan operator","Mengurangkan kebersihan kawasan"],"a":1,"e":"Activities: risk assessment, installation of guards, inspection & maintenance, protective devices, housekeeping, training, monitoring compliance.","r":[[10,30,"MACHINERY PROTECTION | Activities in machinery protection: | • Risk assessment – identify potential hazards before use. • Installation of guards – fixed, interlocked, or adjustable guards. • Inspection & maintenance – regularly check guards and devices for effectiveness. • Use of protective devices – sensors, …"]]},{"q":"Bahaya yang ingin dikawal melalui perlindungan jentera termasuk:","o":["Kebisingan pejabat","Cuaca panas","Kesesakan jalan raya","Permulaan mesin yang tidak dijangka"],"a":3,"e":"Potential hazards: contact with moving parts, falling objects into machine, ejection, unexpected start-up, cutting/shearing/crushing.","r":[[11,31,"MACHINERY PROTECTION | Potential Hazard | • Contact with moving parts • Falling objects into machine • Ejection of materials • Unexpected start-up • Cutting, shearing, crushing | 11"]]},{"q":"Menempatkan bahagian berbahaya di lokasi yang sukar dicapai ialah kaedah keselamatan dari aspek:","o":["Reka bentuk","Pentadbiran","PPE","Kedudukan (position)"],"a":3,"e":"Identification of safety: manufacturing (design) and position.","r":[[12,31,"MACHINERY PROTECTION | Identification of Safety in terms of: | • Manufacturing (design) | • Position | 12"]]},{"q":"Pengadang yang baik TIDAK sepatutnya:","o":["Mengelakkan sentuhan dengan bahaya","Kukuh dan tahan lama","Menghalang objek jatuh ke dalam mesin","Mewujudkan bahaya baharu atau menyebabkan halangan"],"a":3,"e":"Minimum requirements: avoids contact, prevents objects falling into machine, does not create new hazards, does not cause obstruction or distraction.","r":[[14,32,"MACHINERY PROTECTION | Minimum requirements in protecting workers from mechanical hazards are: | • Avoids contact with hazards • Prevents objects from falling into the machine • Does not create new hazards • Does not cause obstructions or distractions | 14"]]},{"q":"Pemilihan kaedah perlindungan jentera berdasarkan faktor berikut KECUALI:","o":["Saiz atau bentuk bahan","Jenis operasi atau mesin","Keperluan pengeluaran","Warna kegemaran operator"],"a":3,"e":"Selection based on: type of operation/machine, size/shape of material, operating procedures, physical arrangement, type of material, production requirements.","r":[[15,33,"MACHINERY PROTECTION METHODS | Selection is based on practicality and effectiveness: ain a …"]]},{"q":"Lekapan lampu perlu dibersihkan secara berkala untuk:","o":["Menjimatkan air","Mengurangkan bising","Menambah haba","Memaksimumkan keberkesanan pencahayaan"],"a":3,"e":"Lighting, noise & ventilation: sufficient lighting, proper ventilation, regularly clean light fixtures to maximize illumination.","r":[[17,365,"LIGHTING, NOISE & VENTILATION | • Activity Focus: Work Environment Control • Ensure sufficient lighting to prevent accidents and related eye diseases. • Maintain proper ventilation systems to extract hazardous dust and vapours. • Regularly clean light fixtures and surfaces to maximize illumination effectiveness."]]},{"q":"Penyelenggaraan lantai yang baik memerlukan:","o":["Menutup retak dengan kotak","Lantai sentiasa basah","Menunggu audit tahunan","Lantai bebas daripada retak dan lubang serta pembaikan segera permukaan rosak"],"a":3,"e":"Floor & surface maintenance: free from cracks and holes; promptly repair damaged/slippery/uneven surfaces; clean walls and ceilings.","r":[[19,366,"FLOOR & SURFACE MAINTENANCE | • Activity Focus: Controlling the Work Environment • Maintain the work floor in good condition, free from cracks and holes. • Promptly repair any surface that is damaged, slippery, wet, or uneven. • Regularly clean internal structures (walls, ceilings) to control dust buildup."]]},{"q":"Semakan papan tanda kecemasan dan lampu kecemasan perlu dimasukkan dalam:","o":["Pemeriksaan berkala","Laporan kewangan","Kempen pemasaran","Mesyuarat pelanggan"],"a":0,"e":"Emergency signage & escape routes: warning signages for temporary and permanent hazards; escape routes marked and accessible; include emergency signage and lighting in inspections.","r":[[20,366,"EMERGENCY SIGNAGE & ESCAPE ROUTES | • Activity Focus: Safety Communication and Egress • Strategically position warning signages for both temporary and permanent hazards. • Ensure all escape routes are clearly marked, visible, and accessible. • Include a check of all emergency signage and ldup of CO2 (causing …"]]},{"q":"Silau dan bayang-bayang akibat pencahayaan yang tidak betul boleh menyebabkan:","o":["Keletihan dan kurang tumpuan visual","Dermatitis","Keracunan","Kehilangan pendengaran"],"a":0,"e":"Poor lighting: insufficient light hides hazards; glare and shadow cause fatigue and reduced visual concentration.","r":[[27,370,"POOR LIGHTING | • Contributes to slips and trips (you can't see the hazard) and causes eye strain and headaches | • Insufficient Light: Dark work areas hide hazards on the floor or around machinery. | • Glare and Shadow: Improperly placed lighting can cause shadows or harsh glare, leading to fatigue and reduced …"]]},{"q":"Kabel yang diseret di atas lantai dan menjadi lusuh boleh menyebabkan:","o":["Pengurangan bising","Penambahan cahaya","Lantai lebih licin","Pendedahan wayar hidup dan risiko kejutan atau kebakaran"],"a":3,"e":"Electrical cables across floor: damaged cables dragged across floor can become frayed, exposing live wires – shock or fire risk.","r":[[29,371,"ELECTRICAL CABLES ACROSS FLOOR | • A high-frequency cause of trips and potential electrical shock or fire if damaged. | • Temporary vs. Permanent: Even temporary cables (chargers, projectors) should be routed safely out of the walkway or covered with rubber cable ramps. | • Damaged Cables: Cables dragged across the …"]]},{"q":"Kesan biasa kemalangan tergelincir, tersandung dan terjatuh (STF) termasuk:","o":["Keracunan kimia","Kehilangan pendengaran","Penyakit paru-paru","Terseliuh, patah tulang dan kecederaan kepala"],"a":3,"e":"STF impact: sprains, broken bones and head injuries, high medical costs and lost workdays.","r":[[33,373,"SLIPS, TRIPS & FALLS (STF) | • The most direct and frequent accident resulting from poor housekeeping. | • Slips occur when there is too little friction (wet, oily, or dusty floors). | • Trips occur when a foot hits an object (cables, clutter, uneven flooring). | • Falls can occur from a height (using unstable …"]]},{"q":"Punca utama perlanggaran dengan mesin atau bahan termasuk:","o":["Lantai bersih","Pencahayaan lemah, laluan terhalang dan kurang ruang antara mesin","Penanda lantai jelas","Rak penyimpanan khas"],"a":1,"e":"Collisions: key causes – poor lighting, obstructed aisles, lack of spacing between machines; impact – crush injuries, lacerations, amputations.","r":[[34,373,"COLLISIONS WITH MACHINES/MATERIALS | • Directly related to poor layout, overcrowding, and obstructed pathways. • Movement Hazards: Accidents happen when workers collide with stationary objects (poorly placed storage, protruding machine parts) or when equipment (trolleys, forklifts) collides due to restricted …"]]},{"q":"Penyakit kulit (dermatitis) akibat housekeeping yang lemah berpunca daripada:","o":["Sentuhan dengan sisa bahan kimia di permukaan atau pengendalian agen pembersih yang salah","Pencahayaan berlebihan","Kerusi tidak selesa","Bunyi bising"],"a":0,"e":"Occupational diseases: lung/respiratory (dust, mould), skin/dermatitis (residual chemicals, cleaning agents), eye strain (poor lighting).","r":[[37,375,"OCCUPATIONAL DISEASES | • Caused by long-term exposure to contaminants resulting from lack of environmental control. | • Lung/Respiratory: Result from poor ventilation allowing dust (e.g., toner, chemical powders) or mould to accumulate and be inhaled. | • Skin/Dermatitis: Contact with residual chemicals on …"]]},{"q":"Untuk menjadikan housekeeping tanggungjawab semua, tanggungjawab tersebut perlu dimasukkan ke dalam:","o":["Huraian tugas (job description) semua pekerja","Kontrak pembekal","Laporan kewangan","Huraian tugas tukang cuci sahaja"],"a":0,"e":"Policies and SOPs: integrate housekeeping responsibilities into job descriptions for all employees, not just janitorial staff; SOPs for spill response, storage, returning tools.","r":[[39,376,"POLICIES AND STANDARD OPERATING PROCEDURES (SOPS) | • Establishing the Administrative framework for sustained housekeeping. | • Formalize the Expectation: Integrate housekeeping and safety responsibilities directly into Job Descriptions (JDs) for all employees, not just janitorial staff. Safety is everyone's role. …"]]},{"q":"Latihan housekeeping perlu dijalankan:","o":["Tidak perlu","Sekali seumur hidup","Hanya selepas kemalangan","Secara berkala melalui kursus ulangan dan toolbox talk"],"a":3,"e":"Training: housekeeping is a skill; hazard recognition; chemical safety (SDS); frequency – regular refresher courses and toolbox talks.","r":[[40,376,"TRAINING AND AWARENESS | • Ensuring every worker has the Knowledge and Skills to execute the SOPs safely. | • Housekeeping is a Skill: Training must cover the \"how-to\" for proper handling of materials, safe lifting techniques, and effective cleaning and waste control methods. | • Hazard Recognition: Ensure all …"]]},{"q":"Audit dalaman housekeeping yang komprehensif dan didokumenkan disyorkan dijalankan:","o":["Setiap suku tahun atau dua kali setahun","Setiap jam","Hanya apabila diarahkan mahkamah","Sekali setiap 10 tahun"],"a":0,"e":"Regular inspections: daily 5-minute tours; formal inspections weekly/monthly with checklist; internal audits quarterly or bi-annually; corrective action system.","r":[[41,377,"REGULAR INSPECTIONS AND AUDITS | • Systematically checking and verifying that controls are in place and effective. | • Daily Checks: Encourage supervisors and employees to conduct \"5-Minute Housekeeping Tours\" at the start or end of shifts to address immediate hazards (spills, clutter). | • Formal Inspections …"]]}],"v":"3cbd4826","lv":"13957a7e"}]},{"n":3,"title":"Kesihatan & Higien Pekerjaan","en":"Occupational Health & Hygiene","chapters":[{"id":"3.01A","title":"Overview of Occupational Health","total":33,"qs":[{"q":"Definisi kesihatan pekerjaan yang digunakan dalam bab ini dikeluarkan oleh:","o":["NIOSH Amerika Syarikat (1970)","PERKESO (1971)","JKKP Malaysia (1994)","Jawatankuasa Bersama ILO/WHO mengenai Kesihatan Pekerjaan (1950)"],"a":3,"e":"Definisi oleh Joint ILO/WHO C ilan nikotin, alkohol dan pil ialah kesan jangka panjang tekanan dari aspek:","o":["Fisiologi","Tingkah laku","Psikologi","Organisasi"],"a":1,"e":"Kesan jangka panjang: fisiologi (psikosomatik, gastritis), psikologi (kemurungan, gelisah) dan tingkah laku (nikotin, alkohol, pil, ponteng).","r":[[23,155,"Effects of Stress towards Workers (long term) | • psychosomatic symptoms, gastritis. | • depression, nervous, dissatisfied. | • increase intake of nicotine, alcohol, pills, absenteeism. | PHYSIOLOGY | PSYCHOLOGY | BEHAVIOUR"]]},{"q":"Kesan tekanan kepada organisasi termasuk:","o":["Peningkatan kadar kemalangan dan pusing ganti pekerja","Peningkatan produktiviti","Ketidakhadiran berkurangan","Hubungan kerja harmoni"],"a":0,"e":"Kesan organisasi: hubungan tidak harmoni, kemalangan meningkat, semangat rendah, kualiti dan produktiviti menurun, pusing ganti dan ketidakhadiran meningkat.","r":[[24,155,"Effects of Stress towards Organization | - Non-harmonious working relationship | - Increased rate of accidents | - Low morale | - Increased rate of diseases | - Reduced quality | - Increased turnover | - Reduced productivity | - Increased number of workers wanting to resign | - Increased absenteeism, late to work"]]},{"q":"Nadi tinggi, tekanan darah tinggi dan paras kortisol tinggi ialah tindak balas jangka pendek dari aspek:","o":["Fisiologi","Organisasi","Psikologi","Tingkah laku"],"a":0,"e":"Short term reactions: fisiologi (nadi, tekanan darah, kortisol tinggi), psikologi (keletihan mental, kecewa) dan tingkah laku (prestasi tidak konsisten).","r":[[26,156,"Reactions towards Occupational Stress (short term) | • high pulse, high blood pressure, high cortisol level | • mental fatigue, frustration, anger, distracted | • non-consistent work performance, lack of concentration | PHYSIOLOGY | PSYCHOLOGY | BEHAVIOUR"]]},{"q":"Tindak balas organisasi terhadap tekanan pekerjaan termasuk peningkatan:","o":["Keuntungan","Bonus","Kehadiran","Kesilapan manusia dan near miss"],"a":3,"e": loskeletal yang ditandai dengan keletihan, ketidakselesaan dan otot kaku dipanggil:","o":["Peringkat amaran (warning stage)","Peringkat penyakit","Peringkat gangguan","Peringkat ketidakupayaan"],"a":0,"e":"Peringkat: Warning (keletihan, tidak selesa, otot kaku) → Disturbance (sakit, kebas sekali-sekala) → Incapacity (gangguan, penyakit, ketidakupayaan).","r":[[43,188,"Incapacity Stage | Disability | Disturbance Stage Warning Stage | Disorders, Diseases | Pronounced Symptoms | Soreness, Aches, Pains | Occasional numbness, tingling, cramps | Fatigue, discomfort, stiff muscles (general or specific muscles/joints)"]]},{"q":"Faktor penuaan yang mempengaruhi gangguan ergonomik termasuk:","o":["Peningkatan ketumpatan tulang","Peningkatan fleksibiliti","Pengurangan keupayaan pembaikan badan dan ketumpatan tulang","Peningkatan kekuatan otot"],"a":2,"e":"Ageing factors: pengurangan keupayaan pembaikan badan, degenerasi sendi dan pengurangan ketumpatan tulang.","r":[[42,187,"Individual, Occupational or Non- Occupational? | Exposure to ergonomic risk | Personal factors | Ageing Factors | factors | •Body size (large/small), Nutrition, fitness, lifestyle (smoking etc) •Personal factors (fitness, nutrition, previous injuries) | •Reduced repair ability of the body, joint degeneration, …"]]}],"v":"c8269517","lv":"c8269517"},{"id":"3.08","title":"Ergonomics Risk Factors & Assessment","total":43,"qs":[{"q":"Faktor risiko ergonomik ditakrifkan sebagai:","o":["Kecederaan akibat kemalangan jalan raya","Sebarang atribut, ciri atau pendedahan yang boleh menyebabkan atau menyumbang kepada kecederaan muskuloskeletal","Penyakit akibat bahan kimia","Bahaya elektrik sahaja"],"a":1,"e":"Definisi (Guidelines on ERA 2017): sebarang atribut, ciri atau pendedahan yang boleh menyebabkan atau menyumbang kepada kecederaan muskuloskeletal.","r":[[5,193,"Definition Ergonomics Risk Factors | • Any attribute, characteristics or exposure that may cause or contribute to a musculoskeletal injury. | • Two or more risk factors may be present at one time, thereby increasing the risk of injury. | • Ergonomics risk factors associated with the work task and activities in the …"]]},{"q":"Apabila dua atau lebih faktor risiko ergonomik hadir serentak:","o":["Risiko kekal sama","Faktor risiko saling membatalkan","Risiko kecederaan meningkat","Risiko kecederaan berkurangan"],"a":2,"e":"Two or more risk factors may be present at one time, thereby increasing the risk of injury.","r":[[5,193,"Definition Ergonomics Risk Factors | • Any attribute, characteristics or exposure that may cause or contribute to a musculoskeletal injury. | • Two or more risk factors may be present at one time, thereby increasing the risk of injury. | • Ergonomics risk factors associated with the work task and activities in the …"]]},{"q":"Berapakah jenis faktor risiko ergonomik yang disenaraikan?","o":["4","7","10","5"],"a":1,"e":"7 jenis: postur janggal, daya kuat & berterusan, pergerakan berulang, postur statik, tekanan sentuhan, getaran dan faktor persekitaran lain.","r":[[7,194,"Types of Ergonomics Risk Factor | 1. Awkward postures | 2. Forceful & sustained exertion | 3. Repetitive motions | 4. Static and sustained postures | 5. Contact stress | 6. Vibration | 7. Other environmental risk factors –lighting, temperature, ventilation, noise"]]},{"q":"Postur badan yang menyimpang ketara daripada kedudukan neutral seperti membongkok, berpusing dan mencapai terlalu jauh dipanggil:","o":["Postur janggal (awkward posture)","Postur statik","Pergerakan berulang","Tekanan sentuhan"],"a":0,"e":"Awkward posture: kedudukan badan yang menyimpang ketara dari kedudukan neutral; contoh membongkok, berpusing, mencapai terlalu jauh.","r":[[8,194,"ERGONOMIC RISK FACTORS | 1. Awkward posture • Positions of the body (e.g., limbs, joints, back) that deviate significantly from the neutral position while job tasks are being performed. • Usually results from workplace and task design which not following ergonomics specifications • eg bending, twisting, over …"]]},{"q":"Mengangkat beban berat, genggaman picit dan mengendalikan tuil ialah contoh faktor risiko:","o":["Postur statik","Tekanan sentuhan","Getaran","Daya kuat dan berterusan (forceful exertion)"],"a":3,"e":"Forceful & sustained exertion: daya tinggi = beban mekanikal tinggi pada otot, ligamen, tendon dan sendi; contoh angkat beban berat, pinch grip.","r":[[10,195,"ERGONOMIC RISK FACTORS | 2. Forceful & Sustained Exertion • Higher force means higher mechanical load to the muscles, ligaments, tendons and joints. This will result in fatigue and reduces physical work capacity. • Can cause acute effect or long term effect (chronic) if excessive load are not handled correctly. • …"]]},{"q":"Pergerakan berulang menjadi lebih teruk apabila:","o":["Melibatkan pelbagai otot berbeza","Kekurangan pemulihan dalam kitaran dan melibatkan kumpulan otot kecil","Tugas sangat berbeza-beza","Terdapat rehat yang mencukupi"],"a":1,"e":"Repetitive motions lebih teruk jika tiada pemulihan dalam kitaran, melibatkan jenis otot sama dan kumpulan otot kecil seperti pergelangan tangan atau jari.","r":[[13,197,"ERGONOMIC RISK FACTORS | 3.Repetitive Motions • Performing a task over and over again with little variation for several hours using muscle and tendon in the same way. • Worst if • lacks of recovery within cycle. • Involves on same type of muscles. • Involves smaller group of muscle such as at wrist or fingers. | 10"]]},{"q":"Berdiri lama tanpa pergerakan yang mengurangkan peredaran darah dan menyebabkan ketegangan otot ialah faktor risiko:","o":["Daya kuat","Getaran","Postur janggal","Postur statik dan berterusan"],"a":3,"e":"Static & sustained postures: postur sama dikekalkan tanpa pergerakan, mengurangkan peredaran dan menyebabkan ketegangan otot; contoh berdiri lama.","r":[[15,198,"ERGONOMIC RISK FACTORS | 4. Static & Sustained Postures • Same posture or position of the body is held throughout the exertion (no movement) • Lack of movement reduces circulation and causes muscle tension which can contribute to injury. • e.g. holding, static works, prolonged standing. (DVT?) | 12"]]},{"q":"Bahagian badan yang bersentuhan dengan permukaan keras dan tajam menimbulkan faktor risiko:","o":["Postur statik","Getaran","Tekanan sentuhan (contact stress)","Pergerakan berulang"],"a":2,"e":"Contact stress: bahagian badan bersentuhan dengan permukaan keras/tajam, menekan saraf, tendon dan saluran darah dekat kulit.","r":[[17,199,"ERGONOMIC RISK FACTORS | 5. Contact Stress | • Part of your body in contact with hard and sharp surfaces. | • Will put pressure to weak areas that are more susceptible such as nerves, tendons and blood vessels which are close to the skin and underling bone at the wrists, fingers, forearm, elbows and knees"]]},{"q":"Getaran daripada alat kuasa yang dipegang dikategorikan sebagai getaran:","o":["Akustik","Struktur","Seluruh badan (whole body)","Tangan-lengan (hand-arm)"],"a":3,"e":"Vibration: whole body dari jentera; hand-arm dari alat kuasa.","r":[[19,200,"ERGONOMIC RISK FACTORS | 6. Vibration | • Whole Body from machinery | • Hand Arm from power tools"]]},{"q":"Garis Panduan Penilaian Risiko Ergonomik hanya meliputi isu ergonomik:","o":["Kognitif","Budaya","Fizikal","Makro"],"a":2,"e":"Guidelines on ERA hanya meliputi isu ergonomik fizikal di tempat kerja yang termaktub dalam OSHA 1994.","r":[[23,202,"Guidelines on Ergonomics Risk Assessment | Only cover issues related | to physical ergonomics at workplaces stipulated in OSHA 1994 | May be used by any | employers, employees and OSH practitioners. | Provides systematic plan and objective assessment in identifying, assessing and | controlling ERF at work"]]},{"q":"Dua tahap Penilaian Risiko Ergonomik (ERA) ialah:","o":["ERA Asas dan ERA Pertengahan","ERA Bertulis dan ERA Lisan","ERA Dalaman dan ERA Luaran","ERA Awal (Initial) dan ERA Lanjutan (Advanced)"],"a":3,"e":"Level of ERA: Level 1 – Initial ERA; Level 2 – Advanced ERA.","r":[[25,203,"Level of ERA | Level 1 •Initial ERA | Level 2 •Advanced ERA"]]},{"q":"Inisiatif ERA secara PROAKTIF termasuk:","o":["Aduan kecederaan MSD","Permintaan OHD","Arahan PERKESO","Penilaian kendiri pekerja, pemeriksaan walkthrough dan semakan rekod"],"a":3,"e":"Proaktif: (A) self-assessment, (B) walkthrough oleh trained person, (C) semakan rekod. Reaktif: (D) aduan MSD, (E) permintaan OHD/pihak berkuasa.","r":[[27,204,"Initiating ERA | • Reactively | • Proactively | A. Self‐assessment by the employee | D. Ergonomics related injury and MSDs complaints | A trained person can report to the management, safety and health officer or OSH committee on any work‐related complaint due to ergonomics risk factors. An example of a …"],[30,205,"Decisions | Proactive (A,B,C) | Reactive (D,E) | An initial ERA is REQUIRED if: ✅there is ergonomics hazard | ✅An initial ergonomics risk assessment should be conducted without the need to assess the claim of ergonomics risk. | identified from the self‐assessment form, OR ✅based on the professional | judgment of …"]]},{"q":"Borang penilaian kendiri pekerja (Appendix 1) biasanya dihantar secara berkala setiap:","o":["Setiap minggu","Setiap 3 tahun","6 bulan atau 1 tahun","Setiap 5 tahun"],"a":2,"e":"Employees' self-assessment: diisi oleh pekerja yang telah menghadiri program kesedaran ergonomik, dihantar setiap 6 bulan atau 1 tahun.","r":[[28,204,"Employees’-Self Assessment (Appendix 1) | • Self assessment survey form filled by employees previously attended ergonomics awareness program | • Usually send periodically (every 6 months @ 1 year)"]]},{"q":"Bagi inisiatif REAKTIF (aduan MSD atau permintaan OHD), ERA Awal:","o":["Hanya dijalankan selepas 1 tahun","Perlu dijalankan tanpa perlu menilai kesahihan tuntutan risiko ergonomik","Tidak perlu dijalankan","Bergantung kepada keputusan pekerja"],"a":1,"e":"Reactive (D, E): initial ERA should be conducted without the need to assess the claim of ergonomics risk.","r":[[30,205,"Decisions | Proactive (A,B,C) | Reactive (D,E) | An initial ERA is REQUIRED if: ✅there is ergonomics hazard | ✅An initial ergonomics risk assessment should be conducted without the need to assess the claim of ergonomics risk. | identified from the self‐assessment form, OR ✅based on the professional | judgment of …"]]},{"q":"Soal selidik Nordic dan Cornell Musculoskeletal Questionnaire digunakan dalam ERA Awal untuk:","o":["Mengukur pencahayaan","Mengukur suhu","Penilaian muskuloskeletal","Mengukur bunyi"],"a":2,"e":"Initial ERA: (1) Musculoskeletal assessment – Nordic, Cornell, Dutch Questionnaire; (2) Initial ERA Checklist (Appendix 6).","r":[[31,206,"Initial ERA. What you really need to do? | 1) Musculoskeletal Assessment | a) Nordic Questionnaire | b) Cornell Musculoskeletal Questionnaire | (Appendix 3) | c) Dutch Questionnaire etc | 2) Ergonomics Risk Factors Assessment | a) Initial Ergonomics Risk Assessment | Checklist (Appendix 6)"]]},{"q":"RULA, REBA dan ROSA ialah teknik penilaian bagi faktor:","o":["Pergerakan berulang","Daya","Getaran","Postur"],"a":3,"e":"Posture: RULA, REBA, ROSA, LMM; Force: MAC, RAPP, ACGIH Lifting TLV, NIOSH RWL; Repetitive: ART, OCRA, UPLIRA, Strain Index.","r":[[35,208,"Assessment Technique Example | POSTURE | FORCE | REPETITIVE | • RULA (Rapid Upper Limb Assessment) • REBA (Rapid Entire Body Assessment) • ROSA (Rapid Office Strain Assessment) • LMM (Lumbar Motion Monitor System) | • MAC (Manualhandling Assessment Chart) • RAPP (Risk Assessment for Pushing & Pulling) • ACGIH …"]]},{"q":"NIOSH RWL (Recommended Weight Limit) digunakan untuk menilai faktor:","o":["Pencahayaan","Pergerakan berulang","Daya (pengangkatan)","Postur"],"a":2,"e":"Force assessment: MAC, RAPP, ACGIH Lifting TLV dan NIOSH RWL.","r":[[35,208,"Assessment Technique Example | POSTURE | FORCE | REPETITIVE | • RULA (Rapid Upper Limb Assessment) • REBA (Rapid Entire Body Assessment) • ROSA (Rapid Office Strain Assessment) • LMM (Lumbar Motion Monitor System) | • MAC (Manualhandling Assessment Chart) • RAPP (Risk Assessment for Pushing & Pulling) • ACGIH …"]]},{"q":"OCRA (Occupational Repetitive Action Index) digunakan untuk menilai:","o":["Tekanan sentuhan","Daya tolak dan tarik","Pergerakan berulang","Postur seluruh badan"],"a":2,"e":"Repetitive assessment: ART, OCRA, UPLIRA dan Strain Index/Garg Model.","r":[[35,208,"Assessment Technique Example | POSTURE | FORCE | REPETITIVE | • RULA (Rapid Upper Limb Assessment) • REBA (Rapid Entire Body Assessment) • ROSA (Rapid Office Strain Assessment) • LMM (Lumbar Motion Monitor System) | • MAC (Manualhandling Assessment Chart) • RAPP (Risk Assessment for Pushing & Pulling) • ACGIH …"]]},{"q":"Langkah dalam ERA Lanjutan termasuk:","o":["Memecat pekerja yang mengadu","Mengisi borang penilaian kendiri sahaja","Mengutamakan penambahbaikan berdasarkan Jadual Penetapan Keutamaan","Menukar mesin tanpa penilaian"],"a":2,"e":"Advanced ERA: semak ERA awal, kumpul maklumat tambahan, penilaian tahap risiko, ringkaskan dapatan, utamakan penambahbaikan berdasarkan Priority Setting Table.","r":[[34,207,"Advanced ERA. What you really need to do? | a) Review of Initial ERA and Adequacy of | existing Risk Control b) Gathering additional information c) Ergonomics Risk Level Assessment / Workstation configuration Assessment d) Summarize Finding e) Prioritize Ergonomics improving based on Priority Setting Table"]]},{"q":"Dalam aktiviti pengenalpastian ERF pejabat, monitor komputer yang terlalu tinggi menimbulkan faktor risiko:","o":["Tekanan sentuhan","Bising","Getaran","Postur janggal"],"a":3,"e":"Hazard pejabat termasuk monitor terlalu tinggi dan kerusi tidak sesuai, yang menyebabkan postur janggal leher dan bahu.","r":[[38,209,"ERF Identification activities-Office work | Hazards ; | • Paper cutter blade up • Coffee without lid • File drawer left open • Computer monitor is too high • Space heater near flammable material • Improper chair • Cords running on floor"]]}],"v":"9c862364","lv":"9c862364"},{"id":"3.09","title":"Ergonomics Risk Management","total":63,"qs":[{"q":"Program Pengurusan Ergonomik ditakrifkan oleh NIOSH (CDC) sebagai:","o":["Program sukan untuk pekerja","Program berstruktur untuk mengurus isu ergonomik secara sistematik di tempat kerja","Aktiviti sosial syarikat","Pembelian kerusi baharu sahaja"],"a":1,"e":"Definisi (NIOSH, CDC): a structured program established to systematically manage the ergonomics issues and its implementation at the workplaces.","r":[[7,217,"Ergonomics Management Program | Defined as | “A structured program established to systematically manage the | ergonomics issues and its implementation at the workplaces” | (NIOSH, CDC) | • A structured program is the activities, procedures, and practices that management set up to control WRMSD hazards. • Systematic …"]]},{"q":"Yang manakah 'pencetus' (spark) bagi Program Pengurusan Ergonomik?","o":["Penurunan aduan pekerja","Pengeluaran yang terlalu tinggi","Insiden MSD yang tinggi dan tempoh kembali bekerja yang panjang","Kos rawatan rendah"],"a":2,"e":"Sparks: insiden MSD tinggi, kos insiden tinggi, kembali kerja berpanjangan, hasrat tingkatkan pengeluaran/kualiti, aduan pekerja, keperluan perundangan.","r":[[8,217,"‘Sparks’ for Ergonomics Management Program | High incident of Musculoskeletal Disorders (MSDs) | High cost of managing incidents | Prolonged return to work | Intention to increase production | To address complaints/feedback from employees | To address legislatives/standards requirements | Intention to increase …"]]},{"q":"Matlamat utama program ergonomik TIDAK termasuk:","o":["Mengurangkan ketidakhadiran","Meningkatkan pusing ganti pekerja","Meningkatkan produktiviti dan kualiti","Mengurangkan kecederaan dan penyakit"],"a":1,"e":"Primary goals: kurangkan kecederaan & penyakit, ketidakhadiran, pusing ganti pekerja, dan tingkatkan produktiviti & kualiti.","r":[[9,218,"Primary Goals of Ergonomic Program | Reduction in injuries & illnesses | Reduction in absenteeism | Reduction in employee turnover | Increased productivity & quality"]]},{"q":"Tiga elemen Program Ergonomik Bertaraf Dunia ialah:","o":["Perancangan, audit dan hukuman","Kepimpinan, organisasi dan operasi","Kewangan, pemasaran dan jualan","Mesin, bahan dan kaedah"],"a":1,"e":"Elements of World-Class Ergonomics Program: Leadership, Organizational dan Operational Elements.","r":[[10,218,"Elements of World-Class Ergonomics Program | • Strong Demonstrated Management Commitment | Leadership Elements | • Written Ergonomics Policies and Guidelines | • High Standards of Performance | • Promote Early Reporting of Injuries | ` Organizational Elements | • Supportive Engineering/Safety Personnel | • …"]]},{"q":"'Menggalakkan pelaporan awal kecederaan/simptom' tergolong dalam elemen:","o":["Kepimpinan","Operasi","Organisasi","Kewangan"],"a":0,"e":"Leadership elements: komitmen pengurusan, dasar bertulis, standard prestasi tinggi dan promote early reporting of injuries.","r":[[12,219,"Leadership Elements | Strong Demonstrated Management Commitment | Written Ergonomics Policies and Guidelines | High Standards of Performance | Promote Early Reporting of Injuries"]]},{"q":"Dasar ergonomik bertulis sepatutnya:","o":["Ditulis oleh pekerja baharu","Tidak mempunyai matlamat","Disokong oleh pengurusan tertinggi dan disampaikan kepada semua kakitangan","Dirahsiakan daripada pekerja"],"a":2,"e":"Written policies: disokong pengurusan tertinggi, menggariskan matlamat, sesuai saiz organisasi, disampaikan kepada semua, menetapkan matlamat jelas dan tarikh pelaksanaan.","r":[[14,220,"Leadership Elements | Written Ergonomics Policies & Guidelines • The written policies/guidelines should be: • Endorsed and advocated by the highest level of management • Outlines the employer's goals and plans. • Suitable for the size and complexity of the workplace operations, • Communicated to all personnel, • …"]]},{"q":"'Ergonomik sebagai tanggungjawab organisasi barisan (line organization)' bermaksud:","o":["Hanya jabatan HR bertanggungjawab","Hanya SHO bertanggungjawab","Pengenalpastian dan pengurusan risiko ergonomik tersebar ke seluruh organisasi dengan peranan yang jelas","Hanya pekerja kilang bertanggungjawab"],"a":2,"e":"Line organization responsibility: risiko ergonomik diurus merentas organisasi; peranan pengurusan atasan, penyelia dan pekerja ditakrifkan dengan jelas.","r":[[20,223,"Organizational Elements | Ergonomics as a line organization responsibility | • Ergonomics risk identification & management is spread across the board | • Role and functions of top management, supervisory and employees were clearly defined"]]},{"q":"Pasukan petugas ergonomik bersepadu sepatutnya terdiri daripada wakil:","o":["Pengurusan atasan sahaja","Kontraktor luar sahaja","Pelbagai jabatan seperti kejuruteraan, pengeluaran, HR, kualiti dan keselamatan","Jabatan kewangan sahaja"],"a":2,"e":"Integrated organization: task force terdiri daripada wakil kejuruteraan industri, pembuatan, penyelenggaraan, pengurusan, HR, perubatan, bahan, kualiti, pengeluaran dan keselamatan.","r":[[23,225,"Organizational Elements | Integrated organization for ergonomics | Industrial Engineering | Manufacturing | Engineering Maintenance | Management Human Resources | Medical Practitioners | • Ergonomics task force should consist of representatives from various departments: | Materials Quality Production | Safety and | …"]]},{"q":"Elemen operasi dalam program ergonomik TIDAK termasuk:","o":["Pencegahan dan kawalan bahaya","Pengurusan perubatan","Dasar ergonomik bertulis","Pengenalpastian dan penilaian risiko"],"a":2,"e":"Operational elements: risk identification & assessment, hazard prevention & control, medical management, training & education, program review. Dasar bertulis ialah elemen kepimpinan.","r":[[25,226,"Operational Elements | Ergonomics Risk Identification & Assessment | Hazard Prevention & Control | Medical Management | Training & Education | Regular program Review and Evaluation"]]},{"q":"Penilaian awal ergonomik (initial assessment) dilakuk entrated formulations. • WHO/ILO highlight that …"]]},{"q":"Iklim panas seperti di Malaysia meningkatkan risiko pendedahan kerana:","o":["Angin tidak bertiup","Kelembapan dan peluh meningkatkan penyerapan kulit","Racun perosak menjadi tidak aktif","Pekerja memakai lebih banyak PPE"],"a":1,"e":"Environmental conditions: kelembapan dan berpeluh meningkatkan penyerapan kulit; iklim panas → risiko lebih tinggi berbanding negara sederhana.","r":[[28,323,"Factors Affecting Level of Exposure | Environmental Conditions | • Wind & temperature → increase spray drift and evaporation. | • Humidity & sweating →enhance dermal absorption. | • Hot climates (like Malaysia) →higher worker exposure risk compared to temperate countries."]]},{"q":"Semasa memuatkan racun perosak, pekerja TIDAK boleh:","o":["Mengalirkan bekas sepenuhnya ke dalam tangki","Memastikan hos di atas paras cecair","Memuat di dalam bangunan","Menyedut hos untuk memulakan aliran produk"],"a":3,"e":"Safe loading: muatkan di dalam atau membelakangi angin, alirkan bekas sepenuhnya, hos di atas paras cecair, jangan sekali-kali sedut hos.","r":[[35,327,"Safe Loading of Pesticides | • Load products indoors or with back to the wind. | • Drain containers fully into spray tank. | • Keep hose above liquid level to prevent backflow. | • Never suck the hose to start product flow."]]},{"q":"Semasa penggunaan racun perosak, muncung yang tersumbat:","o":["Perlu dibersihkan dengan lidah","Tidak boleh dibuka dengan mulut","Perlu ditiup dengan mulut","Boleh dibiarkan"],"a":1,"e":"During application: never unblock nozzles with your mouth; jangan semburan dalam angin kencang atau hujan.","r":[[37,328,"During Application | • Wear PPE as recommended. | • Do not spray in strong wind or rain. | • Stay out of spray cloud; work downwind. | • Avoid spraying water bodies, pollinator areas, organic crops. | • Never unblock nozzles with your mouth. | • Keep application time as short as possible. | • Rotate staff to reduce …"]]},{"q":"Pakaian k
