<title>Kuiz SHO NIOSH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: safety-signage language — green "safe condition" bands, hazard-yellow accents, a single reading column of question cards */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#e9eee8; --ink:#16201a; --muted:#56635a; --line:#d3dbd2;
  --green:#00794a; --green-ink:#ffffff; --green-soft:#dcefe4; --yellow:#f5c400; --yellow-ink:#1c1a10;
  --red:#b3261e; --red-soft:#f8e1de; --focus:#0b5cad;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#18201b; --surface-2:#202a24; --ink:#e7eee9; --muted:#9db0a3; --line:#2c3a31;
  --green:#2fae74; --green-ink:#06130c; --green-soft:#173426; --yellow:#f5c400; --yellow-ink:#1c1a10;
  --red:#ff8a80; --red-soft:#3a1b19; --focus:#7db7ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#18201b; --surface-2:#202a24; --ink:#e7eee9; --muted:#9db0a3; --line:#2c3a31;
  --green:#2fae74; --green-ink:#06130c; --green-soft:#173426; --yellow:#f5c400; --yellow-ink:#1c1a10;
  --red:#ff8a80; --red-soft:#3a1b19; --focus:#7db7ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hazard{height:10px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px)}
header.top{background:var(--green);color:var(--green-ink)}
header.top .wrap{padding-block:22px 20px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-display);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:14px;opacity:.9}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.08}
h1{font-size:clamp(34px,6vw,52px);font-weight:800;letter-spacing:.005em}
.sub{margin:0;max-width:60ch;opacity:.92}
.crumbs{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:15px}
.crumbs button{background:none;border:0;padding:2px 0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
main .wrap{padding-block:24px 64px;display:flex;flex-direction:column;gap:18px}
/* module cards */
.modgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:600px){.modgrid{grid-template-columns:1fr}}
.mod{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px 18px 16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.mod:hover{transform:translateY(-2px);border-color:var(--green)}
.mod .num{font-family:var(--f-display);font-weight:800;font-size:56px;line-height:.9;color:var(--green)}
.mod h2{font-size:24px;font-weight:700}
.mod .en{color:var(--muted);font-size:14px}
.mod .meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;font-variant-numeric:tabular-nums}
.mod .bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.mod .bar i{display:block;height:100%;background:var(--green)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:14px;color:var(--muted)}
.howto div{border-left:4px solid var(--yellow);padding:2px 0 2px 10px}
.howto b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
@media (max-width:600px){.howto{grid-template-columns:1fr}}
/* chapter list */
.chlist{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer}
.ch:hover:not(:disabled){border-color:var(--green)}
.ch:disabled{cursor:not-allowed;opacity:.55}
.ch .id{font-family:var(--f-mono);font-weight:600;font-size:14px;background:var(--surface-2);padding:4px 8px;border-radius:4px;min-width:62px;text-align:center}
.ch .t{font-weight:600;line-height:1.3}
.ch .s{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:2px}
.ch .score{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ch .score.done{color:var(--green);font-weight:600}
/* quiz */
.qbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.qbar .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.qbar .stat{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.qbar .stat b{color:var(--ink)}
.prog{flex:1 1 160px;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:120px}
.prog i{display:block;height:100%;background:var(--green);transition:width .3s}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:5px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.q .qn{display:flex;gap:12px;align-items:flex-start}
.q .badge{flex:none;font-family:var(--f-display);font-weight:800;font-size:20px;width:40px;height:40px;display:grid;place-items:center;background:var(--yellow);color:var(--yellow-ink);border-radius:4px}
.q .qt{font-weight:600;font-size:17px;line-height:1.4;padding-top:6px;min-width:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--green)}
.opt .L{font-family:var(--f-display);font-weight:700;font-size:17px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--surface-2)}
.opt .mk{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.opt.picked{border-color:var(--ink);background:var(--surface-2)}
.opt.picked .L{background:var(--ink);color:var(--surface)}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .L{background:var(--green);color:var(--green-ink)}
.opt.correct .mk{color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .L{background:var(--red);color:var(--surface)}
.opt.wrong .mk{color:var(--red)}
.opt:disabled{cursor:default}
.opt.pending{border-color:var(--yellow);border-style:dashed;background:var(--surface-2)}
.opt.pending .L{background:var(--yellow);color:var(--yellow-ink)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface-2);border-left:4px solid var(--yellow);border-radius:6px;padding:10px 12px}
.confirm[hidden]{display:none}
.confirm p{margin:0;font-weight:600}
.confirm .acts{display:flex;gap:8px;flex-wrap:wrap}
.confirm .yes{background:var(--green);color:var(--green-ink);border:0;padding:8px 14px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.confirm .no{background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:8px 14px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.confirm .no:hover{border-color:var(--ink)}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.hint{font-size:14px;color:var(--muted)}
.reveal{background:var(--ink);color:var(--surface);border:0;padding:9px 16px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.reveal:hover{background:var(--green);color:var(--green-ink)}
.ans{border-top:2px solid var(--green);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.ans .lab{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--green)}
.ans p{margin:0;max-width:68ch}
.ref{background:var(--surface-2);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ref .where{font-family:var(--f-mono);font-size:13px;line-height:1.5;display:flex;flex-wrap:wrap;gap:4px 8px}
.ref .where span{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:1px 7px;white-space:nowrap}
.ref .where span.k{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow);font-weight:600}
.ref blockquote{margin:0;font-size:14px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;overflow-wrap:anywhere}
.done-card{background:var(--green);color:var(--green-ink);border-radius:6px;padding:20px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.done-card h2{font-size:28px}
.done-card .btn{background:var(--green-ink);color:var(--green);border-color:transparent}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:20px;color:var(--muted)}
/* participant strip + registration */
.whobar{background:var(--ink);color:var(--surface);font-size:14px}
.whobar[hidden]{display:none}
.whobar .wrap{padding-block:7px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.whobar b{font-weight:700}
.whobar button{background:none;border:1px solid currentColor;color:inherit;border-radius:4px;padding:2px 10px;cursor:pointer;font-size:13px;opacity:.85}
.whobar button:hover{opacity:1}
.sync{font-family:var(--f-mono);font-size:12px;opacity:.8}
.reg{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--green);border-radius:6px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;max-width:560px}
.reg h2{font-size:28px}
.reg p{margin:0;color:var(--muted)}
.reg label{font-weight:600;display:flex;flex-direction:column;gap:6px}
.reg input{font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.reg input:focus{border-color:var(--green);outline:none}
.reg .go{align-self:flex-start;background:var(--green);color:var(--green-ink);border:0;padding:11px 20px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.reg .err{color:var(--red);font-size:14px;min-height:1.2em}
.reg [hidden]{display:none}
.reg form{display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface-2);border-radius:7px;padding:4px}
.seg button{border:0;background:transparent;padding:9px 8px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.03em;cursor:pointer;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.reg .acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.reg .go:disabled{opacity:.6;cursor:wait}
.link{background:none;border:0;padding:0;color:var(--green);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px;font-weight:600}
.emline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--surface-2);border-radius:6px;padding:10px 12px;font-size:15px;overflow-wrap:anywhere}
.whobar .em{opacity:.7;font-size:13px;overflow-wrap:anywhere}
.resume{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--yellow);border-radius:6px;padding:14px 16px}
.resume .k{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--muted)}
.resume .t{font-weight:600;font-size:17px;line-height:1.3}
.resume .go2{background:var(--green);color:var(--green-ink);border:0;padding:9px 16px;border-radius:5px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.danger{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:6px;padding:14px 16px;margin-top:8px}
.danger h3{font-size:19px}
.danger p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:52ch}
.danger .confirm{flex-basis:100%;border-left-color:var(--red)}
.danger .confirm p{color:var(--ink);font-size:15px}
.danger .btn{color:var(--red);border-color:var(--red)}
.confirm .danger-yes{background:var(--red);color:#fff}
.welcome{background:var(--green-soft);border-radius:6px;padding:10px 14px;font-weight:600}
footer{color:var(--muted);font-size:13px;text-align:center;padding-block:0 40px}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
</style>

<canvas id="fx" aria-hidden="true"></canvas>
<div class="hazard" aria-hidden="true"></div>
<div class="whobar" id="who" hidden></div>
<header class="top"><div class="wrap" id="hdr"></div></header>
<div id="bar"></div>
<main><div class="wrap" id="view"></div></main>
<footer><div class="wrap">Soalan disediakan berdasarkan Buku Kursus SHO NIOSH Modul 1–4. Rujukan slaid mengikut penomboran dalam buku kursus.</div></footer>

<script>
const DATA = /*__DATA__*/null;
const LET = ['A','B','C','D'];
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = id=>'c'+id.toLowerCase().replace('.','-');
const findCh = h=>{for(const m of DATA.modules)for(const c of m.chapters)if(slug(c.id)===h)return [m,c];return [null,null]};

/* Google Apps Script web app that writes marks into the "Markah Kuiz SHO" sheet (empty = marks kept on this device only) */
const SHEET_URL = '/*__SHEET_URL__*/';
const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const VER = {}; for(const m of DATA.modules) for(const c of m.chapters) VER[c.id]=c.v;

const LV = {}; for(const m of DATA.modules) for(const c of m.chapters) LV[c.id]=c.lv;

/* participant (identified by e-mail) + progress: kept per e-mail on this device and copied to the sheet so it can be resumed anywhere */
let ME = null; try{ ME = JSON.parse(LS.get('kuizsho:me')||'null') }catch(e){ ME = null }
if(ME && !(ME.email && ME.name)) ME = null;
const LEGACY_NAME = LS.get('kuizsho:user');            // name-only registration from the previous version
let PROG = {}, WELCOME = '';
const pkey = em=>'kuizsho:e:'+em.toLowerCase();
/* keep only chapters whose question set is unchanged (old saves carry no version = first set) */
function prune(p){ const o={}; for(const [id,s] of Object.entries(p||{})) if(VER[id] && s && s.first && (s.v||LV[id])===VER[id]) o[id]={v:VER[id],pick:s.pick||{},first:s.first||{},rev:s.rev||{},t:+s.t||0}; return o; }
const readLS = k=>{ const raw=LS.get(k); if(!raw) return {}; try{ return prune(JSON.parse(raw)) }catch(e){ return {} } };
function localProg(email, name){ // this device's saves for this participant, including saves made before e-mail registration
  let p = readLS(pkey(email));
  for(const k of [name && 'kuizsho:p:'+name.toLowerCase(), 'kuizsho']) if(k) p = mergeProg(p, readLS(k))[0];
  return p;
}
const answered = s=>Object.keys((s&&s.first)||{}).length;
/* per chapter, keep the most recently changed attempt (a reset counts as a change);
   saves made before change times were recorded fall back to the attempt with more answers */
const newer = (a,b)=> (a.t||b.t) ? (a.t||0) > (b.t||0) : answered(a) > answered(b);
function mergeProg(base, extra){
  const out = {...base}, won = [];
  for(const [id,s] of Object.entries(extra)) if(!out[id] || newer(s, out[id])){ out[id] = s; won.push(id); }
  return [out, won];
}
let saveT = 0;
const save=()=>{ if(!ME) return; LS.set(pkey(ME.email), JSON.stringify(PROG)); clearTimeout(saveT); saveT = setTimeout(pushProgress, 2500); };
/* every progress upload also carries the current mark of each answered chapter, so the sheet can always be brought up to date */
function allScores(){
  const out = {};
  for(const m of DATA.modules) for(const c of m.chapters){ const [ok,ans] = chScore(c); if(ans) out[c.id] = {m:m.n, s:ok}; }
  return out;
}
function pushProgress(){ if(ME) queue({action:'progress', email:ME.email, name:ME.name, progress:PROG, scores:allScores(), t:Date.now()}); }
if(ME) PROG = readLS(pkey(ME.email));

/* outbox: messages waiting to be sent to the sheet; survives reloads and offline periods */
let OUTBOX = []; try{ OUTBOX = JSON.parse(LS.get('kuizsho:outbox')||'[]')||[] }catch(e){ OUTBOX = [] }
OUTBOX = OUTBOX.filter(x=>x.email);                     // drop name-only messages from the previous version
let flushT = 0, flushing = false, lastErr = false;
function queue(msg){
  if(msg.action==='score') OUTBOX = OUTBOX.filter(x=>!(x.action==='score' && x.email===msg.email && x.chapter===msg.chapter));
  if(msg.action==='progress') OUTBOX = OUTBOX.filter(x=>!(x.action==='progress' && x.email===msg.email));
  OUTBOX.push(msg); LS.set('kuizsho:outbox', JSON.stringify(OUTBOX)); schedule(1200);
}
function schedule(ms){ clearTimeout(flushT); flushT = setTimeout(flush, ms); }
async function flush(){
  if(!SHEET_URL || flushing || !OUTBOX.length){ syncUI(); return; }
  flushing = true; syncUI();
  while(OUTBOX.length){
    const msg = OUTBOX[0];
    try{
      await fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(msg)});
      /* remove exactly the message that was sent: newer messages may have been queued (and older duplicates dropped) while it was in flight */
      OUTBOX = OUTBOX.filter(x=>x!==msg); LS.set('kuizsho:outbox', JSON.stringify(OUTBOX)); lastErr = false;
    }catch(e){ lastErr = true; flushing = false; syncUI(); schedule(15000); return; }
  }
  flushing = false; syncUI();
}
addEventListener('online', ()=>schedule(300));
function syncUI(){
  const el = $('#sync'); if(!el || !ME) return;
  const mine = OUTBOX.filter(x=>x.email===ME.email).length;
  el.textContent = !SHEET_URL ? 'Kemajuan disimpan dalam peranti ini' : mine ? (lastErr ? `Tiada sambungan · ${mine} kemas kini menunggu` : 'Menyimpan…') : 'Disimpan ✓';
}
function sendScore(m,c){
  if(!ME) return;
  const [ok] = chScore(c);
  queue({action:'score', email:ME.email, name:ME.name, module:m.n, chapter:c.id, score:ok, t:Date.now()});
}
const modOf = id=>DATA.modules.find(m=>m.chapters.some(c=>c.id===id));
const chOf = id=>modOf(id).chapters.find(c=>c.id===id);
const cleanName = s=>String(s||'').replace(/\s+/g,' ').trim().replace(/^[=+\-@']+/,'').slice(0,80);
const cleanEmail = s=>{ const e=String(s||'').trim().toLowerCase(); return /^[^\s@=+]+@[^\s@]+\.[^\s@]+$/.test(e) && e.length<=120 ? e : ''; };
function renderWho(){
  const w = $('#who'); w.hidden = !ME; if(!ME){ w.innerHTML=''; return; }
  w.innerHTML = `<div class="wrap"><span>Peserta: <b>${esc(ME.name)}</b> <span class="em">${esc(ME.email)}</span> <span class="sync" id="sync"></span></span><button id="sw">Tukar peserta</button></div>`;
  $('#sw').onclick = ()=>{ ME = null; LS.del('kuizsho:me'); PROG = {}; renderWho(); go(''); };
  syncUI();
}
/* sign in: merge this device's saves with the copy kept in the sheet, then upload whatever the sheet is missing */
function signIn(email, name, remote, isNew){
  ME = {email, name}; LS.set('kuizsho:me', JSON.stringify(ME)); LS.set('kuizsho:last', email); LS.set('kuizsho:lastme', JSON.stringify(ME));
  const [merged, won] = mergeProg(prune(remote||{}), localProg(email, name));
  PROG = merged; LS.set(pkey(email), JSON.stringify(PROG));
  if(isNew) queue({action:'register', email, name, t:Date.now()});
  if(Object.keys(PROG).length) pushProgress();   // also re-sends every chapter's mark, repairing any mark that did not arrive
  WELCOME = isNew ? '' : name;
  renderWho(); route();
}
/* look up a registered e-mail (JSONP, so it works from any page origin) */
function lookup(email){
  return new Promise((resolve, reject)=>{
    const cb = '__kz'+Date.now(), s = document.createElement('script'); let done = false;
    const end = ()=>{ done = true; clearTimeout(t); delete window[cb]; s.remove(); };
    const t = setTimeout(()=>{ if(!done){ end(); reject(new Error('timeout')) } }, 20000);
    window[cb] = d=>{ end(); resolve(d) };
    s.onerror = ()=>{ if(!done){ end(); reject(new Error('network')) } };
    s.src = SHEET_URL+'?action=lookup&email='+encodeURIComponent(email)+'&callback='+cb;
    document.head.appendChild(s);
  });
}

/* where to continue: the first chapter left unfinished, else the chapter after the last one completed */
function nextChapter(){
  const all = DATA.modules.flatMap(m=>m.chapters.filter(c=>c.qs.length).map(c=>[m,c]));
  const started = all.filter(([m,c])=>chScore(c)[1]>0);
  if(!started.length) return null;
  const open = started.find(([m,c])=>chScore(c)[1]<c.qs.length);
  if(open) return open;
  const lastDone = all.indexOf(started[started.length-1]);
  return all.slice(lastDone+1).find(([m,c])=>!chScore(c)[1]) || null;
}

/* unconfirmed choice per question (in memory only) */
let PEND = {};
function pick(c,i,k){
  const s=st(c.id); if(s.rev[i] || s.pick[i]!==undefined) return;
  PEND[i]=k; paint(c,i);
  $('#q'+i+' .yes').focus({preventScroll:true});
}
function confirmPick(c,i){
  const s=st(c.id), k=PEND[i]; if(k===undefined || s.rev[i]) return;
  delete PEND[i];
  s.pick[i]=k; if(s.first[i]===undefined) s.first[i]=k; touch(c.id); save();
  paint(c,i); stats(c);
  sendScore(DATA.modules.find(m=>m.chapters.includes(c)), c);
  const card=$('#q'+i);
  if(k===c.qs[i].a){ const r=card.querySelector(`.opt[data-k="${k}"]`).getBoundingClientRect(); celebrate(r.left+r.width/2, r.top+r.height/2); }
  card.querySelector('.reveal').focus({preventScroll:true});
}
function reveal(c,i){ const s=st(c.id); delete PEND[i]; s.rev[i]=1; if(s.first[i]===undefined) s.first[i]=-1; touch(c.id); save(); paint(c,i); stats(c); }

function paint(c,i){
  const q=c.qs[i], s=st(c.id), card=$('#q'+i), p=s.pick[i], rev=!!s.rev[i], locked=p!==undefined, pend=(!rev&&!locked)?PEND[i]:undefined;
  card.querySelectorAll('.opt').forEach(b=>{
    const k=+b.dataset.k; b.className='opt'; b.disabled=rev||locked; const mk=b.querySelector('.mk'); mk.textContent='';
    if(rev){ if(k===q.a){b.classList.add('correct');mk.textContent='Jawapan'} else if(k===p){b.classList.add('wrong');mk.textContent='Pilihan anda'} }
    else if(k===p){ b.classList.add('picked'); mk.textContent='Disahkan'; }
    else if(k===pend) b.classList.add('pending');
  });
  const cf=card.querySelector('.confirm'); cf.hidden = pend===undefined;
  if(pend!==undefined) cf.querySelector('p').textContent=`Anda pasti dengan jawapan ${LET[pend]}?`;
  card.querySelector('.hint').textContent = rev ? (p===q.a?'Anda menjawab dengan betul.':p===undefined?'Anda tidak memilih jawapan.':'Jawapan anda kurang tepat.') : locked ? `Jawapan ${LET[p]} disahkan. Tekan Dedah jawapan untuk melihat penerangan.` : pend!==undefined ? 'Sahkan pilihan anda.' : 'Pilih satu jawapan.';
  card.querySelector('.reveal').hidden = rev;
  const a=card.querySelector('.ans'); a.hidden=!rev;
  if(rev && !a.innerHTML){
    a.innerHTML = `<div class="lab">Jawapan: ${LET[q.a]} · ${esc(q.o[q.a])}</div>
      <p>${esc(q.e)}</p>
      ${q.r.map(([sl,pg,ex])=>`<div class="ref"><div class="where"><span class="k">Slaid ${sl}</span><span>Bab ${esc(c.id)} · ${esc(c.title)}</span><span>Slaid ${sl} daripada ${c.total}</span><span>Halaman ${pg}</span></div>
        <blockquote>${ex.split(' | ').map(esc).join('<br>')}</blockquote></div>`).join('')}`;
  }
}
function stats(c){
  const s=st(c.id); let ans=0,ok=0;
  c.qs.forEach((q,i)=>{ if(s.first[i]!==undefined && s.first[i]!==-1 || s.rev[i]){ans++} if(s.first[i]===q.a)ok++; });
  $('#nAns').textContent=ans; $('#nOk').textContent=ok; $('#pBar').style.width=(ans/c.qs.length*100)+'%';
  const fin=$('#fin');
  if(ans===c.qs.length){
    const [m] = DATA.modules.filter(m=>m.chapters.includes(c)); const idx=m.chapters.indexOf(c); const nx=m.chapters.slice(idx+1).find(x=>x.qs.length);
    fin.innerHTML=`<div class="done-card"><div><div class="eyebrow">Bab selesai</div><h2>Markah ${ok}/${c.qs.length}</h2><div style="opacity:.9;font-size:14px">1 markah bagi setiap jawapan betul yang disahkan</div></div>
      ${nx?`<button class="btn" id="nxt">Bab seterusnya: ${esc(nx.id)} ›</button>`:`<button class="btn" id="nxt">Kembali ke Modul ${m.n}</button>`}</div>`;
    $('#nxt').onclick=()=>go(nx?slug(nx.id):'m'+m.n);
  } else fin.innerHTML='';
}

/* ---- fireworks ---- */
const fx=$('#fx'), ctx=fx.getContext('2d'); let parts=[], rockets=[], raf=0, W=0, H=0, DPR=1;
const COLS=['#f5c400','#2fae74','#ff5a36','#3fa9f5','#ffffff','#ff4fa3','#9b6bff'];
function size(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;fx.width=W*DPR;fx.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size); size();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x,y,n){const col=COLS[Math.random()*COLS.length|0], col2=COLS[Math.random()*COLS.length|0];
  for(let j=0;j<n;j++){const a=Math.random()*Math.PI*2, sp=2+Math.random()*(reduce?3:6.5);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:.008+Math.random()*.012,c:Math.random()<.7?col:col2,r:1.6+Math.random()*1.8})}}
function celebrate(ox,oy){
  burst(ox,oy,reduce?40:90);
  if(!reduce){
    const n=7; for(let k=0;k<n;k++){ const tx=W*(.1+.8*Math.random()), ty=H*(.12+.4*Math.random());
      rockets.push({x:tx+(Math.random()-.5)*60,y:H+10,tx,ty,delay:k*140+Math.random()*120,t0:performance.now()}); }
  }
  if(!raf) raf=requestAnimationFrame(tick);
}
function tick(now){
  ctx.globalCompositeOperation='destination-out'; ctx.fillStyle='rgba(0,0,0,0.28)'; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  rockets=rockets.filter(r=>{ if(now-r.t0<r.delay) return true;
    r.y-= (r.y-r.ty)*.09+3; r.x+=(r.tx-r.x)*.06;
    ctx.fillStyle='#fff3c4'; ctx.beginPath(); ctx.arc(r.x,r.y,2.2,0,7); ctx.fill();
    if(r.y-r.ty<6){burst(r.x,r.y,80); return false} return true; });
  parts=parts.filter(p=>{ p.vx*=.985; p.vy=p.vy*.985+.06; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
    if(p.life<=0) return false; ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); return true; });
  ctx.globalAlpha=1;
  if(parts.length||rockets.length) raf=requestAnimationFrame(tick); else {ctx.clearRect(0,0,W,H); raf=0}
}

/* a returning device picks up answers made on other devices since it was last used */
async function refreshFromSheet(){
  if(!ME || !SHEET_URL) return;
